resolver = "2"

[package]
name = "chump"
version = "0.2.0"
edition = "2021"
description = "Self-hosted Rust agent: OpenAI-compatible inference, rich tools, SQLite state, optional web PWA and Discord"
repository = "https://github.com/repairman29/chump"
homepage = "https://repairman29.github.io/chump/"
license = "AGPL-3.0-only"
readme = "README.md"

[[bin]]
name = "chump"
path = "src/main.rs"

[[bin]]
name = "fleet-ws-echo"
path = "src/bin/fleet_ws_echo.rs"

[[bin]]
name = "bandit-replay"
path = "src/bin/bandit-replay.rs"

[[bin]]
name = "chump-consensus-aggregator-daemon"
path = "src/bin/consensus_aggregator_daemon.rs"

[[bin]]
name = "quantum-tool-choice"
path = "experiments/quantum_tool_choice.rs"

[features]
default = ["web-push"]
# Server-side Web Push (VAPID) for PWA subscribers. Default-on so Mac/web builds keep
# push; Android cross-builds drop it (--no-default-features) because `web-push` → `ece`
# → `openssl-sys` has no target OpenSSL on aarch64-linux-android (RESILIENT-336).
web-push = ["dep:web-push"]
# In-process embeddings via fastembed (no Python embed server). Model downloaded on first use.
inprocess-embed = ["dep:fastembed", "dep:once_cell"]
# In-process chat via mistral.rs (mistralrs). On Apple Silicon, also enable `mistralrs-metal` for GPU.
mistralrs-infer = ["dep:mistralrs"]
mistralrs-metal = ["mistralrs-infer", "mistralrs/metal"]
# WASM tool runner uses wasmtime CLI (no crate). wasm_calc / wasm_text are enabled when wasm/*.wasm artifacts exist.
# Heap profiling via dhat-rs. Use: cargo run --release --features dhat-heap
dhat-heap = ["dep:dhat"]
# Dev-only tokio-console support. Use: cargo run --features tokio-console
tokio-console = ["dep:console-subscriber", "tokio/tracing"]
# Telegram messaging adapter. V1 send-only over reqwest needs no extra deps; the
# feature flag exists so V2 (long-poll/webhook) can opt into a richer client.
telegram = []
# Browser automation. V1 is empty (scaffold only — see src/browser.rs and
# docs/operations/BROWSER_AUTOMATION.md). V2 will pull in chromiumoxide / thirtyfour and
# enable the real `browser` tool backend.
browser-automation = []
# SECURITY-004 Path B: Discord gateway (serenity).
#
# RESILIENT-266 (2026-08-09): the vulnerable chain is GONE. This used to read
# "still vulnerable until serenity v0.13 ships" because the dep opted into
# rustls_backend, pulling tokio-tungstenite 0.21 → rustls 0.22 →
# rustls-webpki 0.102.8 (RUSTSEC-2026-0104, HIGH DoS). The dep now uses
# native_tls_backend (see the serenity line below), which drops that chain
# entirely — verified: cargo tree -i rustls-webpki@0.102.8 --features discord
# matches no packages. SECURITY-005's runtime gate in main.rs is removed.
#
# Default is STILL OFF, but now purely on COST, not security: measured
# 2026-08-09 on this machine, --features discord adds +6.2MB to the binary
# (55.7MB → 62.2MB) and takes 14m27s to build cold. Opt in with
# `--features discord`, or use scripts/setup/install-discord-gateway.sh
# which builds and installs the launchd daemon in one step.
discord = ["dep:serenity"]
# Sprint A1 (Defense Trinity): encrypted-at-rest SQLite via sqlcipher.
# Disabled by default — requires a passphrase strategy (CHUMP_DB_PASSPHRASE env var
# or Keychain) and a migration path from existing plain DBs. When enabled, db_pool
# runs PRAGMA key on every connection. See docs/SPRINT_A_ENCRYPTED_DB.md for the
# full design and migration procedure.
#
# To build with encryption:
#   cargo build --release --no-default-features --features encrypted-db,...
# (You must list all other features you want since we disable defaults.)
encrypted-db = []

[dependencies]
console-subscriber = { version = "0.5", optional = true }
dhat = { version = "0.3", optional = true }
# `version` is required for `cargo publish` on the root crate once these crates
# exist on crates.io at the pinned versions; workspace builds still use `path`.
chump-tool-macro = { path = "chump-tool-macro", version = "0.2.0" }
chump-agent-lease = { path = "crates/chump-agent-lease", version = "0.3.0" }
chump-orchestrator = { path = "crates/chump-orchestrator", version = "0.2.0" }
chump-planner = { path = "crates/chump-planner", version = "0.1.0" }
chump-ship = { path = "crates/chump-ship", version = "0.2.0" }
chump-mcp-lifecycle = { path = "crates/chump-mcp-lifecycle", version = "0.2.0" }
chump-cancel-registry = { path = "crates/chump-cancel-registry", version = "0.2.0" }
chump-perception = { path = "crates/chump-perception", version = "0.2.0" }
chump-cost-tracker = { path = "crates/chump-cost-tracker", version = "0.2.0" }
chump-gap-store = { path = "crates/chump-gap-store", version = "0.2.0" }
chump-messaging = { path = "crates/chump-messaging", version = "0.2.0" }
chump-ambient-cli = { path = "crates/ambient-cli", version = "0.1.0" }
chump-preflight = { path = "crates/chump-preflight", version = "0.1.0" }
chump-verify = { path = "crates/chump-verify", version = "0.1.0" }
chump-paramedic = { path = "crates/chump-paramedic", version = "0.1.0" }
chump-team = { path = "crates/chump-team", version = "0.1.0" }
chump-ast-crawler = { path = "crates/ast-crawler", version = "0.1.0" }
chump-handoff = { path = "crates/chump-handoff", version = "0.1.0" } # INFRA-2108: external-repo schema
chump-inventory = { path = "crates/chump-inventory", version = "0.1.0" } # EFFECTIVE-401: fleet inventory + tech-debt audit DB
chump-eval-harness = { path = "crates/chump-eval-harness", version = "0.1.0" }
chump-db-pool = { path = "crates/chump-db-pool", version = "0.1.0" }
chump-memory-db = { path = "crates/chump-memory-db", version = "0.1.0" } # EFFECTIVE-410: memory store extracted from bin (build-speed)
chump-atomic-claim = { path = "crates/chump-atomic-claim", version = "0.1.0" } # EFFECTIVE-399: atomic gap-claim + autonomy_level + worktree_build_cache
chump-bench = { path = "crates/chump-bench", version = "0.1.0" } # EFFECTIVE-405: ChumpBench — run a track as a scoreable lap
chump-waste-tally = { path = "crates/chump-waste-tally", version = "0.1.0" } # EFFECTIVE-411: waste-tally reports (build-speed extraction)
chump-kpi-report = { path = "crates/chump-kpi-report", version = "0.1.0" } # EFFECTIVE-418: KPI/impact reports (build-speed extraction)
chump-cron = { path = "crates/chump-cron", version = "0.1.0" } # INFRA-2057: chump cron — cron expr to launchd/systemd generator
# META-175: JetStream durable consumer per role — needed by web_server handle_fleet_wire_health.
chump-coord = { path = "crates/chump-coord", version = "0.2.0" }
async-nats = "0.50"
inventory = "0.3"
axonerai = "0.1"
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1.0"
libc = "0.2"
thiserror = { version = "2.0", optional = true }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
scraper = "0.27"
r2d2 = "0.8"
# Plain bundled SQLite. Encryption (sqlcipher) was tried in a previous sprint but broke
# backward compatibility with existing plain DBs and lacked a passphrase management
# system. See docs/strategy/NEXT_GEN_COMPETITIVE_INTEL.md (IronClaw Sprint A) for the proper
# encrypted-db feature design that needs implementation before re-introducing sqlcipher.
r2d2_sqlite = { version = "0.25", features = ["bundled"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.118", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1.1", features = ["parse"] }
base64 = "0.23"
aes-gcm = "0.11"
serenity = { version = "0.12", optional = true, default-features = false, features = ["client", "gateway", "model", "http", "utils", "cache", "native_tls_backend"] }
fastembed = { version = "6", optional = true }
once_cell = { version = "1.19", optional = true }
axum = { version = "0.8", features = ["macros", "json", "multipart"] }
tower = { version = "0.5", features = ["timeout", "util"] }
tower-http = { version = "0.7", features = ["cors", "fs", "compression-gzip", "trace", "limit"] }
mime_guess = "2"
notify = "8"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
patch = { version = "0.7", default-features = false }
jsonschema = { version = "0.56", default-features = false }
serde_yaml = "0.9"
mistralrs = { version = "0.8.1", optional = true, default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
web-push = { version = "0.11", default-features = false, features = ["hyper-client"], optional = true }
mimalloc = { version = "0.1", default-features = false }
wasmtime = "48"
wasmtime-wasi = "48"
wasi-common = "46"
sha2 = "0.11.0"
hex = "0.4.3"

[profile.dev]
# EFFECTIVE-393 (build-speed): the dev/test/CI profile. Cold builds of the
# ~190k-line `chump` bin crate dominate fleet time — fresh `chump claim`
# worktrees, CI, and the auto-deploy `cargo install` all pay it (~5m20s cold,
# though a warm incremental touch-rebuild is only ~10s). Two mac-specific,
# zero-external-tool link-time cuts:
#   - split-debuginfo="unpacked": skip the slow dsymutil .dSYM-bundling step at
#     link time (unpacked leaves .o debug info in place; backtraces still work).
#   - debug=1 (line-tables-only): keep file:line in panics but drop the heavy
#     variable/type debug tables — ZERO-WASTE-025 measured those at 94% of the
#     artifact — cutting codegen + link + on-disk size on every cold build.
# Inner-loop correctness (assertions/backtraces) is unchanged.
split-debuginfo = "unpacked"
debug = 1

[profile.release]
# ZERO-WASTE-025: ship without debug symbols. Measured 2026-07-23: the
# debug=true binary was 906MB, of which 847MB (94%) was debug tables —
# stripped it's 59MB. strip="debuginfo" drops the debug tables but KEEPS
# the symbol table, so panic backtraces still show function names. Anyone
# who needs full profiling debug info builds with the `release-with-debug`
# profile below (which overrides this).
debug = false
strip = "debuginfo"
lto = "thin"
codegen-units = 1

[profile.release-with-debug]
inherits = "release"
# Full debug info for best profiler backtraces
debug = true
strip = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
wiremock = "0.6"
serial_test = "4"
tempfile = "3"
# INFRA-693: enable the `test-helpers` feature so briefing/kpi_report tests
# can keep calling `store.conn_for_test()` to seed synthetic gaps.
chump-gap-store = { path = "crates/chump-gap-store", version = "0.2.0", features = ["test-helpers"] }

## Note: this repo previously used a local reqwest patch to force rustls.
## We now rely on `reqwest` with `rustls-tls` enabled in [dependencies].

# RESILIENT-336 (2026-08-16): Android (aarch64-linux-android) cross-builds pull
# native-tls -> openssl -> openssl-sys via `axonerai` (which declares reqwest with
# default features). There is no target OpenSSL on Android, so force openssl's
# `vendored` feature for Android targets only (compiles OpenSSL from source with the
# NDK clang). Mac builds are unaffected. The durable fix is patching axonerai to
# rustls-tls (INFRA-3627); this unblocks the cross-build until that lands.
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

# INFRA-3677 sibling (build-fleet-binaries.yml ribbon unblock): the
# aarch64-unknown-linux-gnu CROSS build (from the x86_64 GH runner) hits the
# SAME openssl-sys wall as Android — no aarch64 system OpenSSL / pkg-config
# sysroot on the runner, so `openssl-sys` fails with "Could not find openssl
# via pkg-config" and the whole matrix run goes red. A red run has
# conclusion=failure, so node-refresh-chump.sh's `runs?...&status=success`
# artifact query excludes it — which silently killed the fleet's fast-pull for
# BOTH targets (the good x86_64 artifact lives inside a run marked failed) and
# forced every node back to the ~30-min cold compile. Forcing openssl's
# `vendored` feature for the aarch64-linux target compiles OpenSSL from source
# with the gcc-aarch64 cross toolchain the workflow already installs, exactly
# like the Android precedent above. Native x86_64 (arch=x86_64) and macOS are
# unaffected (different cfg). Durable fix remains INFRA-3627 (axonerai →
# rustls-tls); this unblocks the cross-build until that lands.
[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

# Many modules expose public items for tests, trait surfaces, and future wiring; suppress
# dead_code noise so clippy stays actionable on real issues (unused imports/vars, style).
# Stylistic clippy lints relaxed at workspace level. These caught a wave of
# fleet-shipped PRs in 2026-05-07 because clippy 1.95 made them strict and
# fleet workers' Rust style predates the new defaults. They're cosmetic,
# not correctness; the cycle-thrash of force-pushing fixes outweighs the
# style benefit. If we ever want them back, downgrade to "warn" first to
# scrub the codebase, then back to "deny".
[workspace.lints.clippy]
# Names verified against clippy 1.95 lint index. Earlier INFRA-664 used
# 'doc_list_item_overindented' which is unknown; real name is
# 'doc_overindented_list_items'. Also allow unknown_lints rust warn
# so future clippy version mismatches don't block CI.
doc_overindented_list_items = "allow"
manual_strip = "allow"
manual_split_once = "allow"
lines_filter_map_ok = "allow"
manual_is_multiple_of = "allow"
never_loop = "allow"
manual_clamp = "allow"
field_reassign_with_default = "allow"
# Wave 3 (2026-05-08, observed on PRs #1277/#1278/#1290):
manual_range_contains = "allow"
# Wave 4 (2026-05-08, still blocking #1277/#1278/#1290 after wave 3):
collapsible_match = "allow"
manual_pattern_char_comparison = "allow"
redundant_closure = "allow"

[workspace.lints.rust]
dead_code = "allow"
unknown_lints = "allow"

# Root crate (chump) opts into workspace-defined lints. Without this section
# the root crate ignores [workspace.lints.*] and CI fails on the very lints
# we just relaxed (observed on PR #1265 first attempt).
[lints]
workspace = true

