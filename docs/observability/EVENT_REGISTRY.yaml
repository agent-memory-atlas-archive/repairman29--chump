    consumers: [ops-audit]
    fields_required: [ts, kind, claimed_gap, reason]

  - kind: prepush_lease_mismatch
    effect_metric: resilient
    emitter: scripts/git-hooks/pre-push Guard 5 (INFRA-2446)
    trigger: >
      Emitted by the RESILIENT-026 branch-name claim guard when one or more
