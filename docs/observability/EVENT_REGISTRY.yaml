  # ── INFRA-2188: disk-pressure structural fix (2026-06-02) ────────────────
  # cargo_reaper_aggressive_mode_engaged — emitted by cargo-target-reaper.sh
  # when free disk on $HOME drops below CHUMP_DISK_CRITICAL_GB (default 20GB).
  # Signals that age thresholds were tightened (FINGERPRINT_AGE_D→1, FLEET_AGE_D→2)
  # so fleet observers can correlate cold-build spikes with disk events.
  - kind: cargo_reaper_aggressive_mode_engaged
    effect_metric: disk_free_gb
    emitter: scripts/ops/cargo-target-reaper.sh (INFRA-2188)
    trigger: >
      cargo-target-reaper.sh detected free disk on $HOME below CHUMP_DISK_CRITICAL_GB
      (default 20GB) and escalated to aggressive pruning: FINGERPRINT_AGE_D forced to
      1d and FLEET_AGE_D to 2d for this run. Emitted once per run when escalation fires.
    consumers: [fleet-brief, disk-health-monitor, ops-audit]
    fields_required: [ts, kind, free_gb, disk_critical_gb, fingerprint_age_d, fleet_age_d]

  # ── RESILIENT-273: disk-critical-reactor shared-target self-heal (2026-08-09) ─
  # The reactor's terminal tier reclaims the bloated shared cargo target that the
  # delegated reaper structurally cannot (it holds the dir the fleet builds into).
  # DRY-RUN by default; armed via CHUMP_DISK_REACTOR_QUIESCE_EXECUTE=1.
  - kind: disk_reactor_quiesce_dryrun
    effect_metric: disk_free_gb
    emitter: scripts/coord/disk-critical-reactor.sh (RESILIENT-273)
    trigger: >
      Shared target exceeded SHARED_TARGET_CAP_GB while quiesce-execute was OFF
      (default). Reports what the self-heal would reclaim without touching disk.
    consumers: [fleet-brief, disk-health-monitor, ops-audit]
    fields_required: [ts, kind, target, target_gb, cap_gb, note]
  - kind: disk_reactor_quiesce_started
    effect_metric: disk_free_gb
    emitter: scripts/coord/disk-critical-reactor.sh (RESILIENT-273)
    trigger: >
      Armed self-heal began: stops the fleet, boots out the deploy daemons that
      ignore AUTONOMY_LEVEL, and kills in-flight builds before pruning.
    consumers: [fleet-brief, disk-health-monitor, ops-audit]
    fields_required: [ts, kind, target, target_gb, cap_gb]
  - kind: disk_reactor_quiesce_aborted
    effect_metric: disk_free_gb
    emitter: scripts/coord/disk-critical-reactor.sh (RESILIENT-273)
    trigger: >
      Self-heal refused to delete because builds were still holding the target
      after the bounded quiescence wait (RESILIENT-112 guard). Daemons restored.
    consumers: [fleet-brief, disk-health-monitor, ops-audit]
    fields_required: [ts, kind, reason, remaining_builds, waited_s]
  - kind: disk_reactor_quiesce_reclaimed
    effect_metric: disk_free_gb
    emitter: scripts/coord/disk-critical-reactor.sh (RESILIENT-273)
    trigger: >
      Self-heal pruned the over-cap shared target after confirming quiescence,
      then restored the deploy daemons. Reports GB freed.
    consumers: [fleet-brief, disk-health-monitor, ops-audit]
    fields_required: [ts, kind, target, reclaimed_gb_approx, free_gb_after]

  # ── RESILIENT-326: disk-critical-reactor halt/auto-resume governance (2026-08-15) ─
  # Prior to this fix, quiesce_and_reclaim() set AUTONOMY_LEVEL=0 to halt the
  # fleet but never restored it — a genuine multi-hour silent halt (the same
  # failure class the back-pressure breaker hit in RESILIENT-324). These two
  # kinds are the loud page + the auto-recovery proof: every halt this organ
  # causes is now paired with a page (autonomy_halt) and a guaranteed restore
  # on both the success and abort exit paths (autonomy_resume).
  - kind: disk_reactor_autonomy_halt
    effect_metric: fleet_autonomy_level
    emitter: scripts/coord/disk-critical-reactor.sh (RESILIENT-326)
    trigger: >
      quiesce_and_reclaim() set AUTONOMY_LEVEL=0 to halt the fleet before
      pruning the over-cap shared cargo target. Paired 1:1 with an
      operator-recall.sh DISK_CRITICAL page in the same code path.
    consumers: [fleet-brief, disk-health-monitor, ops-audit]
    fields_required: [ts, kind, prior_level]
  - kind: disk_reactor_autonomy_resume
    effect_metric: fleet_autonomy_level
    emitter: scripts/coord/disk-critical-reactor.sh (RESILIENT-326)
    trigger: >
      quiesce_and_reclaim() restored AUTONOMY_LEVEL to its pre-halt value on
      EITHER exit path (reclaimed or aborted) — the halt this organ causes is
      always scoped to the quiesce window, never permanent.
    consumers: [fleet-brief, disk-health-monitor, ops-audit]
    fields_required: [ts, kind, restored_level, reason]

  # ── CREDIBLE-365/CREDIBLE-108: halt-class emit wrapper ───────────────────
  # halt_class_emit() in scripts/lib/halt-class-emit.sh emits one event per
  # call, carrying the caller-supplied name/status/reason plus a derived
  # failure_class (transient|permanent|none) so consumers don't have to
  # re-run halt_class_categorize themselves. See
  # docs/process/HALT_CLASS_EMIT_OBSERVABILITY.md for the full reference.
  - kind: halt_class_emit
    effect_metric: self
    emitter: scripts/lib/halt-class-emit.sh (halt_class_emit)
    trigger: any caller invokes halt_class_emit NAME STATUS [REASON] [DETAIL_JSON].
    consumers: [ambient]
    fields_required: [ts, kind, name, status, reason, failure_class, detail]

  # ── CREDIBLE-622 (CREDIBLE-109 slice): halt-class predicate observability ─
  # halt_predicate_emit/halt_predicate_run in scripts/lib/halt-class-emit.sh
  # emit one of these three distinct kinds per predicate execution (rather
  # than one kind + a status field) so consumers can filter/aggregate
  # per-outcome without parsing JSON. Fields follow the same field-naming
  # convention as the OTel-semconv shaping in src/genai_conv.rs so any
  # OTel-compatible collector can ingest ambient.jsonl without a bespoke
  # parser.
  - kind: halt_predicate_success
    effect_metric: self
    emitter: scripts/lib/halt-class-emit.sh (halt_predicate_emit/halt_predicate_run)
    trigger: a halt-class predicate ran to completion with exit code 0.
    consumers: [ambient, fleet-brief (future)]
    fields_required: [ts, kind, predicate, duration_ms]
  - kind: halt_predicate_failure
    effect_metric: self
    emitter: scripts/lib/halt-class-emit.sh (halt_predicate_emit/halt_predicate_run)
    trigger: a halt-class predicate ran to completion with a non-zero,
      non-timeout exit code.
    consumers: [ambient, fleet-brief (future)]
    fields_required: [ts, kind, predicate, duration_ms]
  - kind: halt_predicate_timeout
    effect_metric: self
    emitter: scripts/lib/halt-class-emit.sh (halt_predicate_emit/halt_predicate_run)
    trigger: a halt-class predicate exceeded its configured timeout budget
      (exit code 124 under `timeout`).
    consumers: [ambient, fleet-brief (future)]
    fields_required: [ts, kind, predicate, duration_ms]

  # ── ZERO-WASTE-053: steady-state cargo-target GC (2026-08-09) ────────────
  # cargo-sweep-gc.sh holds the shared target under a hard cap via LRU eviction,
  # so cargo's unbounded growth becomes a bounded plateau (days-and-days autonomy).
  - kind: cargo_sweep_gc_ran
    effect_metric: disk_free_gb
    emitter: scripts/ops/cargo-sweep-gc.sh (ZERO-WASTE-053)
    trigger: >
      The 30-min GC timer ran cargo-sweep --maxsize against the shared target,
      evicting least-recently-used artifacts to hold it under CHUMP_CARGO_TARGET_CAP_MB.
    consumers: [fleet-brief, disk-health-monitor, ops-audit]
    fields_required: [ts, kind, cap_mb, dry_run, result, rc]
  - kind: cargo_sweep_gc_skipped
    effect_metric: disk_free_gb
    emitter: scripts/ops/cargo-sweep-gc.sh (ZERO-WASTE-053)
    trigger: >
      The GC no-oped because cargo (ZERO-WASTE-054) or cargo-sweep is not on PATH,
      or the repo Cargo.toml was not found — surfaced so a silently-absent GC does
      not masquerade as a bounded target.
    consumers: [fleet-brief, disk-health-monitor, ops-audit]
    fields_required: [ts, kind, reason]
  - kind: cargo_sweep_gc_errored
    effect_metric: disk_free_gb
    emitter: scripts/ops/cargo-sweep-gc.sh (ZERO-WASTE-054)
    trigger: >
      cargo-sweep exited non-zero (e.g. cargo metadata failed under launchd's
      minimal env). Emitted instead of cargo_sweep_gc_ran so an errored GC can
      never masquerade as a clean 'nothing to clean' pass — the disk safety net
      failing silently is worse than no safety net.
    consumers: [fleet-brief, disk-health-monitor, ops-audit]
    fields_required: [ts, kind, cap_mb, rc, error]
  - kind: cargo_sweep_gc_time_pruned
    effect_metric: disk_free_gb
    emitter: scripts/ops/cargo-sweep-gc.sh (RESILIENT-239)
    trigger: >
      Age-based prune pass (cargo-sweep --time <days> --recursive) ran after the
      maxsize LRU pass, dropping fingerprint/artifact entries untouched in
      CHUMP_CARGO_SWEEP_TIME_DAYS days. Bounds file COUNT (the per-invocation
      stat-walk tax) rather than just total bytes, which --maxsize alone does not.
    consumers: [fleet-brief, disk-health-monitor, ops-audit]
    fields_required: [ts, kind, time_days, dry_run, result, rc]

