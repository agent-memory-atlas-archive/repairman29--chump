    fields_required: [ts, kind, task, run_id]
    docs: |
      Heartbeat emitted by scripts/coord/{opus-curator,emergency-fast-path}.sh
      on each scheduled invocation. interval_s is included when the task is
      declared in scripts/coord/system-gap-frequencies.yaml. task identifies
      the scheduled-task name (opus-curator | emergency-fast-path | gap-gardener).

  - kind: daemon_started
    effect_metric: self
    emitter: src/main.rs `chump fleet daemon` (INFRA-964)
    trigger: chump fleet daemon process starts and parses its task config
    consumers: [fleet-brief, audit-log]
    fields_required: [ts, kind, tasks, mode]
    docs: |
      mode is "once" (--once dev/test invocation) or "loop" (long-lived
      production daemon). tasks is a comma-separated list of declared task
      names from scripts/coord/system-gap-frequencies.yaml. Absence of this
      event for > 1 launchd KeepAlive cycle means the daemon failed to
      start; investigate /tmp/chump-fleet-daemon.err.log.

