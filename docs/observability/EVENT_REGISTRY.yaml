    fields_required: [ts, kind, gap_id, session_id, detail]

  - kind: claim_active_lease_bypassed
    effect_metric: waste_risk
    emitter: crates/chump-atomic-claim/src/atomic_claim.rs emit_claim_active_lease_event (INFRA-1646)
    trigger: operator used CHUMP_CLAIM_ALLOW_ACTIVE_LEASE=1 to proceed with a claim
      despite this session already holding a live lease for a different gap_id.
