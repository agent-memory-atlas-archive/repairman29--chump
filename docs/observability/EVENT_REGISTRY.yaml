  - kind: md_links_scan_done
    effect_metric: credible
    emitter: scripts/coord/md-links-loop.sh cmd_tick (INFRA-1925)
    trigger: >
      Emitted at the end of an md-links scan with summary fields. Used to
      track broken-link discovery rate over time and to flag when a scan
      finds zero broken links (which may indicate the scanner itself is
      broken rather than the docs being clean).
    consumers: [ops-audit, doc-health]
    fields_required: [ts, kind, scan_path, files_checked, broken_found]

  - kind: md_links_lane_override
    effect_metric: credible
    emitter: scripts/coord/md-links-loop.sh (INFRA-1925)
    trigger: >
      Emitted when the md-links curator detects an override to the standard
      scan lane (e.g. operator-initiated targeted scan with an explicit scan
      path argument). Used for audit visibility into non-default invocations.
    consumers: [ops-audit]
    fields_required: [ts, kind]

  - kind: fresh_eyes_heartbeat
    effect_metric: credible
    emitter: scripts/coord/fresh-eyes-loop.sh cmd_heartbeat (META-132)
    trigger: >
      Emitted on each cron-driven fresh-eyes-loop heartbeat to prove the
      curator-opus-fresh-eyes (mirror) role is alive. Watched by the
      daemon-silent meta-monitor (INFRA-2352) to detect a stalled
      self-consistency auditor.
    consumers: [heartbeat-shepherd, ops-audit]
    fields_required: [ts, kind]

  - kind: fresh_eyes_tick
    effect_metric: credible
    emitter: scripts/coord/fresh-eyes-loop.sh _run_cycle (META-132)
    trigger: >
      Emitted once per fresh-eyes cycle (tick/audit) regardless of outcome,
      recording the comparator window. Distinguishes "ran and found nothing"
      from "did not run" and tracks cycle cadence.
    consumers: [ops-audit]
    fields_required: [ts, kind, window_min]

  - kind: fresh_eyes_disagreement
    effect_metric: credible
    emitter: scripts/coord/fresh-eyes-loop.sh comparators 1/4/5 (META-132)
    trigger: >
      Emitted (rank-1, anti-noise) when a fleet self-report contradicts ground
      truth: fleet-brief says healthy while the stream shows fire (comparator 1),
      brief healthy while chump health --slo-check breaches (comparator 4), or the
      ROADMAP bottleneck pillar is starved by the last-7d ship distribution
      (comparator 5). comparator_id names which check fired.
    consumers: [ops-audit, wizard-daemon, operator]
    fields_required: [ts, kind, comparator_id, severity, detail]

  - kind: fresh_eyes_coverage_gap
    effect_metric: credible
    emitter: scripts/coord/fresh-eyes-loop.sh comparator_2 (META-132)
    trigger: >
      Emitted when registered ambient event kinds have zero curator-loop
      coverage (no scripts/coord/*-loop.sh greps or emits them) —
      register-without-watch drift, the inverse of the emit-without-register
      case the registry coverage gate already catches.
    consumers: [ops-audit, observability]
    fields_required: [ts, kind, comparator_id, severity, detail]

  - kind: fresh_eyes_silent_curator
    effect_metric: resilient
    emitter: scripts/coord/fresh-eyes-loop.sh comparator_3 (META-132)
    trigger: >
      Emitted when a curator session emitted heartbeats but zero actions
      (sub_agent_dispatched / DONE / ship_landed) over the comparator window —
      the silent_agent root cause (heartbeat-alive but doing-nothing) that the
      existing heartbeat watchdogs miss because a heartbeat looks like life.
    consumers: [ops-audit, heartbeat-shepherd]
    fields_required: [ts, kind, comparator_id, severity, detail]

  - kind: worktree_reaped
    effect_metric: resilient
    emitter: scripts/ops/stale-worktree-reaper.sh (INFRA-2020, INFRA-2339)
    trigger: >
      Emitted when stale-worktree-reaper removes a worktree that met all reap
      criteria (idle past threshold + no active lease + branch pushed-or-deletable).
      Includes source tag distinguishing operator-manual worktrees from
      agent-created ones for audit differentiation.
      INFRA-2339 adds scan_source field distinguishing how the worktree was
      discovered: git-list (any /tmp/* git-registered worktree regardless of name),
      tmp_chump (existing /tmp/chump-* glob), rescue-pattern (standalone /tmp/ dir
      matching infra-NNN-*, ship-NNN, fix-*, *-rescue, *-fix patterns), or
      tmp-age (standalone /tmp/ dir matched by age alone).
    consumers: [ops-audit]
    fields_required: [ts, kind, source, scan_source, branch, dry_run]
  - kind: wizard_dispatch_cooldown
    effect_metric: resilient
    emitter: scripts/coord/wizard-daemon.sh step4 (INFRA-2051)
    trigger: >
      Emitted when wizard-daemon step4 skips dispatching a gap because that gap
      had a FAILED dispatch outcome recorded in dispatch history within the
      CHUMP_WIZARD_DISPATCH_GAP_COOLDOWN_S window (default 1800s = 30min).
      Prevents infinite wheel-spin on gaps that consistently fail to ship after
      chump --execute-gap spawns. The gap will be reconsidered after the cooldown
      window expires.
    consumers: [ops-audit]
    fields_required: [ts, kind, source, gap_id, last_fail_age_s, cooldown_s]

  - kind: wizard_dispatch_giveup
    effect_metric: resilient
    emitter: scripts/coord/wizard-daemon.sh step4 (INFRA-2051)
    trigger: >
      Emitted when wizard-daemon step4 abandons dispatching a gap after recording
      >= CHUMP_WIZARD_MAX_DISPATCH_ATTEMPTS (default 3) FAILED dispatch outcomes
      in the last 24 hours. The gap is tagged with wizard_skip:true via
      chump gap set --add-note so future dispatch attempts are blocked until an
      operator manually reviews and clears the skip flag. This prevents
      autonomous systems from thrashing on gaps that need human intervention.
    consumers: [ops-audit, operator-pager]
    fields_required: [ts, kind, source, gap_id, failed_attempts, max_attempts]
  # ── RESILIENT-026: orphan worktree watchdog ────────────────────────────────
  - kind: orphan_worktree_detected
    effect_metric: resilient
    emitter: scripts/coord/orphan-worktree-watchdog.sh (RESILIENT-026)
    trigger: >
      A /tmp/chump-* linked worktree has uncommitted or unpushed work, its
      owning process is no longer running (dead session_id), it has been
      filesystem-idle for >15 min, and it has no recent push to origin.
      Fired every 5 min by launchd (ai.chump.orphan-worktree-watchdog).
      Indicates a sub-agent crashed mid-task (e.g. API socket error) or was
      stopped by the operator, leaving work-on-disk that is not on origin.
      Operator action: inspect the worktree, commit + push, or delete if stale.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, worktree_path, branch, last_commit_sha, uncommitted_line_count, age_minutes, claim_gap_id]

  # ── RESILIENT-035 (INFRA-1395): required-check grace window ────────────────
  - kind: required_check_added
    effect_metric: self
    emitter: scripts/coord/required-check-monitor.sh (INFRA-1395)
    trigger: >
      A new required CI check appears in branch-protection required-contexts
      that was not in the prior snapshot (.chump-locks/required-check-snapshot.json).
      Fires each time required-check-monitor.sh detects a new check name.
      A 30-minute grace window is opened (.chump-locks/required-check-grace.json)
      so PRs opened before grace_until are not blocked by the new check.
    consumers: [ops-audit, fleet-brief, required-check-monitor]
    fields_required: [ts, kind, check_name, added_at, grace_until, grace_window_mins]
    docs: docs/process/REQUIRED_CHECK_ADDITION.md

  # ── INFRA-1939 wedge guard (bot-merge graphql exhaustion) ────────────────
  # Emitted by scripts/coord/bot-merge.sh at script top when the last 200
  # ambient events show a `graphql_exhausted` within CHUMP_GRAPHQL_WEDGE_LOOKBACK_S
  # (default 1800s). Aborts the ship to prevent piling on an already-throttled
  # GraphQL bucket. Backlog drains once the secondary rate-limit window resets.
  # INFRA-2096 follow-up: registered here (was emit-without-register prior, kept
  # the audit's emit-without-register count at 1 and blocked the keystone PR).
  - kind: bot_merge_graphql_wedge_aborted
    effect_metric: self
    emitter: scripts/coord/bot-merge.sh (INFRA-1939)
    trigger: |
      bot-merge.sh detected a recent graphql_exhausted event in ambient.jsonl
      within the wedge-lookback window, and aborted to avoid worsening GraphQL
      starvation. The aborted ship can be retried after CHUMP_GRAPHQL_WEDGE_LOOKBACK_S
      seconds (default 1800s = 30min).
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, last_graphql_exhausted, lookback_s]
    docs: scripts/coord/bot-merge.sh (INFRA-1939 wedge-guard comment block at top)

  - kind: bot_merge_graphql_wedge_cleared
    effect_metric: self
    emitter: scripts/coord/bot-merge.sh (INFRA-2426 recovery path)
    trigger: |
      bot-merge.sh detected a recent graphql_exhausted AND a subsequent
      graphql_recovered event AFTER the exhaustion timestamp. Bypasses the
      INFRA-1939 wedge guard and proceeds with the ship, since the GraphQL
      surface has demonstrably recovered. Recovery-bypass closes the
      previously-undocumented exit-144 silent-fail path (INFRA-2426).
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, last_graphql_exhausted, last_graphql_recovered]
    docs: scripts/coord/bot-merge.sh (INFRA-2426 recovery-bypass comment block)

  # ── RESILIENT-trunk-RED guard (INFRA-2096): test SKIP because runner-side ──
  # capability missing (cargo, binary build, etc.). Audit-only; SKIPs are
  # transient unblocks while the underlying runner-side issue (INFRA-2086
  # silent-build-failure class) is being resolved.
  - kind: trunk_red_skip
    effect_metric: self
    emitter: scripts/ci/test-mcp-coord-smoke.sh (INFRA-2096); future similar SKIP guards.
    trigger: |
      A CI smoke test that requires a built binary (or other runtime capability)
      detected the capability missing AND chose to SKIP rather than fail. This
      lets PRs through despite runner-side trunk-RED, but each SKIP is logged
      here so the operator can audit which PRs were unblocked by SKIP vs. real
      PASS — and flip back to blocking once the runner state is healthy.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, script, gap, reason]
    docs: docs/process/CLAUDE_GOTCHAS.md (see "Runner-side cargo silent-build-failure")
  # ── INFRA-2086: chump_cargo_build loud-fail wrapper events ─────────────────
  - kind: cargo_build_failed
    effect_metric: resilient
    emitter: scripts/coord/lib/cargo-helpers.sh chump_cargo_build (INFRA-2086)
    trigger: >
      Emitted by chump_cargo_build() when a cargo build invocation fails for
      any of 4 classes: timeout (rc=124), registry_corruption (tauri/proc-macro
      pattern in stderr), compile_error (any non-zero rc), or missing_binary
      (rc=0 but expected binary path doesn't exist after build — the silent-
      failure class that surfaced as INFRA-2082).
    consumers: [ops-audit, fleet-doctor]
    fields_required: [ts, kind, package, binary, exit_code, duration_s, suspected_class]

  - kind: cargo_registry_corruption
    effect_metric: resilient
    emitter: scripts/coord/lib/cargo-helpers.sh chump_cargo_build (INFRA-2086)
    trigger: >
      Emitted when cargo build stderr matches the tauri/proc-macro registry-
      cache-corruption pattern. Carries the suspect crate name + suggested
      fix command (cargo clean -p <crate>) so the operator can recover
      without grep-archaeology.
    consumers: [ops-audit, fleet-doctor, infra-watcher]
    fields_required: [ts, kind, crate, suggested_fix]

  - kind: auto_merge_policy_bypassed
    effect_metric: resilient
    emitter: scripts/coord/bot-merge.sh (INFRA-2155)
    trigger: >
      Emitted by bot-merge.sh when CHUMP_BYPASS_AUTO_MERGE_POLICY=1
      skips the chump-policy check before arming auto-merge. Used for
      genuine recovery scenarios where the operator needs to ship past
      a policy gate; every bypass is auditable so the operator can
      review patterns (frequent bypasses on a given operator-repo =
      signal that the policy is wrong, not that the bypass is wrong).
    consumers: [ops-audit, fleet-doctor]
    fields_required: [ts, kind, pr, session]

  - kind: gap_auto_flipped
    effect_metric: effective
    emitter: .github/workflows/auto-flip-on-merge.yml (INFRA-2121)
    trigger: >
      Emitted when the auto-flip-on-merge workflow successfully runs
      chump gap ship <ID> --closed-pr <PR#> on a merged PR whose title
      contains a gap-ID. Closes the gap-registry-drift loop CI-REVIEW
      Lever 5 identified.
    consumers: [ops-audit, fleet-brief, pr-watch]
    fields_required: [ts, kind, gap, pr, outcome]

  - kind: gap_auto_flip_failed
    effect_metric: resilient
    emitter: .github/workflows/auto-flip-on-merge.yml (INFRA-2121)
    trigger: >
      Emitted when chump gap ship exits non-zero from the auto-flip
      workflow (gap unknown, YAML malformed, etc.). Non-fatal — the PR
      already merged; this only signals that the registry-side update
      did not land for operator follow-up.
    consumers: [ops-audit, fleet-doctor]
    fields_required: [ts, kind, gap, pr, reason]

  - kind: gap_backfill_flipped
    effect_metric: effective
    emitter: scripts/ops/backfill-shipped-gaps.sh (INFRA-2121)
    trigger: >
      Emitted by the one-time backfill script for each gap whose status
      it successfully flipped from open → done. Lets the operator audit
      which gaps the backfill touched without re-running it in dry-run.
    consumers: [ops-audit]
    fields_required: [ts, kind, gap, pr, source]
  - kind: reviewer_routing_computed
    effect_metric: effective
    emitter: crates/chump-reviewer-routing/src/bin/chump-reviewer-routing.rs (INFRA-1491)
    trigger: >
      Emitted by `chump-reviewer-routing show` and `route` whenever a
      reviewer set is computed. Discloses the count + suggested logins
      so an operator audit trail exists even when `route` exits without
      actually requesting (dry-run, empty set, error mid-way). Emitted
      on stderr so stdout stays parseable JSON for callers consuming
      `show --json`.
    consumers: [ops-audit, pr-watch]
    fields_required: [ts, kind, reviewer_count]

  - kind: reviewer_routing_requested
    effect_metric: effective
    emitter: crates/chump-reviewer-routing/src/bin/chump-reviewer-routing.rs (INFRA-1491)
    trigger: >
      Emitted by `chump-reviewer-routing route` only after a successful
      `gh pr edit --add-reviewer ...` call. Disambiguates "we computed a
      set" (reviewer_routing_computed) from "we actually asked GitHub to
      request these humans" (reviewer_routing_requested). Pairs cleanly
      with the auto_merge_policy_evaluated event from INFRA-1489 — both
      are the audit trail behind Marcus M-E.
    consumers: [ops-audit, pr-watch]
    fields_required: [ts, kind, pr, reviewers]
  - kind: auto_merge_policy_evaluated
    effect_metric: effective
    emitter: crates/chump-policy/src/bin/chump-policy.rs (INFRA-1489)
    trigger: >
      Emitted by `chump-policy check` when the layered policy chain
      (fleet + operator + repo, most-restrictive wins) allows auto-merge
      under the current configuration. Operator-facing audit trail for
      Marcus M-E trust-cliff knob.
    consumers: [ops-audit, bot-merge.sh integration]
    fields_required: [ts, kind, outcome]

  - kind: auto_merge_policy_blocked
    effect_metric: resilient
    emitter: crates/chump-policy/src/bin/chump-policy.rs (INFRA-1489)
    trigger: >
      Emitted by `chump-policy check` when the layered policy chain
      blocks auto-merge. Carries the contributing scope(s) so the
      operator can see WHICH scope (fleet / operator / repo / lane) drove
      the block — kills the "silent auto-merge refused, why?" debugging
      tax. Since INFRA-1767, also carries `lane` and `failure_class`
      (`permanent_by_design` for a lane-only Critical block, vs.
      `transient_review_or_trust_gate` for a review/trust-count gate that
      clears on its own).
    consumers: [ops-audit, bot-merge.sh integration]
    fields_required: [ts, kind, reason, contributing]

  - kind: bot_merge_lane_resolved
    effect_metric: resilient
    emitter: scripts/coord/bot-merge.sh (INFRA-1767)
    trigger: >
      Emitted once per bot-merge.sh invocation, immediately after CLI
      flags are parsed, disclosing which merge-risk lane (internal /
      user-facing / critical) the run resolved to and whether
      auto-merge was requested implicitly (lane default) or explicitly
      (`--auto-merge` passed). Precedes the `chump-policy check --lane
      <lane>` gate later in the run — this event is the "what lane did
      we even think we were in" audit trail independent of whether the
      policy chain ultimately allowed or blocked.
    consumers: [ops-audit, bot-merge.sh integration]
    fields_required: [ts, kind, lane, auto_merge_requested, auto_merge_explicit, session]
    expected_volume: "1 per bot-merge.sh run"

  # ── Integration-cycle pipeline (META-124 / INFRA-2130) ────────────────────
  - kind: integration_cycle_started
    effect_metric: effective
    emitter: scripts/coord/integration-cycle.sh (INFRA-2130)
    trigger: >
      Emitted at the very beginning of an integration-cycle run, before
      candidate selection. Operator can correlate this ts with
      integration_cycle_shipped to measure wall-clock cycle latency.
    consumers: [fleet-brief, kpi-report, ops-audit]
    fields_required: [ts, kind, cycle_id, trigger_reason, candidate_count]
    expected_volume: "1 per integration cycle run"
    # payload: {cycle_id: string, trigger_reason: string, candidate_count: number, ts: string}

  - kind: integration_candidates_selected
    effect_metric: effective
    emitter: scripts/coord/integration-cycle.sh (INFRA-2130)
    trigger: >
      Emitted after the cycle selects its candidate set but before any
      merging begins. The manifest array lets post-mortem queries
      reconstruct exactly which branches were in-flight for a given cycle.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, cycle_id, manifest]
    expected_volume: "1 per integration cycle run"
    # payload: {cycle_id: string, manifest: Array<{gap_id: string, branch: string, loc: number, priority: string, queue_age_s: number}>, ts: string}

  - kind: integration_cycle_merges
    effect_metric: effective
    emitter: scripts/coord/integration-cycle.sh (INFRA-2130)
    trigger: >
      Per-cycle AGGREGATE emitted once after all branch merges in a
      cycle complete (replaces per-merge fanout). Carries a merges array
      summarising every branch merged in the cycle — lower ambient noise
      while preserving full audit trail. Observability-curator amendment
      per INFRA-2132: prefer aggregate over per-event fanout for
      high-frequency in-cycle events.
    consumers: [fleet-brief, kpi-report, ops-audit]
    fields_required: [ts, kind, cycle_id, merges]
    expected_volume: "1 per integration cycle run"
    # payload: {cycle_id: string, merges: Array<{gap_id: string, branch: string, parent_sha: string, merge_sha: string}>, ts: string}

  - kind: integration_preflight_started
    effect_metric: resilient
    emitter: scripts/coord/integration-cycle.sh (INFRA-2130)
    trigger: >
      Emitted when the cycle begins running the preflight checks on the
      assembled integration branch. Pairs with integration_preflight_failed
      or integration_cycle_shipped to bound preflight duration.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, cycle_id, branch, expected_duration_s]
    expected_volume: "1 per integration cycle run"
    # payload: {cycle_id: string, branch: string, expected_duration_s: number, ts: string}

  - kind: integration_preflight_failed
    effect_metric: resilient
    emitter: scripts/coord/integration-cycle.sh (INFRA-2130)
    trigger: >
      Emitted when the integration-branch preflight fails before a ship
      attempt. Carries the failure_class so the CI-audit loop can bucket
      this as flake vs. logic-bug without re-reading logs manually.
    consumers: [fleet-brief, ci-audit, ops-audit]
    fields_required: [ts, kind, cycle_id, branch, failure_class, log_path]
    expected_volume: "0-N per integration cycle run; 0 on green cycles"
    # payload: {cycle_id: string, branch: string, failure_class: string, log_path: string, ts: string}

  - kind: ship_bisect_root_cause
    effect_metric: resilient
    emitter: scripts/coord/integration-cycle.sh (INFRA-2130)
    trigger: >
      Emitted when a post-ship bisect identifies the offending gap
