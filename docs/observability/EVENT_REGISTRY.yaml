      enables autoheal mode. Absence is expected in normal (CHUMP_DOCTOR_AUTOHEAL=0)
      operation.
    consumers: [ops-audit]
    fields_required: [ts, kind, source, label, script_path]

  - kind: self_healer_heartbeat_stale
    effect_metric: resilient
    emitter: scripts/coord/fleet-doctor-strict.sh (RESILIENT-1053)
    trigger: >
      Emitted when check_self_healer_heartbeat finds that either self-healer
      (organ-watchdog.sh's kind=organ_watchdog_tick or organ-reconcile.sh's
      kind=organ_reconcile_applied/organ_reconcile_noop) has gone stale past
      its cadence + buffer (default 20min for both), or has never ticked at
      all while the OTHER healer has. Closes the meta-failure where the
      healers watch every other organ but chump-organ-reconcile.timer is
      deliberately excluded from organ-manifest.txt (its liveness was left
      to install-helsinki-atc.sh, deploy/boot-only) so nothing continuously
      pages when a healer's own timer silently stops ticking.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, source, detail]

  - kind: tracked_config_drift
    effect_metric: resilient
    emitter: scripts/coord/fleet-doctor-strict.sh (RESILIENT-1106)
    trigger: >
      Emitted when check_tracked_config_drift finds a git-untracked, node-local
      file (e.g. a hand-deployed ~/node1-worker-run.sh launcher or
      ~/.chump/providers.env) hard-setting a variable to a DIFFERENT literal
      value than the canonical default declared in a tracked config-as-code
      file (scripts/setup/*.env, e.g. worker-policy.env from #4593). Closes
