      auto-arms, and gap filing to avoid propagating breakage.
    trigger: emitted at the start of a tick when trunk_red detected but not in previous tick
    consumers: [fleet-brief, operator-recall]
    fields_required: [ts, kind, dry_run]
    volume_estimate: "~0-1 per incident window; transient spike only on trunk-red start"

