    emitter: scripts/ops/rot-reaper.sh (RESILIENT-311 verified-red spare)
    trigger: the rot-reaper's CLASS 2 was about to close a PR whose required `verified` aggregate is RED past the deadline, but the green-underneath classifier (scripts/ops/lib/classify-blocked-pr.py, reused from #4606) found the redness RECOVERABLE (green_underneath / pending / cancelled / blocked_no_failure / flake_exhausted) — so the reaper re-armed the auto-merge backstop (or the flake budget) and SPARED the PR instead of closing it; carries the verdict and the per-PR spare_count (escalates to the operator, never closes, past the bound)
    consumers: [board-cycle, fleet-brief]
    fields_required: [ts, kind, pr, verdict, spare_count]

  - kind: pr_reap_held_systemic
    effect_metric: self
    emitter: scripts/ops/rot-reaper.sh (RESILIENT-1188 systemic-red guard)
    trigger: the rot-reaper's CLASS 2 was about to close a PR for an individual required-red (hard_fail), but the trunk-sentinel (scripts/coord/trunk-sentinel-daemon.sh) reports main/trunk RED within the freshness window — so the PR's red is inherited from the broken trunk, not its own work; the reaper HELD the PR (re-armed the backstop, never closed) and pages the operator once per beat, preventing the fleet-wide mass-closure self-strangle (INFRA-3542). Green main ⇒ a required-red PR is an independent failure and still reaps (the green-main same-gate case is alarmed by scripts/coord/systemic-red-detector.sh W-015, not auto-held here)
    consumers: [board-cycle, fleet-brief]
    fields_required: [ts, kind, pr, gates, reason]

  - kind: pr_revived_post_trunk_recovery
    effect_metric: self
    emitter: scripts/coord/trunk-recovery-reviver.sh (RESILIENT-1190)
    # scanner-anchor: "kind":"pr_revived_post_trunk_recovery"
    trigger: >
      The RECOVERY counterpart to RESILIENT-1188's systemic-red HOLD. On a trunk
      RED→GREEN recovery (consumed from the trunk-sentinel's trunk_recovered /
      trunk_state_change→GREEN events), the reviver found a PR that was reaped as
      a victim of the just-ended trunk-red window — closed-not-merged inside the
      window, reaper-marked (rot-reaped label / pr_reaped event), and
      green-underneath NOW (classify-blocked-pr.py verdict not hard_fail/
      conflict) — and reopened it (method=reopen), or on GitHub reopen-limbo
      opened a fresh PR for the same branch (method=fresh_pr), then re-armed
      auto-merge. method=failed = neither path worked (branch likely gone),
      surfaced only. Bounded (CHUMP_TRUNK_REVIVE_MAX_PER_RUN) + idempotent.
    consumers: [board-cycle, fleet-brief, ops-audit]
    fields_required: [ts, kind, pr, branch, method, recovered_at]
    expected_volume: "very low; only after a trunk recovery that had reaped victims"
    status: stable

  - kind: trunk_recovery_reviver_tick
    effect_metric: self
    emitter: scripts/coord/trunk-recovery-reviver.sh (RESILIENT-1190)
    # scanner-anchor: "kind":"trunk_recovery_reviver_tick"
    trigger: >
