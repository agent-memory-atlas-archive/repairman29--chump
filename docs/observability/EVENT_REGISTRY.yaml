    emitter: scripts/coord/pr-failure-auto-rescue.sh (INFRA-1600)
    trigger: >
      The auto-rescue daemon matched a known CI-failure pattern on an open
      PR and applied (or attempted to apply) the corresponding handler.
      Linchpin instrumentation: tonight's manual cascade-fix work, productized.
    consumers: [fleet-brief, cos-weekly-digest, ops-audit]
    fields_required: [ts, kind, pr, handler, outcome]

  - kind: pr_terminal_alert_not_reaped
    emitter: scripts/coord/pr-failure-auto-rescue.sh (RESILIENT-379)
    effect_metric: self
    trigger: >
      An auto-merge-ARMED PR hit the terminal-disposition age with a real
      required-check red that no handler could clear and that was NOT shared
      fleet-wide (systemic guard did not fire). Instead of CLOSING the
      vouched-for PR (the #4173/#4175 reap incident, 2026-08-23), the daemon
      leaves it OPEN and escalates to the operator. Close is opt-in only via
      PR_TERMINAL_CLOSE_ARMED=1.
    consumers: [fleet-brief, cos-weekly-digest, ops-audit]
    fields_required: [ts, kind, pr, red, age_h, branch]

  # ── INFRA-1490: ci.yml merge driver mid-file fallback ────────────────────
  - kind: ci_yml_row_add_merged
    emitter: scripts/git/merge-driver-ci-yml-add-row.sh (INFRA-1490)
    trigger: >
      Custom merge driver was unable to use the original pure-append path
      (both sides modified the shared prefix) but successfully auto-merged
      via the patch-fuzz3 or git-merge-file --union fallback. Surfaces the
      otherwise-invisible "10 of 12 PRs all conflicted on ci.yml" pattern
      from 2026-05-16T04:30 in the audit trail.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, ours, theirs, mode, adds]
  - kind: pre_commit_ac_test_missing
    emitter: scripts/git-hooks/pre-commit-ac-completeness.sh (INFRA-1401)
    trigger: A commit referencing a gap ID has acceptance_criteria that name a
      scripts/ci|coord|ops/*.sh file but that file is neither staged nor present
      in HEAD. The commit is blocked until the test ships or an AC-Backfill-Reason
      trailer is provided.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, gaps, missing_files]
  # ── PRODUCT-102: PWA gap list browser ────────────────────────────────────
  - kind: pwa_gap_list_filtered
    emitter: web/v2/gap-list.js ChumpViewGaps._applyFilters (PRODUCT-102)
    trigger: operator applies status/priority/domain/pillar filters or a search
      query in the PWA gap list browser; sent via navigator.sendBeacon to
      POST /api/ambient/emit so filter usage is visible in the ambient stream
      without blocking the UI thread
    consumers: [fleet-brief, kpi-report]
    fields_required: [ts, kind, source, status_filter, priority_filter, domain_filter, pillar_filter, search, result_count]
  # ── INFRA-1568: broad-canary skip (operator override) ────────────────────
  - kind: runner_canary_skipped
    emitter: scripts/setup/install-self-hosted-runner.sh (INFRA-1568)
    trigger: >
      install-self-hosted-runner.sh ran --check or completed install but the
      operator set CHUMP_SKIP_CANARY=1 / passed --skip-canary OR the broad
      canary script was missing. The runner is reported as ready WITHOUT the
      full production-step validation the broad canary gate normally enforces.
      Reasons: operator_override, install_skip_canary_flag, canary_script_missing.
    consumers: [fleet-brief, ops-audit]
    effect_metric: self
    fields_required: [ts, kind, reason, host]
  # ── CREDIBLE-069: self-hosted runner run telemetry (INFRA-1534 AC #6) ─────
  - kind: self_hosted_runner_run
    emitter: .github/actions/emit-self-hosted-run-stats/action.yml (CREDIBLE-069)
    trigger: >
      A self-hosted-leg CI job (changes, fast-checks, clippy, cargo-test-shard)
      completes on a self-hosted runner (runner.os != 'Linux'). Fires on
      success or failure (if: always()) so utilization is visible either way.
      cache_hit is derived by comparing the job's CARGO_TARGET_DIR mtime
      against job_start_ts — an older mtime means the target dir was reused
      from a prior run. Delivers the telemetry INFRA-1534 AC #6 promised but
      never shipped; without it, fleet visibility into whether the 5-10x
      self-hosted cache speedup is landing was zero. INFRA-1535
      (RUNNER_AUTOSCALE) consumes this signal.
    consumers: [chump fleet doctor, INFRA-1535 RUNNER_AUTOSCALE]
    effect_metric: ci_throughput_runs_per_hour
    fields_required: [ts, kind, runner_label, workflow, duration_s, cache_hit]
  # ── INFRA-1535: self-hosted runner migration pipeline ─────────────────────
  - kind: runner_migration_step
    emitter: scripts/coord/chump-runner-migration-pipeline.sh (INFRA-1535)
    trigger: Each stage of the self-hosted runner migration pipeline records
      its progress. Fields include stage name, outcome (started/pr_armed/done),
      and a note. Used to track the staged rollout of CI jobs to M4 runners.
    consumers: [fleet-brief, ops-audit]
    effect_metric: self
    fields_required: [ts, kind, stage, outcome, note]
  # ── INFRA-1394: hot-file collision detection at claim time ────────────────
  - kind: claim_hot_file_overlap
    effect_metric: self
    emitter: src/atomic_claim.rs emit_claim_hot_file_overlap_event (INFRA-1394)
    trigger: >
      chump claim detected that the gap's acceptance_criteria references one or
      more hot shared files (from scripts/coord/lib/hot-files.yaml) AND a sibling
      lease already declares the same file in its paths[] field. Fires before the
      worktree is created — claim is blocked unless --force-overlap is passed.
    consumers: [fleet-brief, waste-tally, ops-audit]
    fields_required: [ts, kind, claim_gap, sibling_gap, sibling_session, overlap_paths]
    docs: |
      Hot files are those that frequently cause merge conflicts when touched by
      multiple concurrent agents: ci.yml, EVENT_REGISTRY.yaml, web_server.rs,
      app.js, main.rs. The list is tunable in scripts/coord/lib/hot-files.yaml.
      Pairs with INFRA-1389 merge drivers (same region → no conflict) but the
      proactive block here saves the rebase cycle entirely for non-merge-driver paths.
  # ── INFRA-1763: lease-time predictive diff-collision detection ────────────
  - kind: collision_predicted
    effect_metric: self
    emitter: crates/chump-atomic-claim/src/atomic_claim.rs emit_collision_predicted_event (INFRA-1763)
    trigger: >
      chump claim ran a real `git diff` against a sibling lease's live worktree
      and found the sibling's actual uncommitted changed-file set intersects
      this claim's paths. Schema: docs/design/COLLISION_PREDICTION_SCHEMA.md
      (collision-prediction-v1). Non-blocking — informational only.
    consumers: [fleet-brief, waste-tally, ops-audit]
    fields_required: [ts, kind, schema_version, agents, predicted_collision_ts,
      confidence, evidence, recommended_action, session]
  - kind: claim_diff_collision_checked
    effect_metric: self
    emitter: crates/chump-atomic-claim/src/atomic_claim.rs emit_claim_diff_collision_checked_event (INFRA-1763)
    trigger: >
      Fires once per `chump claim` invocation regardless of outcome — cost
      tracking for the INFRA-1763 diff-collision scan (duration + sibling
      count + match count). Duration is also printed to operator stderr.
    consumers: [fleet-brief, waste-tally, ops-audit]
    fields_required: [ts, kind, gap_id, session_id, duration_ms, siblings_checked, matches_found]
  - kind: claim_diff_collision_check_failed
    effect_metric: self
    emitter: crates/chump-atomic-claim/src/atomic_claim.rs emit_claim_diff_collision_check_failed_event (INFRA-1763)
    trigger: >
      A sibling's real diff could not be computed (unprovisioned worktree,
      git timeout, git IO error = failure_class transient; bad merge-base or
      ref = failure_class permanent). Never blocks the claim.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, gap_id, sibling_gap, sibling_session, failure_class, reason]
  # ── INFRA-1437: disk_critical auto-action ─────────────────────────────────
  - kind: disk_critical_auto_remediated
    effect_metric: self
    emitter: scripts/ops/disk-health-monitor.sh (INFRA-1437)
    trigger: >
      disk-health-monitor.sh detected disk_critical (free < CRITICAL_PCT or
      BLOCKING_PCT) and auto-invoked scripts/coord/target-dir-reaper.sh
      --execute --critical, bounded by a 60s budget. Closes the
      alert→action loop so disk crises don't require operator intervention.
      Operator override: CHUMP_DISK_AUTO_REMEDIATE=0 disables the auto-action.
    consumers: [fleet-brief, disk-health-monitor, ops-audit]
    fields_required: [ts, kind, bytes_freed_mb, duration_s]
  # ── INFRA-1409: pr triage ─────────────────────────────────────────────────
  - kind: pr_triage_run
    effect_metric: self
    emitter: scripts/coord/chump-pr-triage.sh (INFRA-1409)
    trigger: operator runs chump-pr-triage.sh to get next-action table for open PRs
    consumers: [fleet-brief, kpi-report]
    fields_required: [ts, kind, scope, pr_count, output]
  # ── INFRA-1406: orphan-pr-closer per-PR immunity ─────────────────────────
  - kind: orphan_pr_close_immunity_honored
    effect_metric: self
    emitter: scripts/coord/orphan-pr-closer.sh (INFRA-1406)
    trigger: >
      Orphan-pr-closer was about to close a PR but found
      'Orphan-Closer-Immunity: <reason>' trailer in one of the PR's
      commit messages — skipped the close. Companion to the existing
      title-marker 'orphan-pr-closer-skip' escape hatch.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, pr, gap, reason]

  - kind: orphan_pr_rescued
    effect_metric: self
    emitter: scripts/coord/pr-rescue-false-close.sh (INFRA-1406)
    trigger: >
      Operator (or automation) invoked the rescue script after a PR was
      falsely closed by an auto-closer. The PR is reopened + auto-merge
      re-armed + an audit comment posted. The rate of this kind over
      time is the false-close-rate signal — drives whether the closer's
      classification needs tightening.
    consumers: [fleet-brief, ops-audit, operator-attention]
    fields_required: [ts, kind, pr, branch, gap]

  - kind: pr_reopen_refused
    effect_metric: self
    emitter: scripts/coord/pr-rescue-false-close.sh (INFRA-5349, INFRA-3604 slice)
    trigger: >
      Rescue script was about to reopen a manually-closed PR but found the
      target branch not mergeable and/or not rebaseable (GitHub REST
      'mergeable'/'rebaseable' false) — refused to reopen and logged why.
      Prevents a stale DIRTY/CONFLICTING PR from being revived back into
      the merge queue.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, pr, branch, gap, reason]

  # ── INFRA-1541: pre-merge AC coverage gate ────────────────────────────────
  - kind: ac_coverage_miss
    effect_metric: self
    emitter: chump pr ac-coverage (INFRA-1541)
    trigger: >
      Pre-merge gate found an acceptance-criteria bullet in the gap
      referenced by the PR title that is not covered by the PR diff
      (no matching file path, symbol, Closes-AC trailer, or test
      reference). One event per uncovered bullet. Advisory-only by
      default; flips to merge-blocking when CHUMP_AC_GATE_ADVISORY!=true
      after the 50-PR observation window.
    consumers: [fleet-brief, kpi-report, ac-coverage-dashboard, pr-hygiene-gate]
    fields_required: [ts, kind, pr_number, gap_id, bullet_index, bullet_text_prefix]

  - kind: ac_coverage_waived
    effect_metric: self
    emitter: chump pr ac-coverage (INFRA-1541)
    trigger: >
      PR carries an `AC-Coverage-Waive: <bullet-index>: <reason>` trailer
      that bypasses the coverage check for that bullet. The reason is
      recorded for audit; rising waiver rate is a fleet-discipline signal.
    consumers: [fleet-brief, kpi-report, ops-audit, audit, pr-hygiene-gate]
    fields_required: [ts, kind, pr_number, gap_id, bullet_index, reason]

  - kind: ac_coverage_disabled
    effect_metric: self
    emitter: chump pr ac-coverage (INFRA-1541)
    trigger: >
      Operator override `CHUMP_AC_GATE_ENABLED=false` short-circuited the
      gate. Audit-only emit so operators can see when coverage enforcement
      was bypassed wholesale.
    consumers: [fleet-brief, ops-audit, pr-hygiene-gate]
    fields_required: [ts, kind, pr_number]
  # ── INFRA-1581 / INFRA-1538: migration pipeline gate-query telemetry ──
  - kind: migration_gate_query
    effect_metric: ci_throughput_runs_per_hour
    emitter: scripts/coord/chump-runner-migration-pipeline.sh (INFRA-1538/1581)
    trigger: each invocation of _check_job_succeeded() helper that polls the
      check-runs API to see if a stage gate (fast-checks/clippy/cargo-test/ACP)
      has been met. Lets fleet-doctor surface gate-poll rate + which jobs we
      watch most often.
    consumers: [fleet-brief, fleet-doctor]
    fields_required: [ts, kind, job, limit]

  # ── INFRA-1554 / INFRA-1686: synthesis-pass atomic-filing telemetry ──
  - kind: synthesis_gap_filed
    effect_metric: self
    emitter: scripts/dev/synthesis-pass.sh (INFRA-1554 AC #1 — atomic filing arm)
    trigger: >
      Synthesis daemon ran, identified a recommendation, invoked `chump gap
      reserve` (capturing the returned ID), and wrote the synthesis markdown
      with the actual filed gap ID inline. Without this telemetry path, the
      synthesis-truth validator (scripts/ci/test-synthesis-truth.sh, from
      INFRA-1684) can detect orphan references but cannot distinguish
      "synthesis hallucinated the ID" from "gap was reaped after filing."
    consumers: [synthesis-truth-validator, fleet-brief, ops-audit]
    fields_required: [ts, kind, synthesis_path, gap_id, title, source_note]

  # ── INFRA-1695 / META-066: Content Bots Suite dispatch telemetry ──
  - kind: content_bot_invoked
    effect_metric: self
    emitter: scripts/content-bots/run-bot.sh (INFRA-1695)
    trigger: >
      Content-bot dispatcher invoked for a specific bot_id after the toggle
      resolver (INFRA-1700) confirmed it is enabled per CHUMP_CONTENT_BOTS
      env or .chump-config.toml. Emitted before the LLM call so partial
      failures (LLM timeout, claude-cli missing) still leave a trace.
    consumers: [fleet-brief, ops-audit, content-bots-pipeline-orchestrator]
    fields_required: [ts, kind, bot_id, run_id, model_tier]

  - kind: content_bot_output
    effect_metric: self
    emitter: scripts/content-bots/run-bot.sh (INFRA-1695)
    trigger: >
      Content-bot LLM call completed. Status may be "ok" with output bytes
      written or "failed" with reason (claude-cli-missing | llm-nonzero +
      exit_code). Pairs with content_bot_invoked via shared run_id.
    consumers: [fleet-brief, ops-audit, content-bots-pipeline-orchestrator]
    fields_required: [ts, kind, bot_id, run_id, status]

  - kind: content_bot_pipeline_step
    effect_metric: self
    emitter: scripts/content-bots/run-bot.sh (INFRA-1695, when --predecessor-output is passed)
    trigger: >
      A downstream bot is consuming an upstream bot's output. Records the
      from_bot → to_bot edge so the pipeline-orchestrator (INFRA-1698) can
      reconstruct the DAG execution from ambient.jsonl. Pairs with
      content_bot_invoked via shared run_id.
    consumers: [content-bots-pipeline-orchestrator, fleet-brief, ops-audit]
    fields_required: [ts, kind, from_bot, to_bot, output_path, run_id]


  # ── INFRA-1698 / INFRA-1702: pipeline-abort terminus event ──
  - kind: content_bot_pipeline_aborted
    effect_metric: self
    emitter: scripts/content-bots/orchestrate-pipeline.sh (INFRA-1698 — abort_pipeline helper)
    trigger: >
      Any stage failure in the Content Bots pipeline DAG (PMM → DocuBot
      || Evangelist → CopyBot). Downstream-of-failed bots are marked
      skipped in state.json before this event fires, so the run_id can
      be resumed via orchestrate-pipeline.sh --resume <run_id> once the
      operator addresses the root cause (LLM timeout, claude-cli auth,
      registry-state drift). Closes the bypass-debt from PR #2348.
    consumers: [content-bots-pipeline-orchestrator, fleet-brief, ops-audit]
    fields_required: [ts, kind, run_id, reason]
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, pr_number, mode]

  # ── CREDIBLE-068: Merge Queue Health Stream ──────────────────────────────────

  - kind: merge_queue_health
    effect_metric: queue_saturation_pct
    emitter: scripts/coord/monitor-merge-queue.sh (CREDIBLE-068)
    trigger: >
      Periodic (every 10 s) poll of queued GitHub Actions runs and open PRs
      with autoMergeRequest enabled. Provides real-time merge queue depth to
      fleet_health and agent_backpressure consumers so workers can self-throttle
      before saturating the CI runner pool.
    consumers: [fleet_health, agent_backpressure]
    fields_required: [ts, kind, queued_workflows, auto_merge_prs, queue_saturation_pct, backpressure_recommended]
    thresholds:
      queue_alert: 50     # saturation denominator; >70% → backpressure_recommended=true
      queue_critical: 100 # advisory log when queued_workflows ≥ this value

  - kind: queue_health_check_failed
    effect_metric: self
    emitter: scripts/coord/monitor-merge-queue.sh (CREDIBLE-068)
    trigger: >
      gh API call for merge-queue metrics timed out or returned an error.
      Advisory-only; fleet assumes queue is healthy and continues. Rising
      frequency of this event indicates GitHub API degradation.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, note]

  # ── INFRA-1340: per-tool auto-approve policies + escalation ─────────────────

  - kind: tool_auto_approved
    effect_metric: self
    emitter: src/task_executor.rs (INFRA-1340)
    trigger: >
      An incoming tool call matched an active per-tool auto-approve policy
      (PWA dropdown choice persisted in .chump/tool-policies.json keyed by
      {tool_name, scope}). The approval gate skipped the human-wait and let
      the tool execute. Distinct from the env-var-based
      auto_approved_tools_env / auto_approved_static_low_risk paths — the
      `source` field disambiguates ("persistent_policy" for this kind).
    consumers: [fleet-brief, ops-audit, approval-audit-dashboard]
    fields_required: [ts, kind, tool_name, scope, expires_at_unix, risk_level, source]

  - kind: tool_approval_escalated
    effect_metric: self
    emitter: src/task_executor.rs (INFRA-1340)
    trigger: >
      An approval request has been pending for longer than
      CHUMP_APPROVAL_ESCALATION_SECS (default 60s) without an operator
      decision. The server dispatches a Web Push notification to all
      subscribed endpoints and records the (ok, fail) counts here.
      Disabled when CHUMP_APPROVAL_ESCALATION=0 or there are no
      subscriptions / VAPID key configured.
    consumers: [fleet-brief, ops-audit, operator-attention]
    fields_required: [ts, kind, request_id, tool_name, risk_level, idle_secs, push_ok, push_fail]

  - kind: tool_approval_policy_changed
    effect_metric: self
    emitter: src/web_server.rs (INFRA-1340)
    trigger: >
      Operator created, refreshed, or deleted a per-tool auto-approve policy
      via POST/DELETE /api/tool-policy (PWA dropdown in the approval tray).
      The `action` field is "upsert" or "delete".
    consumers: [fleet-brief, ops-audit, approval-audit-dashboard]
    fields_required: [ts, kind, action, tool_name]
  - kind: preflight_registry_bypassed
    effect_metric: self
    emitter: src/preflight.rs (INFRA-1731 event-registry-audit gate bypass)
    trigger: >
      Operator ran `chump preflight` with CHUMP_PREFLIGHT_SKIP_REGISTRY=1
      set, skipping the local event-registry-audit gate (INFRA-1731). The
      bypass is intentional but recorded so post-hoc audits can see which
      PRs skipped the local registry check before push.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, reason]
  - kind: preflight_docsdelta_bypassed
    effect_metric: self
    emitter: src/preflight.rs (INFRA-1788 docs-delta-trailer gate bypass)
    trigger: >
      Operator ran `chump preflight --pre-commit` with
      CHUMP_PREFLIGHT_SKIP_DOCSDELTA=1 set, skipping the local
      docs-delta-trailer gate (INFRA-1788, mirrors INFRA-124). The bypass
      is intentional but recorded so post-hoc audits can see which PRs
      shipped without local validation of the Net-new-docs trailer.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, reason]
  - kind: preflight_main_red_skip
    effect_metric: self
    emitter: src/preflight.rs (INFRA-2422 main-red-aware gate auto-skip)
    trigger: >
      preflight auto-skipped a gate because origin/main is already failing
      it (main-preflight-watchdog reported state=RED for that gate). Emitted
      once per gate skipped per preflight run. Replaces the deleted
      CHUMP_PREFLIGHT_SKIP env bypass — instead of blanket-skipping all gates,
      only the specific trunk-failing gate is skipped. Consumers can join on
      gate + trunk_fix_gap_id to see which trunk fix resolves the skip.
    consumers: [fleet-brief, ops-audit, trunk-sentinel]
    fields_required: [ts, kind, gate, trunk_fix_gap_id]
  - kind: preflight_baseline_diff
    effect_metric: self
    emitter: src/preflight.rs (META-153 --vs diff-scoped failure attribution)
    trigger: >
      Operator ran `chump preflight --vs <ref>` and the baseline diff
      completed. Emitted once per --vs run (cache hit or miss) with counts
      of new vs pre-existing failures. new_fail_count > 0 means the current
      diff introduced regressions that should be fixed before push.
      preexisting_fail_count > 0 means the ref already had failures — those
      are listed as warnings but do NOT block the operator.
    consumers: [fleet-brief, ops-audit, ci-audit]
    fields_required: [ts, kind, new_fail_count, preexisting_fail_count, baseline_sha]
  - kind: liaison_elected
    effect_metric: github_api_calls_24h
    emitter: scripts/ops/github-liaison.sh (INFRA-1317)
    trigger: >
      Process acquired the .chump-locks/github-liaison.lock lockdir on a
      fresh start. Marks the start of a liaison reign — this process is
      now the sole reader of the GitHub API for the fleet (Phase 1 of
      docs/design/GITHUB_LIAISON.md).
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, pid, stale_takeover]

  - kind: liaison_heartbeat
    effect_metric: github_api_calls_24h
    emitter: scripts/ops/github-liaison.sh (INFRA-1317)
    trigger: >
      Per-cycle heartbeat from the elected liaison after each refresh
      pass (default 60s). Indicates the cache reconcile loop is alive and
      reconcile_ok=true means the underlying github-cache-reconcile.sh
      one-REST-call refresh succeeded.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, pid, interval_s, reconcile_ok]

  - kind: liaison_takeover
    effect_metric: github_api_calls_24h
    emitter: scripts/ops/github-liaison.sh (INFRA-1317)
    trigger: >
      Liaison lock heartbeat was stale (older than CHUMP_LIAISON_STALE_S,
      default 90s) so this process forcibly reclaimed it. Indicates the
      prior liaison died without releasing — rising frequency is a warning
      that liaison processes are crashing rather than yielding cleanly.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, pid, prev_holder, stale_age_s]

  - kind: liaison_yielded
    effect_metric: github_api_calls_24h
    emitter: scripts/ops/github-liaison.sh (INFRA-1317)
    trigger: >
      Liaison voluntarily released the lock via signal (SIGTERM/INT/HUP),
      EXIT trap on daemon shutdown, or operator-invoked `--release`. Pair
      with the next liaison_elected to confirm clean handoff.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, pid, reason]

  - kind: opus_message_sent
    effect_metric: opus_messages_sent_24h
    emitter: scripts/coord/opus-message.sh (INFRA-1796)
    trigger: >
      A v0 addressed-async DM was sent between Opus sessions via the
      .chump-locks/opus-inbox/ inbox channel. Bridge primitive until
      INFRA-1759 (full A2A Layer 2b RPC) lands. Recipient can be
      session:<id>, gap:<GAP-ID> (routed to current lease holder), or
      all-opus (broadcast). Operator can inspect via opus-message.sh list.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, to, from, ref, msg_id]
  - kind: handoff_contract_violation
    effect_metric: subagent_contract_failures_24h
    emitter: crates/chump-handoff/src/lib.rs (INFRA-1720)
    trigger: >
      Subagent handoff failed schema validation, semantic validation, or
      response parsing. Indicates prompt refinement or contract definition
      needed. Routes violations by `contract_name` so authors can identify
      broken patterns per contract.
    consumers: [fleet-brief, subagent-prompt-feedback]
  - kind: ast_crawler_unsupported_language
    effect_metric: self
    emitter: crates/ast-crawler/src/lib.rs (INFRA-1719 tree-sitter AST crawler)
    trigger: >
      `chump_ast_crawler::crawl_paths` encountered a file with an extension
      not in the day-1 supported set (rust, python, javascript, typescript,
      go, bash, yaml). Debounced per-extension per invocation so a large asset
      tree doesn't flood the stream. Helps the fleet identify languages that
      should be promoted to first-class support next.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, path, ext]
  # INFRA-1720: chump-handoff typed-contract dispatch pipeline. Emitted at
  # every error boundary so dashboards can route violations back to the
  # owning contract for prompt refinement.
  - kind: handoff_contract_violation
    effect_metric: self
    emitter: crates/chump-handoff/src/lib.rs (HandoffContract::dispatch)
    trigger: >
      Subagent returned a payload that failed the contract's typed boundary —
      JSON schema mismatch (missing/extra field, parse error), Output::validate()
      rejection (semantic rule violated), or transport-level dispatch error.
      Parent rejects the payload and emits this rather than proceeding with
      malformed work.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, contract_name, error, raw_output_first_100]
  # INFRA-1722: ARCHITECTURE.md auto-generator. Emitted on each generation so
  # operators (and the fleet-brief consumer) see when a repo's architecture
  # snapshot was refreshed and how much the AST-derived shape changed.
  - kind: architecture_doc_regenerated
    effect_metric: self
    emitter: scripts/ops/generate-architecture-doc.sh (INFRA-1722)
    trigger: >
      The ARCHITECTURE.md generator finished a run against a repo (the chump
      repo itself or a takeover-demo target like echeo). Fires whether or not
      the regenerated output differed from the previous file — operators want
      both the "ran-but-unchanged" and "ran-and-changed-N-lines" signals to
      detect silent regressions in the AST crawler.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, repo, lines_changed, sections_touched]
  - kind: chump_gap_set_legacy_delim
    effect_metric: self
    emitter: src/main.rs `chump gap set --acceptance-criteria` (INFRA-1799)
    trigger: >
      Operator invoked `chump gap set --acceptance-criteria "a|b|c"` with a
      single flag whose value contains '|' — the legacy pipe-delimiter
      form. The preferred path is repeated `--acceptance-criteria BULLET`
      flags, which avoids splitting AC values that legitimately contain
      pipes (Rust generics, recipient syntax <gap-id|session-id|all-opus>,
      regex alternation). Emit lets the curator migrate callers gradually
      before removing the delimiter path.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, gap_id, bullet_count, note]

  # INFRA-1729: Quartermaster artifact regen — fires after every successful
  # capabilities-registry rebuild. `delta_count > 0` means a new primitive
  # surfaced; downstream dashboards can re-validate consumers' tool catalogues.
  - kind: capabilities_registry_refreshed
    effect_metric: self
    emitter: scripts/dev/build-capabilities-registry.sh (INFRA-1729)
    trigger: >
      docs/CAPABILITIES_REGISTRY.json was regenerated by the Quartermaster
      builder (or the Column A `chump ingest` wrapper at
      scripts/ops/generate-capabilities-registry.sh). Fires once per
      invocation regardless of delta; consumers that only care about
      meaningful changes filter on delta_count > 0.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, repo, items_count, delta_count]
  # INFRA-1851: PTY-pressure urgent mode for the claude-reaper. Fires when
  # the count of allocated /dev/ttys??? device files crosses 80% of
  # kern.tty.ptmx_max — the threshold past which new shells/tmux panes/SSH
  # sessions start to fail. The reaper response is to lower REAP_AGE to
  # 600s (10 min) for that sweep so a fresh leak drains in 10 min instead
  # of the 60-min default.
  - kind: reaper_pty_pressure
    effect_metric: self
    emitter: scripts/ops/reap-orphan-claude-procs.sh (INFRA-1851)
    trigger: >
      Pre-reap PTY-allocation probe found ≥80% of kern.tty.ptmx_max
      consumed (default threshold; tunable via CHUMP_REAPER_PRESSURE_THRESHOLD).
      Reaper lowers its effective age floor for this sweep only; the next
      sweep re-evaluates pressure from scratch.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, allocated, limit, pct, threshold, new_reap_age]

  # INFRA-1875: GitHub Liaison webhook-health probe + polling fallback.
  # Closes INFRA-1318 Phase 2 AC #5/#6.
  - kind: liaison_webhook_unhealthy
    effect_metric: self
    emitter: scripts/ops/github-liaison.sh (INFRA-1875)
    trigger: >
      Webhook-receiver health probe (default http://127.0.0.1:8765/health)
      failed CHUMP_LIAISON_WEBHOOK_HEALTH_MAX_FAILS times in a row (default 3).
      Liaison drops poll interval to fallback value and emits
      liaison_polling_fallback_active on the same cycle.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, pid, consecutive_failures, url, last_error]

  - kind: liaison_polling_fallback_active
    effect_metric: self
    emitter: scripts/ops/github-liaison.sh (INFRA-1875)
    trigger: >
      Companion to liaison_webhook_unhealthy — emitted on the cycle the
      liaison switches from normal interval to fallback (default 30s). Pairs
      with liaison_webhook_recovered which fires on the next successful probe.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, pid, poll_interval_s, reason]

  - kind: liaison_webhook_recovered
    effect_metric: self
    emitter: scripts/ops/github-liaison.sh (INFRA-1875)
    trigger: >
      Successful webhook-health probe after the liaison had been in
      polling-fallback mode. Original poll interval restored. Pairs with
      liaison_polling_fallback_active.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, pid, poll_interval_s, url]
  # INFRA-1892: curator-jit-scheduler daemon. Replaces the
  # orchestrator-as-pebble-scheduler antipattern by auto-broadcasting
  # next-gap assignments to curator-opus-* sessions on DONE events.
  - kind: curator_jit_scheduled
    effect_metric: self
    emitter: scripts/coord/curator-jit-scheduler.sh (INFRA-1892)
    trigger: >
      A curator-opus-* session emitted a DONE event (or kind=gap_shipped).
      The daemon called the existing _pick_gap.py with priority filter
      P0,P1 (default), selected the top candidate, and broadcast a JIT
      ASSIGNMENT to that curator's inbox via broadcast.sh.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, curator, gap_id, priority]

  - kind: curator_jit_skipped
    effect_metric: self
    emitter: scripts/coord/curator-jit-scheduler.sh (INFRA-1892)
    trigger: >
      Skipped a JIT broadcast — either dedup-window hit (same curator+gap
      within CHUMP_JIT_DEDUP_WINDOW_S, default 3600s) or the broadcast.sh
      call itself failed. Reason field discriminates.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, curator, gap_id, reason]

  - kind: curator_jit_no_gap
    effect_metric: self
    emitter: scripts/coord/curator-jit-scheduler.sh (INFRA-1892)
    trigger: >
      Curator finished a gap but _pick_gap.py returned no candidate
      matching the priority filter (P0/P1 default). The daemon logs and
      stands by; the curator will idle until a new pickable gap appears.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, curator]
  # META-104: external-collab curator (operator-facing surface + Marcus arc + partnership pipeline)
  - kind: external_collab_finding
    effect_metric: self
    emitter: scripts/coord/external-collab-loop.sh (META-104)
    trigger: >
      curator-opus-external-collab detected a drift condition in one of
      four categories: voice_drift (banned term found in PITCH.md /
      HIDDEN_GEMS.md / DEMO_5MIN.md), surface_stale (doc >14d untouched),
      marcus_at_risk (Marcus milestone stalled >7d with no gap progress),
      partnership_stalled (INFRA-1501/1506/1511 approaching or past
      decision deadline). Curator audits only; does not edit docs directly.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, category, surface, detail]
  - kind: external_collab_scope_override
    effect_metric: self
    emitter: scripts/coord/external-collab-loop.sh (META-104)
    trigger: >
      CHUMP_EXTERNAL_COLLAB_SCOPE_OVERRIDE=1 was set, allowing the
      external-collab curator to claim work outside its defined lane
      (OPERATOR-FACING + EXTERNAL-FACING surfaces). Emitted for audit
      accountability.
    consumers: [ops-audit]
    fields_required: [ts, kind]
  # INFRA-1886: soft pre-claim suggestion in `chump gap preflight <ID>`.
  - kind: preflight_priority_hint_shown
    effect_metric: self
    emitter: src/main.rs print_priority_hint() (INFRA-1886)
    trigger: >
      `chump gap preflight <ID>` returned OK for a target gap whose
      priority is below P0; print_priority_hint surfaced up to 3
      higher-priority unclaimed gaps as advisory. Operator + curator
      see the note; choice to abandon the intended claim remains theirs.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, target_gap, suggested_gaps_count, target_priority]

  # INFRA-1899: transient-retrigger daemon. Auto-recognizes known-transient
  # CI failure patterns on open PRs and pushes an empty commit to force a
  # fresh CI run, capped at 2 retries per PR per 6 hours. Retires the
  # operator hand-empty-commit-retrigger workaround (today's session had
  # 10+ manual retriggers for the audit-cancel pattern alone).
  - kind: transient_auto_retriggered
    effect_metric: self
    emitter: scripts/coord/transient-retrigger.sh (INFRA-1899)
    trigger: >
      Daemon classified an open PR's failing required check against the
      catalog at scripts/coord/transient-classes.json (audit_cancelled,
      checkout_auth_race, flake_rerun_exhausted, network_blip), confirmed
      the per-PR retry cap (default 2/6h) was not yet exceeded, and
      pushed an empty commit to the PR's head branch to force a fresh
      CI run. The attempt_number field discriminates first vs. second
      retry within the window.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, pr, failure_class, attempt_number]

  # META-100/META-101: QUEUE_SATURATED detection — operator-recall condition (e).
  # Fired by scripts/dispatch/operator-recall.sh when queued workflow_runs
  # older than CHUMP_RUNNER_QUEUE_THRESHOLD_S exist AND ≥1 self-hosted runner
  # is online+idle (the contradiction that caused 14 PRs to wait 17h on
  # 2026-05-24). This event fires before the operator_recall page so consumers
  # can track detection frequency independently of cooldown-gated paging.
  # As of META-101 the paged operator_recall condition classifies into
  # RUNNERS_GHOSTED or QUEUE_SATURATED_GH_HOSTED per docs/process/CI_RUNNER_HEALTH.md.
  - kind: runner_ghost_online_detected
    effect_metric: self
    emitter: scripts/dispatch/operator-recall.sh (META-100/META-101)
    trigger: >
      operator-recall.sh detected ≥1 queued workflow_run older than
      CHUMP_RUNNER_QUEUE_THRESHOLD_S (default 300s) while at least one
      self-hosted runner reports status=online and busy=false. Emitted
      unconditionally (not cooldown-gated) so detection frequency is
      observable even when paging is suppressed by the cooldown window.
    consumers: [operator-recall, fleet-brief, ops-audit]
    fields_required: [ts, kind, queued_count, oldest_age_s, idle_runners, threshold_s]

  # META-100: recovery script ran (scripts/ops/restart-actions-runners.sh).
  # Emitted after launchctl unload+load cycle for all configured runner plists.
  - kind: actions_runners_restarted
    effect_metric: self
    emitter: scripts/ops/restart-actions-runners.sh (META-100)
    trigger: >
      Operator (or automated recovery) ran restart-actions-runners.sh to
      cycle the launchd plists for all self-hosted GitHub Actions runner
      agents. prior_queued_count is the workflow run queue depth sampled
      immediately before the restart so the operator can confirm the queue
      drained after recovery.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, runners_restarted_count, prior_queued_count]

  # META-088: Oracle refresh cron. Periodic Opus burst (every 4h via launchd)
  # re-contemplates docs/process/THE_PATH.md against current state.db + recent
  # ambient. Emits 4 ambient kinds for observability.
  - kind: oracle_refresh_drift
    effect_metric: self
    emitter: scripts/coord/oracle-refresh.sh (META-088)
    trigger: >
      Oracle burst returned content with a different shasum than the existing
      docs/process/THE_PATH.md — the refresh produced real drift. THE_PATH.md
      has been overwritten and an auto-merge PR opened. before_hash + after_hash
      let consumers see the change magnitude.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, before_hash, after_hash]
  - kind: oracle_refresh_noop
    effect_metric: self
    emitter: scripts/coord/oracle-refresh.sh (META-088)
    trigger: >
      Oracle burst returned content with the same shasum as the existing
      THE_PATH.md — idempotent no-op. No PR opened. Useful signal for
      "Oracle ran but nothing changed" telemetry.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, hash]
  - kind: oracle_refresh_skipped
    effect_metric: self
    emitter: scripts/coord/oracle-refresh.sh (META-088)
    trigger: >
      Oracle daemon ran but could not complete a burst — either the claude
      CLI is missing OR the burst returned empty/too-short output. reason
      field discriminates causes (claude_cli_missing, empty_or_short_output).
      Fail-soft path so the daemon stays cron-able even when LLM access
      is down.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, reason]
  - kind: oracle_refresh_pr_opened
    effect_metric: self
    emitter: scripts/coord/oracle-refresh.sh (META-088)
    trigger: >
      After a drift event, the daemon successfully created an auto-merge
      PR with the refreshed THE_PATH.md. branch field is the PR's head
      branch name (chump/oracle-refresh-<stamp>).
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, branch]
  # INFRA-2122: oracle-refresh silent-failure visibility. Replaces the
  # stderr-swallowing 2>/dev/null path that masked INFRA-2124 OAuth chain
  # breakage and let THE_PATH.md sit 4d stale despite a 4h cadence claim.
  - kind: oracle_refresh_failed
    effect_metric: self
    emitter: scripts/coord/oracle-refresh.sh (INFRA-2122)
    trigger: >
      claude -p exited non-zero (auth failures like "Not logged in", OAuth
      chain breakage, transport errors). Carries exit_code + elapsed_s plus
      truncated stderr (500 chars) so the real cause surfaces in ambient
      instead of being swallowed by 2>/dev/null. Distinct from
      oracle_refresh_empty which is exit-0-but-no-output.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, exit_code, elapsed_s, stderr]
  - kind: oracle_refresh_empty
    effect_metric: self
    emitter: scripts/coord/oracle-refresh.sh (INFRA-2122)
    trigger: >
      claude -p exited 0 but returned empty/too-short output (<200 chars).
      Discriminates "model returned empty" from "auth failed" — the legacy
      oracle_refresh_skipped conflated both. Carries body_len + elapsed_s
      + stderr so operators can tell if the model just refused vs. tripped
      a transient error.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, exit_code, elapsed_s, body_len, stderr]
  - kind: oracle_stale_despite_heartbeat
    effect_metric: self
    emitter: scripts/coord/oracle-refresh.sh (INFRA-2122)
    trigger: >
      META-alarm — detector for the detector failing. THE_PATH.md mtime is
      older than CHUMP_ORACLE_STALE_THRESHOLD_S (default 12h) but the
      oracle-refresh state file was touched within CHUMP_ORACLE_HEARTBEAT_WINDOW_S
      (default 6h) — i.e., daemon is alive but its output is stale. Same
      class as INFRA-2101 binary-refresh silent-staleness. Use to alert
      operators before another 4d quiet-failure window opens.
    consumers: [fleet-brief, ops-audit, slo-watchdog]
    fields_required: [ts, kind, path_age_s, state_age_s, stale_threshold_s]
  # INFRA-2123: event-driven Oracle refresh. In addition to the 4h cadence
  # (META-088), scripts/ops/oracle-event-trigger.sh tails ambient.jsonl and
  # forces a refresh once CHUMP_ORACLE_GAP_THRESHOLD gap_reserved events
  # have landed since the last completed run — so a burst of newly-filed
  # gaps gets re-ranked within minutes instead of waiting out the cadence.
  - kind: oracle_event_trigger_fired
    effect_metric: self
    emitter: scripts/ops/oracle-event-trigger.sh (INFRA-2123)
    trigger: >
      gap_reserved count since the last completed oracle refresh
      (oracle_refresh_drift or oracle_refresh_noop) reached
      CHUMP_ORACLE_GAP_THRESHOLD (default 5), and no refresh has run within
      the CHUMP_ORACLE_COALESCE_S dedup window (default 1h) — so
      oracle-refresh.sh --force was invoked.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, gap_count, threshold]
  - kind: oracle_event_trigger_coalesced
    effect_metric: self
    emitter: scripts/ops/oracle-event-trigger.sh (INFRA-2123)
    trigger: >
      gap_reserved threshold was met but a refresh (of any outcome) already
      ran within the CHUMP_ORACLE_COALESCE_S dedup window — event-driven
      trigger was suppressed to avoid double-bursting on top of the 4h
      cadence.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, gap_count, threshold, last_run_age_s, coalesce_s]
  # META-098: daily self-productization wave. Once per day a launchd cron
  # sends 6 A2A broadcast.sh DMs (one per curator role) asking the curator
  # to contemplate what changed in their lane and add delta-AC to their
  # agent.md / SKILL.md (or file a follow-up gap). Productizes the manual
  # A2A wave that spawned META-097.
  - kind: daily_self_productize_wave
    effect_metric: self
    emitter: scripts/coord/daily-self-productize.sh (META-098)
    trigger: >
      Daemon fired once per day (idempotent on same-date guard). Sends
      one broadcast.sh DM per curator role (6 total). roles_paged is the
      count of successful pages; failed is the count of failed pages.
      Consumers can compute the wave-cadence over time to verify the
      ritual runs daily.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, date, roles_paged, failed]
  # META-103: curator-opus-observability telemetry-tuning findings.
  # Emitted by scripts/coord/observability-loop.sh via printf in _emit_finding
  # helper; structured payload not grep-scannable as bare literal.
  - kind: observability_finding
    effect_metric: self
    emitter: scripts/coord/observability-loop.sh (META-103)
    trigger: >
      Emitted on each tick cycle when audit-event-registry, reaper-cadence-audit,
      cost-leaderboard-rollup, or detector-noise-rank detects an anomaly.
      category is one of: zero_emit_kind, high_volume_kind, reaper_cadence_drift,
      api_burner. severity is one of: proposal, warn, alert, info.
    consumers: [fleet-brief, ops-audit, observability-curator]
    fields_required: [ts, kind, category, severity, kind_or_subject, detail]
  # META-102: curator-opus-infra-watcher SRE-lane substrate health finding.
  # Emitted by scripts/coord/infra-watcher-loop.sh on each tick cycle when a
  # substrate health check fires above threshold. category distinguishes the
  # four check types; severity is critical|warning. Would have caught the
  # 2026-05-24 incidents (17h runner ghost-online, StartInterval-missing-plist,
  # 154 claude procs, disk_critical) within minutes of first tick.
  - kind: infra_watcher_finding
    effect_metric: self
    emitter: scripts/coord/infra-watcher-loop.sh (META-102)
    trigger: >
      One finding per substrate health violation detected during a tick cycle.
      category is one of: daemon_plist_missing_interval, runner_ghost_online,
      disk_pressure, process_bloat, pty_exhaustion. severity is critical or
      warning. detail is a human-readable description of the finding with
      threshold and observed values. Emitted at most once per category per
      tick to avoid flooding. Consumers watch for critical findings to page
      the operator via operator-recall.sh. category=pty_exhaustion (RESILIENT-092)
      additionally invokes operator-recall.sh directly with
      condition=PTY_EXHAUSTION at emit time — pty exhaustion pages the
      operator immediately rather than waiting on a downstream consumer,
      since forkpty failure is machine-wide and minutes away once pressure
      is detected.
    consumers: [fleet-brief, ops-audit, operator-recall]
    fields_required: [ts, kind, category, severity, detail]
  # INFRA-1976: repo variable drift detection — post-incident stale variable audit.
  # Emitted by scripts/coord/infra-watcher-loop.sh check-repo-vars when a repo
  # variable deviates from its expected steady-state value in
  # scripts/setup/expected-repo-vars.yaml AND the divergence has persisted >2h.
  # Root cause: CHUMP_SELF_HOSTED_ENABLED=false sat unrecovered for 4 days
  # (2026-05-20 to 2026-05-24) causing silent CI starvation. This kind surfaces
  # post-incident variable drift before it becomes a multi-day outage.
  - kind: repo_var_stale_after_incident
    effect_metric: self
    emitter: scripts/coord/infra-watcher-loop.sh (INFRA-1976)
    trigger: >
      Emitted when gh variable list shows a repo variable value that differs
      from the expected value in scripts/setup/expected-repo-vars.yaml AND
      the divergence has persisted for more than 2 hours (tracked via
      .chump-locks/repo-var-divergence-state.json). At most one event per
      variable name per infra-watcher tick to avoid flooding. The var_name and
      actual_value fields identify which variable is stale and what it currently
      holds. Consumers should page the operator to restore the expected value.
    consumers: [fleet-brief, ops-audit, operator-recall]
    fields_required: [ts, kind, var_name, expected_value, actual_value, diverged_since]
  # RESEARCH-001: phantom doc-ref detection (chump gap audit-priorities)
  - kind: phantom_doc_ref_detected
    effect_metric: self
    emitter: src/main.rs (RESEARCH-001, chump gap audit-priorities)
    trigger: >
      RESEARCH_INTEGRITY.md cites a gap ID (e.g. EVAL-094) but no matching
      docs/gaps/<ID>.yaml exists in the registry. Emitted once per phantom
      reference detected during chump gap audit-priorities --research-check.
      Indicates a stale citation that should be removed or the gap filed.
    consumers: [audit-log]
    fields_required: [ts, kind, doc, gap_id]
  # META-978: Part A slice of META-130 / docs/design/SUBAGENT_ATTRIBUTION.md.
  - kind: subagent_spawned
    effect_metric: self
    emitter: scripts/coord/emit-subagent-spawn.sh (META-978)
    trigger: >
      An orchestrator session launches a sub-agent via the Agent tool.
      Carries a synthetic sub_session_id (chump-sub-<parent>-<agent_id>),
      parent_session_id, worktree_path, agent_description, and model — the
      hierarchy input the fleet-recorder needs (SUBAGENT_ATTRIBUTION.md
      Part B, not yet implemented) to attribute sub-agent activity to its
      own lane instead of collapsing it into the parent session.
    consumers: [fleet-recorder (planned), fleet-scrubber (planned)]
    fields_required: [ts, kind, session, sub_session_id, parent_session_id, worktree_path]
  # INFRA-1922: curator-opus-handoff productization. The handoff curator role
  # ships as .claude/agents/handoff.md + .claude/skills/handoff/SKILL.md +
  # scripts/coord/handoff-loop.sh (harness-neutral CLI). The CLI emits the
  # three kinds below.
  - kind: sub_agent_dispatched
    effect_metric: self
    emitter: scripts/coord/handoff-loop.sh (INFRA-1922) — also expected from other curators per META-069 / CREDIBLE-074
    trigger: >
      An Opus curator (any role) dispatched a Sonnet sub-agent via the Agent
      tool to ship a gap. Emitted per dispatch so the operator can audit the
      Opus-vs-Sonnet ratio (CREDIBLE-074). Fields: gap (target gap id), role
      (dispatching curator role), target_model (always "sonnet" today).
    consumers: [fleet-brief, ops-audit, dispatch-hygiene]
    fields_required: [ts, kind, session, gap, role, target_model]
  - kind: handoff_heartbeat
    effect_metric: self
    emitter: scripts/coord/handoff-loop.sh (INFRA-1922) heartbeat subcommand
    trigger: >
      curator-opus-handoff role tick — emitted periodically so the
      orchestrator can audit liveness. Cron-driven (launchd plist filed
      separately) or invoked manually via /handoff heartbeat.
    consumers: [fleet-brief, ops-audit]
    fields_required: [ts, kind, session, role]
  - kind: handoff_lane_override
    effect_metric: self
    emitter: scripts/coord/handoff-loop.sh (INFRA-1922) when CHUMP_HANDOFF_LANE_OVERRIDE=1
    trigger: >
