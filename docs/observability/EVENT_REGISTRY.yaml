  # ── PR / gap lifecycle ─────────────────────────────────────────────────────
  - kind: gap_reserved
    effect_metric: self
    emitter: chump gap reserve
    trigger: new gap added to state.db
    consumers: [audit-log]
    fields_required: [gap_id, domain]

  - kind: gap_reserve_blocked
    effect_metric: self
    emitter: src/main.rs — chump gap reserve (INFRA-1607)
    trigger: chump gap reserve was called while .chump/fleet-paused sentinel
      exists and CHUMP_IGNORE_WASTE_PAUSE is not set to 1; the reserve is
      refused before any state.db write
    consumers: [fleet-brief, audit-log]
    fields_required: [ts, kind, pause_reason, domain, title]
    docs: |
      pause_reason is the "reason" field from the fleet-paused JSON payload
      (e.g. pipeline_jam, slo_breach). Bypass: set CHUMP_IGNORE_WASTE_PAUSE=1.

  - kind: gap_id_reused_from_git_history_avoided
    effect_metric: self
    emitter: crates/chump-gap-store/src/lib.rs — gap ID assignment (INFRA-1954)
    trigger: chump gap reserve generated a candidate ID that already appears in
      git history (a merged/abandoned branch used it); the counter is advanced
      and the collision-prone ID is skipped before any state.db write
    consumers: [audit-log]
    fields_required: [ts, kind, domain, skipped_id]
    docs: |
      Prevents ID reuse when git history references a candidate ID the counter
      would otherwise re-assign. skipped_id is the avoided candidate; the reserve
      retries with the next number.

  - kind: gap_cooldown_cleared
    effect_metric: self
    emitter: scripts/coord/lib/gap-cooldown.sh via gap_cooldown_clear() (INFRA-1220)
    trigger: operator clears a post-close cooldown via the shell library
    consumers: [audit-log]
    fields_required: [ts, kind, gap, reason]
    docs: |
      Emitted when gap_cooldown_clear() removes the cooldown stamp for a gap.
      reason is operator-provided and mandatory for audit trail.

  - kind: gap_cooldown_cleared_cli
    effect_metric: self
    emitter: src/main.rs — chump gap clear-cooldown (INFRA-1220)
    trigger: operator runs 'chump gap clear-cooldown <ID> --reason ...'
    consumers: [audit-log]
    fields_required: [ts, kind, gap_id, reason]
    docs: |
      Rust-side ambient event emitted by chump gap clear-cooldown after the
      shell script completes. Pairs with gap_cooldown_cleared (shell side).
      Both events appear together on a successful clear.

  - kind: gap_shipped
    effect_metric: self
    emitter: "chump gap ship; src/main.rs --execute-gap arm (INFRA-2055)"
    trigger: "gap status flipped to done, OR chump --execute-gap exits cleanly after agent reply"
    consumers: [audit-log, kpi-report, wizard-daemon]
    fields_required: [gap_id, pr_number, commit_sha]
    docs: |
      Emitted by two paths: (1) chump gap ship on manual ship, (2) the
      chump --execute-gap arm in src/main.rs on every clean Ok(reply) exit
      (INFRA-2055 terminal-outcome guarantee). pr_number is parsed from the
      agent reply (may be empty if agent did not print one); commit_sha is
      the HEAD SHA at ship time. wizard-daemon reads this kind to confirm
      a dispatched gap reached a terminal state without heuristic guessing.

  - kind: gap_blocked
    effect_metric: self
    emitter: "src/main.rs --execute-gap arm (INFRA-2055)"
    trigger: "chump --execute-gap exits with any error, timeout, panic, or signal"
    consumers: [wizard-daemon, fleet-brief, audit-log]
    fields_required: [gap_id, reason, recoverable_by]
    docs: |
      Emitted on EVERY non-clean exit from chump --execute-gap: uncaught
      error, provider exhaustion, timeout, unexpected exit. reason is the
      formatted anyhow error chain (truncated); recoverable_by is a hint
      tag (fix_billing | restart_daemon | manual_rescue | signal_term).
      wizard-daemon reads this to stop re-dispatching a blocked gap.
      INFRA-2055: authoritative fix for the wheel-spin class observed in
      the 2026-05-27 trial run.

  - kind: gap_deferred
    effect_metric: self
    emitter: "src/main.rs --execute-gap arm (INFRA-2055)"
    trigger: "chump --execute-gap agent explicitly punts to wait for an external event"
    consumers: [wizard-daemon, fleet-brief]
    fields_required: [gap_id, reason, defer_until_event]
    docs: |
      Emitted when the agent decides it cannot make progress without an
      external event (e.g. upstream_pr_landed, ci_green, billing_resolved).
      defer_until_event is a short tag naming the event; wizard-daemon uses
      it to schedule a re-dispatch check rather than immediately retrying.

  - kind: gap_workflow_phase
    effect_metric: self
    emitter: src/web_server.rs (PWA autonomous workflows)
    trigger: autonomous gap workflow transitions between phases
    consumers: [fleet-brief, ambient-context-inject]
    fields_required: [gap_id, phase, status]
    docs: "Phase values: preflight, claim, execute-gap, ship. Status: started, success, failed, error, partial"

  - kind: gap_drift_orphan
    effect_metric: self
    emitter: scripts/coord/gap-doctor.py
    trigger: gap in state.db without YAML mirror
    consumers: [fleet-brief]

  - kind: gap_drift_yaml_only
    effect_metric: self
    emitter: scripts/coord/gap-doctor.py
    trigger: YAML file without state.db row
    consumers: [fleet-brief]

  - kind: yaml_orphan_pruned
    effect_metric: self
    emitter: scripts/coord/gap-doctor.py (safe-sweep --prune-orphans)
    trigger: >
      docs/gaps/<ID>.yaml deleted because a state.db re-check performed
      immediately before the delete confirmed no row exists for that ID
      (EFFECTIVE-219). State always wins: if the re-check finds a row, the
      file is rewritten from state.db instead of deleted, and no event is
      emitted for that ID.
    fields_required: [gap_id, file_path, reason, daemon_name]
    consumers: [fleet-brief]

  - kind: pr_classified
    effect_metric: self
    emitter: scripts/coord/pr-shepherd-daemon.sh (META-183, META-185)
    trigger: >
      emitted once per open PR per tick of the PR-shepherd daemon; classifies each PR based on
      mergeStateStatus, autoMergeRequest, and (META-185) statusCheckRollup.
      classification enum: BEHIND (needs rebase), MERGEABLE (CLEAN, no auto-merge),
      ARMED (CLEAN, auto-merge set), DIRTY (merge conflict),
      BLOCKED_GREEN (BLOCKED + all checks pass + no auto-merge armed — auto-rearm target),
      BLOCKED_REAL_FAIL (BLOCKED + at least one check FAILURE — file-gap target),
      BLOCKED (BLOCKED + checks still running or inconclusive — catch-all),
      UNKNOWN (GitHub still computing mergeability).
    consumers: [fleet-brief, pr-shepherd-daemon, pr-auto-rearm-daemon]
    fields_required: [ts, kind, pr, classification, gap_id, age_minutes, dry_run]

  - kind: pr_shepherd_tick
    effect_metric: self
    emitter: scripts/coord/pr-shepherd-daemon.sh
    trigger: emitted once per tick of the PR-shepherd daemon (META-181/META-180); counts open PRs and drives classification + rebase-action phase (META-183/META-184)
    consumers: [fleet-brief, waste-tally]
    fields_required: [ts, kind, open_pr_count, dry_run]

  - kind: pr_queue_auto_action
    effect_metric: self
    emitter: scripts/coord/pr-shepherd-daemon.sh (INFRA-2346)
    purpose: >
      Audit trail for the pr-queue auto-processor tiers. Every CLEAN_GREEN
      admin-merge, BLOCKED_FLAKE rerun, and their skip/failure variants
      emit one of these. Operator can grep ambient and reconstruct every
      autonomous merge action the fleet took.
    trigger: |
      emitted once per CLEAN_GREEN / BLOCKED_FLAKE action attempt; action enum:
        admin_merge              — CLEAN_GREEN PR squash-admin-merged
        admin_merge_skipped      — skipped; reason=trunk_red|capped
        admin_merge_failed       — gh exit non-zero; reason=gh_exit_<N>
        flake_rerun              — gh run rerun --failed fired; reason=known_flake
        flake_rerun_skipped      — skipped; reason=trunk_red|capped|no_run_id
        flake_rerun_failed       — gh exit non-zero; reason=gh_exit_<N>
    consumers: [fleet-brief, waste-tally, kpi-report, operator-audit]
    fields_required: [ts, kind, pr, action, reason, author, mergeStateStatus, dry_run]
    volume_estimate: "~10-30/h during active queue catch-up; ~0-5/h steady-state"

  - kind: flake_rerun_capped
    effect_metric: self
    emitter: scripts/coord/pr-shepherd-daemon.sh (INFRA-2361)
    purpose: >
      Detection signal for scripts/coord/flake-auto-quarantine.sh: emitted
      whenever a PR exhausts its per-PR flake-rerun cap (MAX_FLAKE_RERUNS_PER_PR)
      on checks that are ALL known-flake-classified. One event per capped PR;
      the auto-quarantine detector groups these by check_name across many
      distinct PRs to distinguish a transient blip from a persistently flaky
      check worth quarantining.
    trigger: PR hits the flake-rerun cap in the BLOCKED_FLAKE tier (see kind=pr_queue_auto_action action=flake_rerun_skipped reason=capped, emitted alongside)
    consumers: [flake-auto-quarantine]
    fields_required: [ts, kind, pr, check_names, author, dry_run]

  - kind: flake_auto_quarantined
    effect_metric: self
    emitter: scripts/coord/flake-auto-quarantine.sh (INFRA-2361)
    purpose: >
      A check was auto-quarantined into docs/process/KNOWN_FLAKES.yaml
      check_flakes: because it hit the flake-rerun cap on
      CHUMP_FLAKE_QUARANTINE_PR_THRESHOLD (default 3) or more distinct PRs
      within CHUMP_FLAKE_QUARANTINE_WINDOW_HOURS (default 72h). A tracking
      gap is filed and referenced. failure_class is always "permanent" here
      (the taxonomy's "transient" case is simply not actioned/not emitted).
    trigger: flake_rerun_capped events for one check_name reach the PR-count threshold within the window
    consumers: [flake-auto-quarantine --report, operator-audit]
    fields_required: [ts, kind, check_name, pr_count, gap_id, failure_class, dry_run]

  - kind: flake_auto_quarantine_failed
    effect_metric: self
    emitter: scripts/coord/flake-auto-quarantine.sh (INFRA-2361)
    purpose: audit trail for a quarantine attempt that failed (gap-reserve call failed, or the KNOWN_FLAKES.yaml write failed) so the candidate isn't silently dropped.
    trigger: chump gap reserve exits non-zero/unparseable, or the catalog-write python step fails
    consumers: [flake-auto-quarantine --report, operator-audit]
    fields_required: [ts, kind, check_name, pr_count, reason, dry_run]

  - kind: flake_auto_quarantine_tick
    effect_metric: self
    emitter: scripts/coord/flake-auto-quarantine.sh (INFRA-2361)
    purpose: >
      Cost/summary event emitted once per run regardless of outcome — how
      many checks were evaluated, how many were quarantined, and how many
      gaps were filed (the "cost" of the tick). This is the surface
      `--report` and the operator read to answer "what did the auto-detector
      spend this cycle."
    trigger: end of every flake-auto-quarantine.sh run (tick or --dry-run)
    consumers: [flake-auto-quarantine --report, waste-tally, operator-audit]
