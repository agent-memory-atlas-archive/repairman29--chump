      Carries active_count and max_parallel for rate-limit visibility.
    consumers: [ops-audit]
    fields_required: [ts, kind, source, active_count, max_parallel]

  - kind: wizard_gap_skipped
    effect_metric: resilient
    emitter: scripts/coord/wizard-daemon.sh step4 (META-107)
    trigger: >
      Emitted when wizard-daemon step4 skips a gap that has wizard_skip:true
