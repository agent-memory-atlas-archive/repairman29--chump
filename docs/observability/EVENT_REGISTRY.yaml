    consumers: [fleet-brief, audit-log, watchdog]
    fields_required: [ts, kind, task, interval_s, run_id, exit_code, elapsed_ms]
    docs: |
      Replaces the Claude-Code-hosted scheduled-tasks MCP path. exit_code is
      the script's exit status; non-zero means the task failed (visible in
      ambient AND in /tmp/chump-fleet-daemon.err.log). elapsed_ms is wall-clock
      run time. Missed daemon_tick events for a known interval_s mean the
      daemon itself is dead — check `launchctl list | grep fleet-daemon`.

