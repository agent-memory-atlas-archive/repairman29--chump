      (default 2) consecutive cycles with a credit/rate/auth signature; worker
      switches itself to chump-local (free-tier cascade) so a sub-cap outage
      never silently blocks gaps as if the gap were bad
    consumers: [fleet-brief, watchdog, operator-recall]
    fields_required: [agent_id, from_backend, to_backend, fail_class, consecutive_failures, gap_id]

  - kind: fleet_backend_outage_unblock
    effect_metric: self
    emitter: scripts/dispatch/worker.sh (RESILIENT-575)
