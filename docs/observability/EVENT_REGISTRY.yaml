  - kind: curator_bin_disposable
    effect_metric: self
    emitter: scripts/ops/curator-supervisor-run.sh (RESILIENT-246)
    trigger: supervisor is running from target/release, a reapable build path whose disappearance caused the twelve-day outage
    consumers: [fleet-brief, operator-recall]

  - kind: curator_supervisor_pass
    effect_metric: self
    emitter: scripts/ops/curator-supervisor-run.sh (RESILIENT-246)
    trigger: every supervisor invocation — written to .chump-locks/curator-supervisor-last-pass.json on success AND failure so freshness is gradeable
    consumers: [fleet-brief, reaper-heartbeat-watchdog]

  - kind: curator_fleet_outage
    effect_metric: self
    emitter: crates/chump-curator-supervisor/src/main.rs (RESILIENT-246)
    trigger: >
      EVERY curator role reports never-started in the same tick. That is one
      launcher-level fault (fleet-autopilot never spawned them, or the tmux
      server is gone), not six independent ones, so it files a single P0 and
      takes NO automated remediation — there is no pane to respawn.
    consumers: [fleet-brief, operator-recall]
    fields_required: [roles]

  - kind: curator_supervisor_blind
    effect_metric: self
    emitter: crates/chump-curator-supervisor/src/main.rs (RESILIENT-246)
    trigger: >
      the heartbeat scan could not cover the stall threshold — ambient stream
      missing, unreadable, or rotated so recently that its oldest retained
      timestamp is newer than the cutoff. The supervisor cannot distinguish a
      dead curator from an unobservable one, so it reports that instead of
      guessing. Emitted once per tick, NOT once per role: a blind scan is one
      observability problem, and fanning it out would file six phantom curator
      gaps at every nightly log rotation.
    consumers: [fleet-brief, operator-recall]
    fields_required: [check, why]

  - kind: curator_supervisor_remediation_withheld
    effect_metric: self
    emitter: crates/chump-curator-supervisor/src/main.rs (RESILIENT-246)
    trigger: >
      a curator failure was filed but auto-remediation was deliberately not
      attempted, because the state is not one remediation can address — a role
      that never started has no pane to respawn, and an unobservable role must
      not be acted on at all. Pairs with the gap so the operator can see that
      the quiet after a page is a decision, not a dropped ball.
    consumers: [fleet-brief, operator-recall]
    fields_required: [role, heartbeat, why]

  - kind: curator_substrate_outage
    effect_metric: self
    emitter: crates/chump-curator-supervisor/src/main.rs (RESILIENT-038)
    trigger: >
      substrate_check() detects an environmental cause (disk full, GH API rate
      limited, NATS unreachable, or CHUMP_AUTH_MODE unhealthy) impacting the
      failing curators for this tick. Files ONE "substrate: X impacting
      curators" gap instead of one gap per curator, broadcasts a WARN, and
      spawns zero per-curator Sonnet sub-agents — the failures are
      environmental, not curator code defects. The substrate_check() verdict
      itself is cached on disk for 5 minutes to avoid hammering df/gh
      api/chump-coord/auth-status.sh once per failing curator.
    consumers: [fleet-brief, operator-recall]
    fields_required: [substrate_kind, detail, roles]

  - kind: stale_gap_lock_reaped
    effect_metric: self
    emitter: scripts/ops/stale-gap-lock-reaper.sh (INFRA-676)
    trigger: zombie gap-lock removed
    consumers: [fleet-brief]
    fields_required: [lock, session]

  - kind: orphan_subprocess_reaped
    effect_metric: self
    emitter: scripts/ops/reap-orphan-claude-procs.sh (INFRA-1662)
    trigger: >
      launchd watchdog swept the process table for `claude` binary subprocesses
      whose ppid chain does not reach the foreground Claude.app PID and whose
      etime exceeds REAP_AGE (default 3600s). Each sweep emits exactly one
      event, including count=0 to prove the watchdog is alive (steady state).
      Prevents the 60h cron-loop leak that pinned 8.5GB RAM with 354 wedged
      subprocesses on 2026-05-22.
    consumers: [operator-recall, fleet-brief]
    fields_required: [ts, count, oldest_etime_secs, total_rss_kb, reap_age_secs, fg_pid, dry_run]

  - kind: stale_process_reaped
    effect_metric: self
    emitter: scripts/ops/stale-process-watchdog.sh (INFRA-1663)
    trigger: >
      launchd watchdog (every 30 min) swept the process table for long-tail
      fleet leaks — rustc (10m), cargo (15m), `chump health` (2m), worker.sh
      (4h), bot-merge.sh (20m), run-fleet.sh (24h). Any matching process whose
      etime exceeds its class's expected lifetime is SIGTERMed with 30s grace,
      then SIGKILLed if still alive. One per-kill event is emitted (action =
      sigterm or sigkill) plus one heartbeat sweep record per invocation
      (sweep=true, count=N) so the watchdog's liveness is always visible.
      Generalizes INFRA-1662 (claude-only) to the rest of the fleet.
      Discovery: 2026-05-22 cleanup found 5 rustc procs alive 1.5+ days and
      2 `chump health --slo-check` alive 11+ h.
    consumers: [operator-recall, fleet-brief]
    fields_required: [ts, pid, comm, class, etime_secs, expected_secs, action, dry_run]
  - kind: main_red_detected
    effect_metric: self
    emitter: scripts/ops/main-health-watchdog.sh (INFRA-1656)
    trigger: >
      Daily launchd watchdog at 02:00 local queries the latest CI run on main.
      Each sweep emits exactly one event: on success it is a heartbeat
      (status=success, gap_id=none) proving the watchdog is alive; on failure
      it carries status=filed plus the freshly-reserved gap_id (or
      status=deduped if a P0 INFRA-NEW-MAIN-RED-* gap already references the
      same head_sha). Closes the 2026-05-20 24h-red-main feedback gap where
      every PR's CI burned silently until an operator noticed.
    consumers: [operator-recall, fleet-brief]
    fields_required: [ts, gate, sha, run_url, head_sha, gap_id, dry_run, status]

  # ── INFRA-6701: recently-merged-PR overlap advisory at reserve time ───────
  - kind: gap_reserve_merged_pr_overlap
    effect_metric: self
    emitter: src/main.rs gap reserve handler (INFRA-6701)
    trigger: chump gap reserve found a PR merged within
      CHUMP_GAP_RESERVE_MERGED_PR_WINDOW_DAYS (default 7) whose title
      Jaccard-overlaps the proposed gap title at or above
      CHUMP_GAP_RESERVE_SIMILARITY_WARN (default 0.65). Catches the
      "already shipped, just closing the gap" bookkeeping-PR class that the
      open-PR (FLEET-029) and shipped-gap (ZERO-WASTE-045) checks miss.
      Advisory only — never blocks; recorded in the new gap's notes so a
      human/curator can supersede or dismiss.
    consumers: [fleet-brief, waste-tally]
    fields_required: [ts, kind, proposed_title, match_pr, match_title, match_score, merged_at]

  - kind: target_artifact_reaped
