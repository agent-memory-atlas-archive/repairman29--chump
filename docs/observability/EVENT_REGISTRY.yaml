  - kind: queue_stagnant
    effect_metric: self
    emitter: scripts/coord/queue-stagnation-monitor.sh (INFRA-2353, META-269 sub-4)
    trigger: pickable-gap queue (status='open' in state.db) exceeds
      CHUMP_QUEUE_STAGNATION_MIN_PICKABLE (default 10) AND zero kind=gap_claimed
      events landed in ambient.jsonl within CHUMP_QUEUE_STAGNATION_WINDOW_SECS
      (default 86400 = 24h) — distinct from operator-recall.sh's QUEUE_STARVE
