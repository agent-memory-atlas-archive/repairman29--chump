  # RESILIENT-031: admin-merge discipline audit trail
  - kind: admin_merge_forced
    effect_metric: self
    emitter: scripts/ops/admin-merge-cycle.sh (RESILIENT-031)
    trigger: >
      Operator used --force-admin --reason to bypass the noise-class discipline
      gate and run an admin-merge cycle without a matching known-noise-classes.yaml
      entry. Emitted so the operator can audit the frequency and justification of
      emergency admin-merge bypasses. Each event carries the PR number, reason
      text, and operator identity (USER). High frequency signals the class list
      needs updating.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, pr, reason, operator]

  - kind: admin_merge_cycle_ok
    effect_metric: self
    emitter: scripts/ops/admin-merge-cycle.sh (INFRA-2041 + RESILIENT-031)
    trigger: >
      Admin-merge cycle completed successfully: required_status_checks dropped,
      PR merged with --admin --squash, ruleset restored. Emitted at the end of
      a successful cycle as the primary success signal for the ops-audit log.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, pr, ruleset_id]

  - kind: admin_merge_cycle_merge_failed
    effect_metric: self
    emitter: scripts/ops/admin-merge-cycle.sh (INFRA-2041 + RESILIENT-031)
    trigger: >
      gh pr merge exited non-zero during an admin-merge cycle. The ruleset
      was still restored (so branch protection is intact), but the PR was not
      merged. Operator must investigate the merge failure and retry.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, pr, ruleset_id, merge_exit]

  - kind: admin_merge_cycle_restore_failed
    effect_metric: self
    emitter: scripts/ops/admin-merge-cycle.sh (INFRA-2041 + RESILIENT-031)
    trigger: >
      CRITICAL: the ruleset PUT to restore required_status_checks failed after
      the merge step. Branch protection is now in a degraded state (rules
      dropped). Operator must manually restore using the snapshot file logged
      in the event. Exit code 2 from the script signals this condition.
    consumers: [ops-audit, fleet-brief, operator-recall]
    fields_required: [ts, kind, pr, ruleset_id, restore_json, severity]

  # INFRA-2071: admin-merge burst circuit-breaker
  - kind: admin_merge_cycle_run
    effect_metric: self
    emitter: scripts/ops/admin-merge-cycle.sh (INFRA-2071)
    trigger: >
      Emitted once per successful admin-merge cycle immediately before
      admin_merge_cycle_ok. This is the counter event the burst circuit-breaker
      counts: when CHUMP_ADMIN_MERGE_BURST_THRESHOLD or more of these appear
      within CHUMP_ADMIN_MERGE_BURST_WINDOW_S seconds, the next invocation
      trips the circuit-breaker and emits admin_merge_burst instead of
      proceeding. Fields capture the PR, the justification (noise-class id or
      force-admin reason), and the operator session id for retrospectives.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, pr, reason, operator_session_id]

  - kind: admin_merge_burst
    effect_metric: self
    emitter: scripts/ops/admin-merge-cycle.sh (INFRA-2071)
    trigger: >
      Circuit-breaker tripped: admin_merge_cycle_run count in the past
      CHUMP_ADMIN_MERGE_BURST_WINDOW_S seconds reached or exceeded
      CHUMP_ADMIN_MERGE_BURST_THRESHOLD. The script exits non-zero (exit 3)
      and refuses to proceed. Operator must triage the root cause of the
      repeated admin-merge need OR re-run with --force-admin / CHUMP_ADMIN_MERGE_FORCE=1
      to override (which emits admin_merge_burst_overridden instead).
      operator_action_needed=true signals operator-recall consumers.
    consumers: [ops-audit, fleet-brief, operator-recall]
    fields_required: [ts, kind, count, window_s, threshold, operator_action_needed]

  - kind: admin_merge_burst_overridden
    effect_metric: self
    emitter: scripts/ops/admin-merge-cycle.sh (INFRA-2071)
    trigger: >
      Operator explicitly overrode the burst circuit-breaker via --force-admin
      or CHUMP_ADMIN_MERGE_FORCE=1 after it tripped (admin_merge_burst was
      emitted first). The merge proceeds but this separate kind is logged so
      the override pattern is visible in retrospectives and can be audited
      independently from the burst itself. override_method distinguishes the
      two override paths.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, pr, count, window_s, threshold, override_method]

