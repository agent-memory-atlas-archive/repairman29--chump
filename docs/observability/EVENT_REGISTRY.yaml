    consumers: [ops-audit, fleet-brief, wizard-daemon-dedup-check]
    fields_required: [ts, kind, source, step, target, decision, rate_limit_state]

  - kind: wizard_daemon_paused
    effect_metric: resilient
    emitter: scripts/coord/wizard-daemon.sh (META-109)
    trigger: >
      Emitted at daemon startup when the CHUMP_WIZARD_DAEMON_PAUSE=1
      kill-switch is active. Operator kill-switch confirmation signal —
      confirms the daemon saw the pause flag and did nothing this cycle.
