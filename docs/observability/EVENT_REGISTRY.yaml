      work — but emits this event so operators can audit parallelism patterns
      and detect orphaned or unclaimed leases.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, branch, available_claim_files, available_gap_ids]
    # payload: {branch: str (current branch lowercased),
    #           available_claim_files: int (count of claim-*.json found),
    #           available_gap_ids: str (comma-separated gap_ids from all claim files)}

  - kind: wizard_classify_deferred
    effect_metric: resilient
    emitter: scripts/coord/wizard-daemon.sh step1 (INFRA-2042)
    trigger: >
      Emitted when wizard-daemon step1 encounters a PR whose mergeStateStatus is
