    effect_metric: resilient
    emitter: scripts/git-hooks/pre-commit (RESILIENT-025)
    trigger: >
      Emitted when a commit bypasses the off-rails gap-ID check via an
      'Off-Rails-Bypass: <reason>' trailer. The check normally blocks commits
