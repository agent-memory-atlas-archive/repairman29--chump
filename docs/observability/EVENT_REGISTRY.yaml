  - kind: gap_claim_nats_conflict
    effect_metric: self
    emitter: src/atomic_claim.rs nats_dual_write (INFRA-986)
    trigger: NATS KV CAS claim returned CONFLICT — another session on the
      fleet (possibly cross-machine) holds the atomic claim on this gap
    consumers: [fleet-brief, audit-log, watchdog]
    fields_required: [ts, kind, gap_id, session_id]

  # ── INFRA-2398/INFRA-2428: main-health-gate events ───────────────────────────
  - kind: claim_main_health_stale
    effect_metric: resilient
    emitter: src/atomic_claim.rs emit_main_health_event (INFRA-2398)
    trigger: >
      Emitted when `chump claim` detects that the main-preflight-watchdog state
      file (.chump/main-preflight-state.json) is older than 30 minutes
      (STALE_THRESHOLD_SECS=1800). Indicates the watchdog daemon may be down.
      Claim proceeds with a stderr warning. age_secs reflects how old the state
      file is at the moment of the claim attempt.
    consumers: [fleet-brief, audit-log, watchdog]
    fields_required: [ts, kind, gap_id, status, failing_gates, age_secs, trunk_fix_gap_id]
    expected_volume: "rare — only when watchdog daemon is stopped or crashed"
    status: stable
    # payload: {gap_id: str, status: str, failing_gates: [str], age_secs: int, trunk_fix_gap_id: str}

  - kind: claim_main_health_missing
    effect_metric: resilient
    emitter: src/atomic_claim.rs emit_main_health_event (INFRA-2398)
    trigger: >
      Emitted (debug-level, once per claim) when `chump claim` cannot find
      .chump/main-preflight-state.json. This is expected on fresh installs or
      when the watchdog daemon (INFRA-2397) has not been installed yet. Claim
      proceeds without blocking.
    consumers: [fleet-brief, audit-log]
    fields_required: [ts, kind, gap_id, status, failing_gates, age_secs, trunk_fix_gap_id]
    expected_volume: "once per claim on fleets without the watchdog installed"
    status: stable
    # payload: {gap_id: str, status: "" (empty), failing_gates: [], age_secs: 0, trunk_fix_gap_id: ""}

  - kind: claim_main_health_bypass
    effect_metric: resilient
    emitter: deleted (INFRA-2428)
    deprecated: true
    trigger: >
      DEPRECATED (INFRA-2428): CHUMP_CLAIM_IGNORE_MAIN_HEALTH env var and this
      event kind have been deleted. The gate now redirects to the trunk-fix gap
      instead of allowing bypass. Historical records may contain this kind.
      Replaced by claim_main_health_redirect.
    consumers: [fleet-brief, audit-log]
    fields_required: [ts, kind, gap_id, status, failing_gates, age_secs]
    expected_volume: "zero (deleted)"
    status: deprecated

  - kind: claim_main_health_redirect
    effect_metric: resilient
    emitter: src/atomic_claim.rs emit_main_health_event (INFRA-2428)
    trigger: >
      Emitted when `chump claim` is blocked because main is RED and the claimer
      is routed to the trunk-fix gap filed by the watchdog daemon. Replaces the
      deleted claim_main_health_bypass kind (INFRA-2428 zero-bypass).
      failing_gates contains the gates that are red; trunk_fix_gap_id is the
      most recent gap auto-filed by the preflight watchdog for this red window.
      Setting CHUMP_CLAIM_IGNORE_MAIN_HEALTH has no effect — the gate always
      redirects (bypass env var deleted).
    consumers: [fleet-brief, audit-log, waste-tally]
    fields_required: [ts, kind, gap_id, status, failing_gates, age_secs, trunk_fix_gap_id]
    expected_volume: "once per claim attempt during a red-main window"
    status: stable
    # payload: {gap_id: str, status: "red", failing_gates: [str], age_secs: int, trunk_fix_gap_id: str}

  - kind: claim_main_health_garbled
    effect_metric: resilient
    emitter: src/atomic_claim.rs emit_main_health_event (INFRA-2524)
    trigger: >
      Emitted when `chump claim` sees main RED but ALL failing-gate names are
      garbled (empty, punctuation-only, or a stray em-dash — the 2026-06-03
      watchdog parser bug, INFRA-2458). The claim proceeds (fail-OPEN) rather
      than halting the whole fleet on an untrustworthy signal (A2A_ROADMAP
      principle 7 fail-open-over-deadlock). A real gate name matches
      [A-Za-z][A-Za-z0-9_.-]*; if none match, the RED is treated as noise.
    consumers: [fleet-brief, audit-log, waste-tally]
    fields_required: [ts, kind, gap_id, status, failing_gates, age_secs]
    expected_volume: "rare — only when the watchdog emits a malformed RED"
    status: stable
    # payload: {gap_id: str, status: "red", failing_gates: [str], age_secs: int}

