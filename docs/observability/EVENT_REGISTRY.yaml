  - kind: pr_stuck_chronic
    effect_metric: self
    emitter: scripts/coord/pr-stuck-cluster-detector.sh (INFRA-3352)
    trigger: 1-2 stuck PRs in window (below cluster threshold), one aged >= CHUMP_PR_CHRONIC_STUCK_S
    consumers: [waste-tally, fleet-brief, watchdog]
    fields_required: [ts, kind, pr, age_s, gap, origin_gap]
    docs: "Chronic-PR escalation sibling of pr_stuck_cluster — files an
      individual P1 gap per chronically-stuck PR instead of waiting for a
      3-PR cluster that may never materialize. See
      scripts/coord/pr-stuck-cluster-detector.sh header comment.
      INFRA-3395 (\"pr-stuck-cluster — 1 PRs blocked >2h as of 2026-07-21\"),
      INFRA-3402 (\"pr-stuck-cluster — 1 PRs blocked >2h as of
      2026-07-22\"), and INFRA-3414 (\"pr-stuck-cluster — 1 PRs blocked >2h
      as of 2026-07-23\") are detector-filed placeholder gaps against the
      exact incident shape this event now covers (a single chronically-stuck
      PR below cluster threshold) — already answered by the INFRA-3352
      escalation path above and its regression coverage in
      scripts/ci/test-pr-stuck-cluster-detection.sh
      (test_chronic_single_pr_escalates / test_chronic_single_pr_too_young).
      INFRA-3419 (\"pr-stuck-cluster — 3 PRs blocked >2h as of 2026-07-24\")
      is the sibling detector-filed placeholder for the at-threshold cluster
      shape (3+ stuck PRs, not the sub-threshold chronic case above) —
      already answered by the pr_stuck_cluster event earlier in this file
      (INFRA-848/INFRA-950) and its full lifecycle documentation in
      docs/observability/PR_STUCK_CLUSTER_OBSERVABILITY.md (INFRA-1749);
      test_cluster_detected_run_event in
      scripts/ci/test-pr-stuck-cluster-observability.sh exercises the
      3-stuck-PR cluster-detected path directly."

  # INFRA-2754: run-level observability for the detector itself — fires on
  # every invocation (no-op, cluster-filed, or error) so mutation cost
  # (gap_reserve_calls) is visible without grepping logs. INFRA-2906 added
  # failure_class (none|transient|permanent) to the same event.
  - kind: pr_stuck_cluster_detector_run
    effect_metric: self
    emitter: scripts/coord/pr-stuck-cluster-detector.sh (INFRA-2754, INFRA-2906)
    trigger: every invocation of pr-stuck-cluster-detector.sh, any exit path
    consumers: [waste-tally, watchdog]
    fields_required: [ts, kind, outcome, stuck_pr_count, duration_ms, gap_reserve_calls, failure_class]
    docs: |
      INFRA-3117 answers (this event was the "TODO" placeholder gap; answers
      already existed in code/comments, this just makes them registry-visible):
        - emitted on: every exit path via `trap ... EXIT` in the detector
          script (success, no-op, dry-run, bad-args, and error) — see
          outcome field values: no_op | dry_run | cluster_filed | help |
          gap_id_extract_failed | gap_reserve_failed | bad_args | error.
        - cost tracked via: gap_reserve_calls field (count of gap-reserve
          mutations this run performed); operator reads it off ambient.jsonl
          without grepping logs. INFRA-2804 clarifies how the two rollups
          use it: `chump waste-tally` has no per-kind cost entry for
          `pr_stuck_cluster_detector_run` in
          crates/chump-waste-tally/src/waste_tally.rs::default_tokens_per_kind
          (falls through to the 0 default), so this event's *own* row costs
          nothing in the ledger — its job is a free run-level audit trail,
          not a billed signal. The billed signal is the sibling
          `pr_stuck_cluster` kind (5,000 tokens/incident,
          default_tokens_per_kind), which waste-tally sums into its report
          and fleet-brief surfaces to the operator. Read gap_reserve_calls
          directly off ambient.jsonl (`grep pr_stuck_cluster_detector_run`)
          when auditing detector mutation cost specifically; it is not
          folded into the waste-tally dollar total.
        - failure_class taxonomy: none (no_op/dry_run/cluster_filed/help,
          not a failure) | transient (gap_id_extract_failed/error, retry may
          succeed as-is) | permanent (gap_reserve_failed/bad_args, retry
          repeats until root cause fixed). Defined in
          scripts/coord/pr-stuck-cluster-detector.sh:_pscd_failure_class.
        - smoke test: scripts/ci/test-pr-stuck-cluster-observability.sh
          (runnable standalone; covers no_op/dry_run/bad_args outcome paths
          and asserts failure_class on each; wired into `chump preflight`
          per INFRA-2925).
        - INFRA-2877 is the same duplicate-placeholder shape as
          INFRA-3395/3402/3414/3419 above (a detector-filed "1 PR blocked
          >2h" gap re-asking for the same 4 acceptance criteria already
          answered by INFRA-3117): run-level events on every exit path,
          gap_reserve_calls cost tracking, failure_class taxonomy, and the
          existing smoke test. No new work required beyond this
          cross-reference.
        - INFRA-2470 is the same duplicate-placeholder shape, filed earlier
          (2026-06-03, "2 PRs blocked >2h") for the identical 4 acceptance
          criteria (run event on every outcome, gap_reserve_calls cost,
          failure_class taxonomy, smoke test) already answered above.

