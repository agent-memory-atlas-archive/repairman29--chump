    effect_metric: waste_prevented
    emitter: src/atomic_claim.rs emit_claim_open_pr_dup_blocked (INFRA-1982)
    trigger: chump claim refused because an open PR already covers this gap — either
      the PR title contains the gap ID (case-insensitive) or the head branch starts
      with chump/<gap-id-lowercase>. This catches the duplicate-WORK failure mode
      (two agents file different gap IDs for the same problem, both claim+push).
      Complement to claim_duplicate_gap_blocked (INFRA-1970) which catches same gap ID.
      Override: CHUMP_CLAIM_ALLOW_DUPLICATE_PR=1 or --allow-duplicate-pr.
    consumers: [fleet-brief, waste-tally, audit-log]
    fields_required: [ts, kind, gap, open_pr]

