    consumers: [fleet-brief, waste-tally, audit-log]
    fields_required: [ts, kind, gap_id, this_session, detail]

  - kind: claim_duplicate_gap_bypassed
    effect_metric: waste_risk
    emitter: src/atomic_claim.rs emit_claim_duplicate_gap_event (INFRA-1970)
    trigger: operator used CHUMP_CLAIM_ALLOW_DUPLICATE_GAP=1 to proceed with a
      claim despite another live session already holding the same gap_id.
      Emitted for audit so the operator can correlate duplicate PRs back to the
