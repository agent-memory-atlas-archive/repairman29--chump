    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, source, gap_id, pid]

  - kind: wizard_dispatch_rate_limited
    effect_metric: resilient
    emitter: scripts/coord/wizard-daemon.sh step4 (META-107)
    trigger: >
