# EVENT_REGISTRY.yaml — INFRA-754
#
# **GROUND-TRUTH CONTRACT** (INFRA-1237). This file is the contract that
# fleet-brief, waste-tally, kpi-report, watchdogs, and every other ambient
# consumer reads to know which `kind=X` values to expect from
# `.chump-locks/ambient.jsonl`. Drift in either direction silently degrades
# operator trust:
#   - emit-without-register → consumers see kinds they don't understand and
#     drop them; SLO dashboards under-report
#   - register-without-emit → consumers wait for kinds that never fire;
#     dashboards display empty rows the operator can't interpret
#
# Enforcement (post-INFRA-1237):
#   - scripts/ci/test-event-registry-coverage.sh runs on every PR in
#     fast-checks. Default mode (strict-emit) fails the build on
#     emit-without-register. Set CHUMP_REGISTRY_GATE_MODE=strict to also
#     fail on register-without-emit (after the orphan-reconciliation
#     follow-up gap lands).
#   - scripts/git-hooks/pre-commit-event-registry.sh blocks staged diffs
#     that add a kind literal without a corresponding registry entry.
#   - scripts/ci/event-registry-reserved.txt allow-lists kinds that are
#     legitimately exempt from both directions (with a required `# reason:`
#     comment per entry).
#
# Why: "observability before scale" needs mechanical enforcement. Without
# this registry, every contributor adds events with their own conventions
# and consumers silently fail on the unknown shapes.
#
# ── SCHEMA FIELD CANONICAL: 'kind' (INFRA-1159) ─────────────────────────────
# Two fields coexist in the ambient stream:
#   event: (legacy)  — written by scripts/dev/ambient-emit.sh before INFRA-1159.
#                       Still present (dual-write bridge) for backward compat.
#   kind:  (canonical) — the discriminator field this registry describes.
#                       Prefer 'kind' in ALL consumers and new emitters.
#
# Migration timeline: dual-write (event + kind) until INFRA-1159 consumers are
# fully migrated; remove 'event' field in a follow-up gap when all .event
# selectors are confirmed gone from scripts/ and src/.
# ─────────────────────────────────────────────────────────────────────────────
#
# Adding a new event:
#   1. Add an entry below with: kind, emitter, consumers, trigger, fields_required
#   2. Update the consumer code to parse the event
#   3. Stage your changes; pre-commit guard verifies the entry exists
#
# ── UNIVERSAL FIELDS (EFFECTIVE-028) ─────────────────────────────────────────
# The following fields are available on EVERY event emitted by broadcast.sh,
# regardless of kind. Consumers may rely on them being present.
#
#   corr_id        — correlation ID linking request/response pairs (INFRA-1255).
#                    Auto-derived from: gap-id > branch name > timestamp.
#                    Override with --corr <id> or CHUMP_CORR_ID env var.
#                    The deliberator (deliberator-loop.sh) tallies FEEDBACK/
#                    preference votes keyed by this field.
#
#   parent_corr_id — (optional) set when --reply-to <parent-corr-id> is used
#                    to thread a reply under a specific prior broadcast.
#                    When present, corr_id=parent_corr_id so the vote/reply
#                    lands in the correct deliberator tally bucket.
#                    Absent on events not using --reply-to (default path).
#
# ─────────────────────────────────────────────────────────────────────────────
#
# Schema:
#   kind:                (required) the literal string emitted in `"kind":"..."` JSON
#   emitter:             (required) source file or component that emits it
#   trigger:             (required) one-line description of when it fires
#   effect_metric:       (required since INFRA-1371) name of the metric that proves
#                          this event is doing its job. Use "self" when the emission
#                          count itself is the metric (most observability events).
#   consumers:           (recommended) list of downstream consumers
#   fields_required:     (recommended) list of fields the consumer expects
#   expected_min_per_day:(optional) int — if set, drift gate flags the kind as
#                          silent when fewer than this many events appear in 24h
#   docs:                (optional) link to a longer explanation
#   status:              (optional) "stable" / "deprecated" — default stable
#
# Bypass: CHUMP_EVENT_REGISTRY_CHECK=0 in commit env (with reason in
# commit body trailer "Event-Registry-Bypass: <text>"). Same discipline
# as --no-verify; sparingly.

schema_version: 2
last_audit: "2026-05-15"

events:

  # ── Fleet lifecycle ────────────────────────────────────────────────────────
  - kind: session_start
    effect_metric: self
    emitter: scripts/dev/ambient-emit.sh + claude SessionStart hook + rpc::register_worker_rpc_handlers
    trigger: any chump session begins (fleet worker, operator, reaper)
    consumers: [fleet-brief, ambient-context-inject]

  - kind: urgent_inbox_session_start_poll_active
    effect_metric: self
    emitter: scripts/setup/session-start-urgent-inbox-poll.sh (INFRA-4987, claude SessionStart hook)
    trigger: any Claude session begins; confirms the URGENT-INBOX polling hook registered and ran, independent of whether unread messages were found
    consumers: [ambient.jsonl audit trail]

  - kind: collision_prediction
    effect_metric: self
    emitter: src/collision_prediction.rs (META-076, first implementation of docs/design/COLLISION_PREDICTION_SCHEMA.md)
    trigger: mock agent trajectory (position/velocity) projection finds an overlap within the lookahead window at or above the configurable confidence_threshold
    consumers: [dashboard (future, INFRA-1883)]
    fields_required: [ts, kind, agent_a, agent_b, predicted_ts_offset_s, confidence]

  - kind: routing_decision
    effect_metric: self
    emitter: src/skill_routing.rs (META-078, first implementation of docs/design/SKILL_AWARE_ROUTING_SCHEMA.md)
    trigger: the skill-aware routing engine scores candidate agents against a gap's required_skills (Jaccard) and selects a winner, or falls back to round-robin when skills data is unavailable
    consumers: [picker (future, META-081 integration slice)]
    fields_required: [ts, kind, schema_version, gap_id, task_type, required_skills, candidates, selected_session, selection_reason, session]

  - kind: skill_routing_no_match
    effect_metric: self
    emitter: src/skill_routing.rs (META-078, companion event per docs/design/SKILL_AWARE_ROUTING_SCHEMA.md)
    trigger: required_skills is non-empty but no candidate shares any skill with it — selected_session is null and the gap stays in queue
    consumers: [operator visibility]
    fields_required: [ts, kind, gap_id, required_skills, available_skill_sets, session]

  - kind: review_verdict
    effect_metric: self
    emitter: scripts/coord/code-reviewer-agent.sh (CREDIBLE-191 judgment panel)
    trigger: the pre-ship code-reviewer finishes a review — one event per PR review, carrying the final letter verdict plus each multi-lens outcome (spirit/correctness/harmony)
    consumers: [learning-loop (future — which lens catches what over time), observability]
    fields_required: [ts, kind, verdict, spirit, correctness, harmony]
  - kind: over_claim_suspected
    effect_metric: self
    emitter: src/done_auditor.rs (INFRA-3495 anti-over-claim watchdog)
    trigger: `chump gap audit-done` finds a DONE gap whose closed PR left acceptance bullets uncovered + unwaived (umbrella-done != actually-done) — pr_ac_coverage re-run after the fact
    consumers: [gap-registry-health (future), observability]
    fields_required: [ts, kind, gap_id, closed_pr, uncovered_bullets, total_bullets]
  - kind: audit_done_sweep_completed
    effect_metric: self
    emitter: scripts/coord/audit-done-sweep.sh (CREDIBLE-1369, CREDIBLE-279 slice)
    trigger: "the scheduled (launchd/CI) audit-done sweep finishes a run — one event per invocation, so a clean (0-flagged) run is still visible in ambient.jsonl rather than looking identical to 'never ran'"
    consumers: [operator visibility, gap-registry-health (future)]
    fields_required: [ts, kind, audited, flagged, skipped_no_pr, skipped_no_ac, fetch_errors]
  - kind: ci_lesson_captured
    effect_metric: self
    emitter: src/ci_lesson.rs (INFRA-1765 cross-agent CI-failure lesson propagation)
    trigger: "`chump ci-lesson capture` successfully classifies a CI failure and persists it as a Reflection in memory_db"
    consumers: [briefing (reflection_db::load_ci_lessons), observability]
    fields_required: [ts, kind, check, pr_ref, class, reflection_id, cost_usd]

  - kind: ci_lesson_capture_failed
    effect_metric: self
    emitter: src/ci_lesson.rs (INFRA-1765 cross-agent CI-failure lesson propagation)
    trigger: "`chump ci-lesson capture` fails to persist the reflection (memory_db write error)"
    consumers: [observability]
    fields_required: [ts, kind, check, pr_ref, reason, cost_usd]

  - kind: ci_lesson_capture_timeout
    effect_metric: self
    emitter: scripts/coord/ci-lesson-propagation.sh (INFRA-1765; wraps `chump ci-lesson capture` in `timeout`)
    trigger: the `chump ci-lesson capture` process itself wedges past CAPTURE_TIMEOUT_SECS and is killed by `timeout`
    consumers: [observability]
    fields_required: [ts, kind, check, pr_ref, timeout_secs, cost_usd]

  - kind: heartbeat
    effect_metric: self
    emitter: crates/chump-coord/src/rpc.rs
    trigger: periodic worker liveness signal
    consumers: [fleet-brief, kpi-report]

  - kind: farmer_drain_guard
    effect_metric: self
    emitter: scripts/dev/farmer-drain-guard.sh (via farmer-brown tick, RESILIENT-076)
    trigger: drain-guard action — ruleset strict-policy reconcile/drift or drain-daemon reload; status field carries reconciled/drift_paused/reconcile_failed/daemon_reloaded/daemon_down_paused; never emitted on the in-sync path
    consumers: [fleet-brief, observability]

  - kind: session_end
    effect_metric: self
    emitter: claude Stop hook + worker.sh cycle_end
    trigger: session terminates (clean or timeout)
    consumers: [fleet-brief, kpi-report, waste-tally]
    fields_required: [ts, session_id, outcome, input_tokens, output_tokens]

  - kind: cycle_end
    effect_metric: self
    emitter: scripts/dispatch/worker.sh
    trigger: fleet worker finishes a cycle (claim+ship or empty pick)
    consumers: [fleet-brief]
    fields_required: [agent_id, gap_id, elapsed_s, rc, cycle_kind]

  - kind: fleet_starved
    effect_metric: fleet_auto_widen_applied_within_5min
    emitter: scripts/dispatch/worker.sh
    trigger: N consecutive empty picks (CHUMP_STARVE_THRESHOLD)
    consumers: [fleet-brief, watchdog]

  - kind: fleet_auto_widen_applied
    effect_metric: self
    emitter: src/main.rs (INFRA-615, chump fleet auto-widen --apply)
    trigger: operator runs auto-widen with --apply after starvation detected
    consumers: [fleet-brief, waste_tally]
    fields_required: [starve_count, effort, priority_filter]

  - kind: pi_runner_installed
    effect_metric: self
    emitter: scripts/setup/install-self-hosted-runner-pi.sh (INFRA-1543)
    trigger: a Pi mesh self-hosted GitHub Actions runner finishes registering with the repo
    consumers: [fleet-brief, observability]
    fields_required: [name, labels]

  - kind: fleet_wedge
    effect_metric: self
    emitter: scripts/dispatch/worker.sh
    trigger: claude -p produced 0 stdout for full timeout window
    consumers: [waste-tally, watchdog]

  - kind: fleet_concurrency_capped
    effect_metric: self
    emitter: scripts/dispatch/run-fleet.sh
    trigger: FLEET_SIZE * CARGO_BUILD_JOBS exceeded nproc at launch; FLEET_SIZE and/or CARGO_BUILD_JOBS auto-trimmed to fit (INFRA-3659)
    consumers: [waste-tally, fleet-brief]

  - kind: fleet_recovery_choir_kicked
    effect_metric: self
    emitter: scripts/coord/ci-health-gate.sh
    trigger: fleet-paused sentinel auto-lifted after slo-check passed; supervisor/reaper choir kicked (RESILIENT-066)
    consumers: [watchdog, fleet-brief]

  - kind: fleet_health
    effect_metric: self
    emitter: launchd / scripts/ops/fleet-health.sh
    trigger: periodic fleet metrics summary
    consumers: [fleet-brief]

  # ── Circuit breaker (RESILIENT-011) ───────────────────────────────────────────
  - kind: circuit_breaker_opened
    effect_metric: self
    emitter: src/circuit_breaker.rs (RESILIENT-011)
    trigger: circuit breaker for a target transitions from Closed to Open (error threshold exceeded)
    consumers: [fleet_health, operator_dashboard]
    fields_required: [ts, kind, target, reason]
    docs: |
      Emitted when a target reaches its error_threshold consecutive failures.
      The circuit breaker will now fail fast (reject calls) for this target.

  - kind: circuit_breaker_state_change
    effect_metric: self
    emitter: src/circuit_breaker.rs (RESILIENT-011)
    trigger: circuit breaker for a target changes state (any transition)
    consumers: [fleet_health, operator_dashboard]
    fields_required: [ts, kind, target, from_state, to_state, reason]
    docs: |
      General-purpose state change event emitted on any circuit breaker transition.
      Includes the target, previous state, new state, and reason for the change.

  # ── Supervision trees — RESILIENT-058 (A2A L6a) ──────────────────────────────
  # Per-gap and fleet-aggregate restart-intensity escalation, mirroring
  # Erlang/OTP supervision-tree semantics. Motivating incident: 2026-06-03
  # 12-zombie audit-run wedge (25+ min, required manual operator cancel).
  # See: docs/design/A2A_MASTER_PLAN_2026-06-03.md §1.L6, §M2

  - kind: gap_supervisor_escalated
    effect_metric: self
    emitter: scripts/coord/gap-supervisor.sh
    trigger: >
      Per-gap restart count exceeds CHUMP_GAP_SUPERVISOR_MAX_RESTARTS (default 3)
      within CHUMP_GAP_SUPERVISOR_WINDOW_S (default 300s). Gap status set to blocked.
    consumers: [ops-audit, fleet-brief, fleet-supervisor]
    fields_required: [ts, kind, gap_id, restart_count, window_s, reason]
    expected_min_per_day: 0
    status: stable
    docs: |
      Per-gap restart-storm escalation. The fleet supervisor reads this event
      to aggregate cross-gap escalations and trigger fleet-level pause when
      CHUMP_FLEET_SUPERVISOR_MAX_ESCALATIONS is exceeded.
      Scanner-anchor: "kind":"gap_supervisor_escalated"

  - kind: gap_discipline_routed
    effect_metric: self
    emitter: src/main.rs
    trigger: >
      `chump gap route <ID>` classifies a stuck gap by effort-size × strikes and
      recommends the recovery discipline (retry | escalate-model | decompose |
      flag-human), per INFRA-3448.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, gap_id, effort, strikes, discipline]
    expected_min_per_day: 0
    status: stable
    docs: |
      The discipline router (INFRA-3448) replaces EFFECTIVE-310's blanket
      "any strike → decompose" and EFFECTIVE-314's blanket model-escalation
      with an effort-aware decision: small/conceptual gaps escalate the model,
      large gaps decompose, and either flags a human once its remedy is
      exhausted. INFRA-3449 wires worker.sh / gap-strike to ACT on this.
      Scanner-anchor: "kind":"gap_discipline_routed"

  - kind: gap_supervisor_heartbeat
    effect_metric: self
    emitter: scripts/coord/gap-supervisor.sh
    trigger: >
      Emitted on every gap-supervisor.sh tick (record or daemon tick command).
      Confirms the per-gap supervisor is alive and processing.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, source]
    expected_min_per_day: 1440
    status: stable
    docs: |
      Liveness signal for com.chump.gap-supervisor launchd daemon (RESILIENT-058).
      Absence for >2 tick intervals (>120s) indicates daemon failure.
      Scanner-anchor: "kind":"gap_supervisor_heartbeat"

  - kind: fleet_supervisor_pickup_paused
    effect_metric: self
    emitter: scripts/coord/fleet-supervisor.sh
    trigger: >
      Fleet-aggregate escalation count exceeds CHUMP_FLEET_SUPERVISOR_MAX_ESCALATIONS
      (default 2) within CHUMP_FLEET_SUPERVISOR_WINDOW_S (default 600s).
      Creates .chump-locks/.fleet-pickup-paused sentinel; new gap claims blocked.
    consumers: [ops-audit, fleet-brief, operator-recall]
    fields_required: [ts, kind, escalation_count, window_s, gap_ids, sentinel_file]
    expected_min_per_day: 0
    status: stable
    docs: |
      Fleet-level pickup pause triggered by cross-gap retry-storm. The sentinel
      file .chump-locks/.fleet-pickup-paused must be removed (via resume-attempt
      after fleet-doctor-strict passes) before new claims are allowed.
      Scanner-anchor: "kind":"fleet_supervisor_pickup_paused"

  - kind: fleet_pickup_resumed
    effect_metric: self
    emitter: scripts/coord/fleet-supervisor.sh
    trigger: >
      Recovery attempt succeeds: fleet-doctor-strict.sh exits 0.
      Sentinel .chump-locks/.fleet-pickup-paused is removed.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, recovery_method, source]
    expected_min_per_day: 0
    status: stable
    docs: |
      Confirms fleet pickup has resumed after a supervised pause.
      Paired with fleet_supervisor_pickup_paused. Absence after a pause event
      indicates the fleet is still blocked — check fleet-doctor-strict output.
      Scanner-anchor: "kind":"fleet_pickup_resumed"

  - kind: fleet_doctor_strict_failed
    effect_metric: self
    emitter: scripts/coord/fleet-supervisor.sh
    trigger: >
      Recovery attempt via fleet-doctor-strict.sh returned non-zero.
      Sentinel remains in place; fleet pickup stays paused.
    consumers: [ops-audit, fleet-brief, operator-recall]
    fields_required: [ts, kind, failing_checks, doctor_rc, sentinel_kept, source]
    expected_min_per_day: 0
    status: stable
    docs: |
      Fleet-doctor-strict.sh failed during a supervisor recovery attempt.
      The fleet remains paused. Operator must fix the health invariants listed
      in failing_checks before pickup can resume.
      Scanner-anchor: "kind":"fleet_doctor_strict_failed"

  - kind: fleet_supervisor_heartbeat
    effect_metric: self
    emitter: scripts/coord/fleet-supervisor.sh
    trigger: >
      Emitted on every fleet-supervisor.sh tick (every 300s from launchd).
      Confirms the fleet-aggregate supervisor is alive.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, paused, window_s, max_escalations, source]
    expected_min_per_day: 288
    status: stable
    docs: |
      Liveness signal for com.chump.fleet-supervisor launchd daemon (RESILIENT-058).
      Absence for >2 tick intervals (>600s) indicates daemon failure.
      Scanner-anchor: "kind":"fleet_supervisor_heartbeat"

  # ── Dispatch guardrail — RESILIENT-060 (A2A L6c) ─────────────────────────────
  # Pre-write validation that BLOCKS Sonnet dispatch before any file is written.
  # Invariants checked: lease path coverage, gap-id/branch alignment, cargo fmt.
  # Motivating incident: 2026-06-03 three "writes outside lease" Sonnet drops.
  # See: docs/design/A2A_MASTER_PLAN_2026-06-03.md §1.L6c

  - kind: agent_dispatch_guardrail_passed
    effect_metric: self
    emitter: scripts/coord/agent-dispatch-guardrail.sh
    trigger: >
      All three pre-dispatch invariants passed: (1) every proposed write path is
      in claim.paths, (2) current branch matches lease gap_id, (3) cargo fmt
      --check passes (when *.rs paths are included). Orchestrator may proceed
      with Agent tool dispatch.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, gap_id, branch, attempted_paths, leased_paths, reason]
    expected_min_per_day: 0
    status: stable
    docs: |
      Emitted by scripts/coord/agent-dispatch-guardrail.sh before the orchestrator
      invokes the Agent tool. Absence of this event (when a dispatch was made)
      indicates the guardrail was bypassed — check for CHUMP_OFF_RAILS_CHECK=0.
      Scanner-anchor: "kind":"agent_dispatch_guardrail_passed"

  - kind: agent_dispatch_guardrail_blocked
    effect_metric: self
    emitter: scripts/coord/agent-dispatch-guardrail.sh
    trigger: >
      One or more pre-dispatch invariants failed: out-of-lease path, branch/gap-id
      mismatch, missing lease, or cargo fmt --check failure. The orchestrator must
      NOT invoke the Agent tool. The reason field identifies the specific violation.
    consumers: [ops-audit, fleet-brief]
    fields_required: [ts, kind, gap_id, branch, attempted_paths, leased_paths, reason]
    expected_min_per_day: 0
    status: stable
    docs: |
      Emitted when scripts/coord/agent-dispatch-guardrail.sh exits 1 (BLOCKED).
      The ops-audit consumer uses this to detect scope-creep patterns across
      dispatches. A cluster of these events from the same gap_id indicates the
      lease paths need expansion (re-claim with --paths) or the agent brief needs
      tighter scope definition.
      Scanner-anchor: "kind":"agent_dispatch_guardrail_blocked"

  - kind: fleet_snapshot
    effect_metric: self
    emitter: scripts/ops/fleet-snapshot.sh
    trigger: scheduled fleet state capture
    consumers: [chump fleet status]

  - kind: fleet_queue_depth
    effect_metric: self
    emitter: picker / fleet status
    trigger: queue depth metric capture
    consumers: [fleet-brief]

  - kind: fleet_restore
    effect_metric: self
    emitter: scripts/dispatch/run-fleet.sh
    trigger: fleet restart event
    consumers: [audit-log]

  - kind: fleet_scale_request
    effect_metric: self
    emitter: operator or auto-scaler
    trigger: request to change fleet size
    consumers: [audit-log]

  - kind: fleet_version_skew
    effect_metric: self
    emitter: scripts/ops/fleet-version-check.sh
    trigger: workers running different chump binary versions
    consumers: [watchdog]

  - kind: fleet_pid_invariant
    effect_metric: self
    emitter: scripts/ops/fleet-audit-pids.sh
    trigger: PID/lease consistency check
    consumers: [watchdog]

  - kind: fleet_worker_silent
    effect_metric: self
    emitter: scripts/ops/fleet-worker-watchdog.sh (FLEET-042)
    trigger: worker heartbeat > N min stale
    consumers: [operator-recall]

  - kind: fleet_timeout_checkpoint
    effect_metric: self
    emitter: scripts/dispatch/worker.sh (INFRA-525)
    trigger: T-30s before claude -p timeout, WIP commit pushed
    consumers: [fleet-brief]

  - kind: wip_sigterm_checkpoint
    effect_metric: self
    emitter: scripts/dispatch/worker.sh (_sigterm_wip_checkpoint — INFRA-686)
    trigger: SIGTERM/SIGINT received mid-gap; WIP commit created before exit
    consumers: [fleet-brief, waste-tally]
    fields_required: [ts, kind, agent_id, gap_id, branch]
  # ── FLEET-035: speculative race loss tracking ─────────────────────────────
  - kind: speculative_race_loss
    effect_metric: self
    emitter: scripts/coord/bot-merge.sh (FLEET-035, INFRA-193)
    trigger: a speculative loser PR is closed as superseded — gap was picked by
      two agents in parallel; one won and the other's PR is auto-closed
    consumers: [fleet-status --pane race-loss, waste-tally]
    fields_required: [ts, kind, session, gap_id, loser_pr, winner_pr, loser_branch]

  - kind: worker_exit
    effect_metric: self
    emitter: scripts/dispatch/worker.sh
    trigger: worker exits cycle (rc + classified exit_class)
    consumers: [waste-tally, kpi-report]
    fields_required: [agent_id, gap_id, rc, exit_class]

  # ── INFRA-740: tool-call normalizer ──────────────────────────────────────
  - kind: tool_normalize
    effect_metric: self
    emitter: src/tool_normalize.rs (INFRA-740)
    trigger: tool-call JSON argument was malformed on first parse; normalizer
      repaired it (trailing comma, missing brace, code fence, single quotes)
    consumers: [fleet-brief, waste_tally]
    fields_required: [ts, kind, session, tool, repair]

  - kind: cycle_stall_killed
    effect_metric: self
    emitter: scripts/dispatch/worker.sh (INFRA-705)
    trigger: no new output bytes for CHUMP_STALL_THRESHOLD_S (default 120s) during an active cycle
    consumers: [fleet-brief, waste_tally, watchdog]
    fields_required: [gap_id, agent_id, idle_s]

  - kind: stall_deferred_build
    effect_metric: self
    emitter: scripts/dispatch/worker.sh (RESILIENT-157)
    trigger: stall threshold reached BUT a cargo/rustc/clippy-driver/sccache build is
      an active descendant of the claude -p pid — the cycle is compiling, not stuck, so
      the INFRA-705 stall kill is deferred and the idle clock reset
    consumers: [fleet-brief, waste_tally]
    fields_required: [gap_id, agent_id, idle_s]

  - kind: cycle_reclassified_shipped
    effect_metric: self
    emitter: scripts/dispatch/worker.sh (RESILIENT-1449)
    trigger: a cycle about to be classified failed (non-zero rc, e.g. rc=143 from a
      post-ship merge-poll stall kill) is reclassified shipped because ground truth
      (webhook cache / gap status / gh) shows a PR exists for the cycle's branch
    consumers: [fleet-brief, waste_tally]
    fields_required: [gap_id, agent, rc, evidence]

  - kind: worker_cooldown
    effect_metric: self
    emitter: scripts/dispatch/worker.sh (FLEET-051)
    trigger: single worker failure on a gap; per-worker cooldown written
    consumers: [fleet-brief]
    fields_required: [gap_id, worker_id, until, cooldown_kind]

  - kind: worker_cooldown_cluster_wide
    effect_metric: self
    emitter: scripts/dispatch/worker.sh (FLEET-051)
    trigger: distinct-worker failure count reaches FLEET_COOLDOWN_THRESHOLD (default 3)
    consumers: [fleet-brief, watchdog]
    fields_required: [gap_id, worker_count, until]

  - kind: gap_auto_blocked
    effect_metric: self
    emitter: scripts/dispatch/worker.sh (INFRA-3832)
    trigger: a gap accrued CHUMP_AUTO_BLOCK_THRESHOLD consecutive non-ship cycles
