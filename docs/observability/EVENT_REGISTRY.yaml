  - kind: prepush_timeout
    effect_metric: self
    emitter: scripts/git-hooks/pre-push _pp_run_timed / _pp_check_total_budget (INFRA-5126)
    trigger: a fast pre-push guard (fmt_check, fmt_gate, clippy, merge_tree_preview)
