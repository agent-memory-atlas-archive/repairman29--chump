- id: RESILIENT-1499
  domain: RESILIENT
  title: "RESILIENT: public least-privilege NATS entry (wss via cuphead leaf) so cloud sessions can reach the fleet bus"
  status: open
  priority: P1
  effort: m
  description: |
    Cloud Claude sessions (claude.ai/code) cannot reach the fleet NATS bus (tailnet-only), so every cross-session handoff goes through Jeff copy-pasting. Build a public, least-privilege entry: a small nats-server LEAF on cuphead (docker, ~64 MB cap, outside supabase.slice) dialing the existing cuphead hub on 127.0.0.1:7422, WebSocket on 127.0.0.1:8080 published via Tailscale Funnel (cuphead:8443) instead of Caddy + a Porkbun record (Jeff 2026-09-29). One cloud user, publish chump.events.> minus claim/work surfaces, subscribe chump.events.> + _INBOX.>, no JetStream/KV. user+password (not nkey) because chump-coord only reads CHUMP_NATS_URL. Credential only in the Mac ~/.chump/secrets/cloud-nats.creds (600) and a root-only env file on cuphead. Code: deploy/nats-leaf/.
  acceptance_criteria:
    - From outside the tailnet, wss connect with the cloud credential works and without it is refused
    - A cloud-credential publish of a FEEDBACK/DM event reaches a fleet-side subscriber on the hub through the leaf
    - Publishing to chump.work.test, chump.events.gap_claimed and $KV.test with the cloud credential each fails with a permissions violation
    - Ports 4222, 7422, 8222 on the public IP stay closed
    - cuphead free -m before/after recorded and api.postsub.io auth health still 200
    - Rollback (stop leaf + funnel off) tested once and leaves hub + fleet untouched
  depends_on: [CREDIBLE-1478, RESILIENT-1500, RESILIENT-1501]
  notes: |
    [2026-09-29T14:22:45Z] [2026-09-29] PAUSED before build (first-mate, interactive): the premise does not hold. No Chump fleet NATS bus is live: Mac has no broker; CJ 127.0.0.1:4222 has 0 clients; cuphead tailnet:4222 has 3 clients, all wear-sentinel transcription_server (chump.cloud.> stream CLOUD, no chump.events stream, no KV). Fleet coordination today = state.db + file inboxes + ambient.jsonl per node, so a public leaf would feed a bus nobody reads (proof b impossible). Also: chump-coord connect() creates KV + streams, so a least-privilege cloud user can never use chump-coord itself; cloud sessions would need a plain NATS client. Needs Jeff decision: make the fleet bus live first (cuphead hub + CREDIBLE-236 + nodes on CHUMP_NATS_URL + a NATS->inbox/ambient bridge), or pick a different handoff surface.
    [2026-09-29T15:03:00Z] [2026-09-29] UNPAUSED as step 4 of outcome FLEET-BUS (Jeff chose option 1: make the fleet bus real first). Depends on CREDIBLE-1478 (hub auth + accounts), RESILIENT-1500 (nodes join), RESILIENT-1501 (bus -> inbox/ambient bridge). Leaf = its own nats-server container on cuphead, remote -> hub leafnode listener 127.0.0.1:7422 in the FLEET account; public path = Tailscale Funnel cuphead:8443 -> leaf websocket 127.0.0.1:8080 (Jeff: funnel on cuphead, no Porkbun/Caddy). Cloud user = user+password in CHUMP_NATS_URL (chump-coord only reads the URL); cloud sessions publish CoordEvent JSON with a plain NATS client (chump-coord connect needs JetStream/KV, which this user must never have).
  opened_date: '2026-09-29'
  preferred_machine: cuphead
  outcome_id: FLEET-BUS

