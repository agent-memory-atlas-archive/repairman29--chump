  title: "[postsub][external_repo:repairman29/postsub][gcp-exit] Move PostSub from Firebase (fulcrum-41e50) to Vercel + cuphead Supabase"
  status: open
  priority: P1
  effort: l
  description: |
    postsub.io is a React SPA on Firebase Hosting (build/) with Firestore (~60 files: users, subscriptions, subscribers, posts, email_queue, email_opens, analytics, revenue_analytics…), ~25 files of Cloud Functions (Stripe webhooks, email queue/tracking), Auth, Storage. Rough shape: (a) schema + import, (b) supabase-js swap in src/, (c) functions to Vercel API routes + Vercel cron for the email queue, (d) Storage to Supabase Storage, (e) DNS cutover of postsub.io at Porkbun (currently Firebase A + www CNAME). Target (Jeff 2026-09-26, workspace-docs/GCP_EXIT.md): Vercel for hosting + API routes, and the self-hosted Supabase stack on cuphead (RESILIENT-314) for Postgres (own schema), Auth, Storage. Code talks only to supabase-js / standard Supabase APIs so the app can move to hosted Supabase later by changing URL + keys. Keep Sign in with Google (GoTrue Google provider; OAuth client stays in its GCP project, no billing). Firebase email/password users keep working: import from the PRODUCT-303 auth:export and verify Firebase scrypt hashes on first sign-in, or document why a reset flow was needed. Secrets move from GCP Secret Manager to Vercel env vars.
  acceptance_criteria:
    - Row counts match the export ledger for every collection
    - Stripe checkout + webhook flow passes end-to-end in Stripe test mode against the Vercel deployment
    - Email queue processes on a Vercel cron with no Cloud Function
    - postsub.io DNS points at Vercel and serves the migrated app; firebase deps removed
  depends_on: [RESILIENT-314]
  notes: |
    DISPATCH (Jeff 2026-09-26): P1, queued behind its depends_on. Do not start until every dependency is done: the PRODUCT-303 export ledger must exist in workspace-docs/GCP_EXIT.md, because migration row counts are verified against it. Also needs RESILIENT-314 done (the cuphead Supabase stack is live, with its URL + keys in ~/.chump/providers.env on cuphead). Any node may do the code work; the app points at the cuphead stack by env vars (Vercel env), never with hard-coded hosts. The DNS cutover of the public domain happens only after a green preview deploy.
    [2026-09-26] UNBLOCKED from PRODUCT-303 (Jeff: dev data). Build fresh schemas from the app code; import only the Auth users from /srv/gcp-export/<project>/auth/ on cuphead. Firestore/Storage content is NOT required (billing-gated, parked in PRODUCT-310); row-count parity ACs apply only to the Auth user count. Password-hash params are skipped: dev users reset passwords.
