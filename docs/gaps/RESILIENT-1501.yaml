- id: RESILIENT-1501
  domain: RESILIENT
  title: "RESILIENT: bridge fleet-bus events into per-node inboxes + ambient.jsonl (CHUMP_FLEET_WIRE_V1 consumer) so DMs, proposals and votes reach sessions"
  status: open
  priority: P1
  effort: m
  description: |
    Outcome FLEET-BUS step 3. Even with nodes on the bus, nothing consumes chump.events.* into what sessions read: the NATS->local consumer (crates/chump-coord/src/jetstream_consumer.rs) is gated on CHUMP_FLEET_WIRE_V1=1 AND CHUMP_NATS_URL, and broadcast.sh DMs (--to) only write local file inboxes. Rough shape: enable CHUMP_FLEET_WIRE_V1 on each node (supervised, survives reboot); make the consumer write remote events into ambient.jsonl and, for events with a to= recipient, into that session's inbox (same format broadcast.sh writes, dedupe on corr_id/msg id so a node never re-ingests its own publish); FEEDBACK kind=proposal and votes must reach the deliberator on every node. This is also what a cloud session's publish will ride (RESILIENT-1499).
  acceptance_criteria:
    - broadcast.sh --to <session> WARN from CJ lands in that session's inbox on cuphead (and reverse), without copy-paste
    - A FEEDBACK kind=proposal + a chump vote published on one node are tallied by the deliberator on the other
    - A raw nats publish of a CoordEvent JSON to chump.events.<kind> (as a cloud session would send) appears in ambient.jsonl on both nodes
    - "No duplicate or echo: a node's own publish is not re-ingested; consumer survives a NATS restart"
  depends_on: [RESILIENT-1500]
  opened_date: '2026-09-29'
  preferred_machine: cuphead
  outcome_id: FLEET-BUS
  evidence: |
    COMMAND: grep CHUMP_FLEET_WIRE_V1 crates/chump-coord/src/jetstream_consumer.rs + scripts/coord/broadcast.sh (2026-09-29). OUTPUT: the NATS->local consumer is gated on CHUMP_FLEET_WIRE_V1=1 AND CHUMP_NATS_URL; broadcast.sh DMs (--to) write file inboxes and only best-effort chump-coord emit; nothing consumes chump.events.* into inboxes/ambient on any node. THEORY: even with nodes on the bus, a message published by another node or a cloud session never reaches a session's inbox, so cross-node DMs/proposals/votes stay copy-paste. ALT: sessions subscribe to NATS directly - rejected: sessions read inbox/ambient files today; the bridge keeps one read path.

