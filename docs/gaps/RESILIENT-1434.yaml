  evidence: |
    COMMAND: a2a internal audit 2026-09-20 — cat /etc/nats-server.conf + journalctl -u nats-server + nc -z 100.101.188.30 7422 (live).
    OUTPUT: CJ NATS is a leafnode to the fleet hub nats://...@100.101.188.30:7422; journalctl shows continuous [ERR] connect as leafnode i-o timeout (attempt counter ~126000 as of 14:13Z); live nc -z -w3 100.101.188.30 7422 = TCP FAIL at 15:46Z. So every NATS-JetStream-backed a2a primitive on CJ (help-request KV, presence KV, capability KV, chump-coord watch, consensus fanout) is islanded — talking only to itself, cannot see or be seen by other fleet nodes. LIVE ONGOING OUTAGE.
    THEORY: cross-node agent-to-agent coordination is DOWN — the transport it rides is unreachable. This is why help-request has fired 0 times ever and consensus cannot fan out. Same class as the Sentinel cuphead-CJ block. Fix: restore the leafnode route to the hub (is the hub 100.101.188.30:7422 even up? firewall? stale hub IP post-Mac-evac?), and alarm on leafnode-disconnected so this never sits silently at 126k failed attempts.
