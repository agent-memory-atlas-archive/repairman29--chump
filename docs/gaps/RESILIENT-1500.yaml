- id: RESILIENT-1500
  domain: RESILIENT
  title: "RESILIENT: cuphead + CJ fleet workers join the cuphead NATS hub (CHUMP_NATS_URL, FLEET account) so chump-coord stream + KV go live (supersedes RESILIENT-1434)"
  status: open
  priority: P1
  effort: m
  description: |
    Outcome FLEET-BUS step 2. No node runs chump-coord against a live broker: CJ's local broker (127.0.0.1:4222) has 0 clients, cuphead's worker has no CHUMP_NATS_URL, CJ's env still points at dead Helsinki (100.120.232.0). Rough shape: set CHUMP_NATS_URL=nats://<FLEET user>:<secret>@100.113.181.18:4222 in each node's worker env (cuphead ~/.chump/providers.env, CJ equivalent) - the tailnet ACL already allows CJ->cuphead tcp:4222, so NO ACL change and no CJ leafnode; remove the dead Helsinki URL; decide CJ's local nats-server (stop, or keep isolated and unused - state which); first chump-coord connect creates the stream + KV buckets in the FLEET account; restart workers. The Mac is an observer, not a node: do not configure it. Supersedes RESILIENT-1434 (Helsinki leafnode) and the node-side half of INFRA-2471.
  acceptance_criteria:
    - chump-coord connects from cuphead and from CJ using only CHUMP_NATS_URL (FLEET user); nats stream ls / kv ls on the FLEET account show chump-coord's events stream and KV buckets
    - An emit on CJ (chump-coord emit WARN ...) is received by chump-coord watch on cuphead, and the reverse
    - No node env references the dead Helsinki URL; CJ's local broker decision is stated and applied
    - Workers on cuphead and CJ still pick and ship (no regression) after the env change
  depends_on: [CREDIBLE-1478, CREDIBLE-1479]
  notes: |
    [2026-09-29T22:44:27Z] [2026-09-29] Heads-up from CREDIBLE-1478 live check: the FLEET user's permissions are only chump.> (pub+sub). chump-coord connect() creates KV buckets + a JetStream stream and uses request/reply, so FLEET needs $JS.API.>, $KV.>, _INBOX.> (and $JS.ACK.> for consumers) or connect fails. Fix the FLEET permissions first.
  opened_date: '2026-09-29'
  preferred_machine: cuphead
  outcome_id: FLEET-BUS
  evidence: |
    COMMAND: ss -tn sport=4222 on CJ; grep CHUMP_NATS_URL on cuphead/CJ; nats stream ls + kv ls on cuphead hub (2026-09-29). OUTPUT: CJ broker 127.0.0.1:4222 has 0 clients; cuphead worker has no CHUMP_NATS_URL; CJ env still points at dead Helsinki 100.120.232.0; cuphead hub has no chump-coord stream and no KV buckets. THEORY: no node runs chump-coord against any broker, so every NATS a2a primitive (help-request, presence, capability KV, consensus fan-out) is dark fleet-wide. ALT: re-link CJ broker as a leaf to cuphead - rejected: needs a new tailnet ACL port; direct clients to 100.113.181.18:4222 is already allowed.

