notes: |
  operator 2026-10-12: outward/user-facing (Olive/prod), prioritized.

  Root cause: PKCE verifier cookie was lost when the browser visited a different origin (www.shopolive.xyz vs shopolive.xyz). The canonical host redirect was implemented in src/proxy.ts but wasn't executing because Next.js middleware.ts file was missing.

  Fix: Created middleware.ts entry point that exports the proxy function. This ensures Next.js executes the canonical host redirect on every request, preventing split-origin cookie loss.

  See: https://github.com/repairman29/olive/pull/123
