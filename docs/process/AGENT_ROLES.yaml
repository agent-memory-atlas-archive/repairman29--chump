version: 1
# AGENT_ROLES.yaml — registry of role hints accepted by `chump claim --role <role>`.
#
# INFRA-1863 slice (INFRA-5773): `--role` became mandatory on `chump claim`
# (INFRA-5486) but was not yet validated against a known set — any string was
# accepted. This file is that known set. `chump claim --role <role>` rejects
# any role not listed below with a clear error (see src/agent_roles.rs).
#
# To add a role: append an entry here in the same PR that introduces the
# role's usage (curator doc, dispatch script, etc.) — do not pre-register
# speculative roles.
roles:
  - name: curator
    description: >
      General lane-curator role (e.g. curator-opus-* sessions in .claude/agents/)
      that owns a specific concern (architecture, historian, roadmap, scout,
      velocity, context-keeper, incident-commander) and files/reviews gaps in
      its lane rather than picking arbitrary work.
    skills:
      - fleet-coordination
      - gap-triage

  - name: fleet
    description: >
      The atomic fleet picker (_pick_and_claim_gap.py) delegating session-lease
      acquisition to `chump claim --role fleet --lease-only` (INFRA-8580).
    skills:
      - fleet-coordination

  - name: fleet-worker
    description: >
      A tmux/headless worker (scripts/dispatch/worker.sh) that pulls an open
      gap from state.db, claims it, implements, and ships via bot-merge.sh.
      The default picker role for most gaps.
    skills:
      - rust
      - shell
      - git

  - name: fleet-test
    description: >
      CI test-harness role used by the claim/coordination smoke tests
      (scripts/ci/coord-surfaces-smoke.sh and scripts/ci/test-claim-*.sh) to
      drive `chump claim` end-to-end on the positive path. Not a real fleet
      lane — it exists only so CI can exercise a claim. Negative-path tests
      deliberately use an unregistered role (e.g. `bogus`) and must keep
      failing, so those stay out of this registry.
    skills:
      - ci-harness

  - name: paramedic
    description: >
      Resilience/recovery role (crates/chump-paramedic) that revives wedged
      or crashed fleet processes rather than implementing feature gaps.
    skills:
      - process-supervision
      - incident-recovery

  - name: ci-audit
    description: >
      CI/test-gate curator (.claude/agents/ci-audit.md) that decomposes CI
      failure clusters into flake/logic-bug/missing-gate buckets and dispatches
      sub-agents on the flake-rerun-able ones.
    skills:
      - ci-triage
      - test-flake-diagnosis

  - name: handoff
    description: >
      Typed-handoff routing curator (.claude/agents/handoff.md) that routes
      sub-agent dispatch through typed contracts and manages collision-safe
      file edits via lease scanning.
    skills:
      - dispatch-routing
      - lease-management

  - name: target
    description: >
      Demo-target curator (.claude/agents/target.md) that owns the primary
      demo repo, Liaison Phase 2 slices, and parallel sub-fleet dispatch.
    skills:
      - demo-curation
      - sub-fleet-dispatch

  - name: decompose
    description: >
      Gap-slicing curator (.claude/agents/decompose.md) that slices umbrella
      gaps into concrete sub-gaps against current-codebase context.
    skills:
      - gap-decomposition

  - name: shepherd
    description: >
      PR-rescue curator (.claude/agents/shepherd.md) that unwedges stuck PRs
      (BEHIND rebases, BLOCKED re-arms, DIRTY conflict triage) and diagnoses
      cross-PR failure clusters.
    skills:
      - pr-rescue
      - fleet-triage

  - name: bot-merge
    description: >
      The ship pipeline (scripts/coord/bot-merge.sh) re-claiming a gap's lease
      before it pushes and arms auto-merge. A pipeline operation, not a
      role-specific lane; registered so its `chump claim --role bot-merge`
      passes role validation (RESILIENT-1528 static gate).
    skills:
      - git
      - shell

  - name: factory
    description: >
      Capacity role (RESILIENT-320) for nodes running the full worker fleet:
      CJ workers, PR lander, reapers, integrator, orchestrator, disk monitor,
      and health watchdog. Targets factory/production deployment model.
    skills:
      - fleet-orchestration
      - worker-supervision

  - name: data
    description: >
      Capacity role (RESILIENT-320) for data-plane nodes: orchestrator, disk
      monitor, health watchdog, and PostgREST gateway. Excludes PR lander and
      reapers. Targets data infrastructure deployment model.
    skills:
      - data-infrastructure
      - gateway-supervision

  - name: embed
    description: >
      Capacity role (RESILIENT-320) for embed/inference nodes: orchestrator
      and disk monitor. Lightweight deployment for embedding infrastructure.
    skills:
      - embedding-infrastructure
      - resource-optimization

  - name: wave
    description: >
      Human/operator-supervised wave session claiming one or more gaps via
      `chump claim <GAP-ID> --role wave --lease-only` so the fleet picker
      honours in-progress wave work and never double-dispatches (INFRA-8640).
    skills:
      - fleet-coordination
      - rust
      - shell
