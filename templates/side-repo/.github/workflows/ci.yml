# Placeholder CI — replace with real checks (e.g. cargo fmt/test, npm test) when code lands.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scaffold smoke
        run: echo "OK — add build steps when the project has a stack."

  # EFFECTIVE-358 L1: chump intake happens upstream of this repo's CI (the
  # umbrella gap + requirement set already exist by the time code lands), so
  # this job is a placeholder checkpoint — it exists to give design-pass an
  # explicit `needs:` predecessor per docs/design-pass-stage.md's pipeline
  # order (intake -> design pass -> implement -> CSS token gate).
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Intake checkpoint (placeholder)
        run: echo "OK — intake requirement set is produced upstream by 'chump intake' before code lands."

  design-pass:
    needs: intake
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Design pass (placeholder)
        run: bash .github/scripts/design-pass.sh
      - name: Post design-pass comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Design pass: manual review required. No automated checks configured yet.'
            })
