# RESILIENT-1296: Inject XDG_RUNTIME_DIR and DBUS_SESSION_BUS_ADDRESS for user-scope systemctl access
# This drop-in overrides the base chump-duty-officer.service to set the environment variables
# required for the duty-officer to call `systemctl --user` successfully.
# The @UID@ placeholder is replaced by the installer with the actual UID at installation time.
[Service]
Environment=XDG_RUNTIME_DIR=/run/user/@UID@
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/@UID@/bus
