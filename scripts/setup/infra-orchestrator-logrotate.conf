# scripts/setup/infra-orchestrator-logrotate.conf — INFRA-6128 (INFRA-1966 slice)
#
# Rotation config for the central orchestrator log written by
# scripts/lib/orchestrator-log.sh (bot-merge, queue-driver, pr-rescue,
# pr-auto-rearm, pr-auto-rebase, worker.sh).
#
# Install (Linux hosts with logrotate):
#   sudo cp scripts/setup/infra-orchestrator-logrotate.conf /etc/logrotate.d/infra-orchestrator
#
# Verify: sudo logrotate --debug /etc/logrotate.d/infra-orchestrator
/var/log/infra-orchestrator.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
