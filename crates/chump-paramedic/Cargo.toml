[package]
name = "chump-paramedic"
version = "0.1.0"
edition = "2021"
description = "ChumpOS paramedic: per-PR triage/execute/daemon rule-engine that unblocks stuck PRs (rebase, keystone re-check, staleness). Extracted from the bin crate (EFFECTIVE-404 build-speed) so it compiles + caches independently of the 190k-line binary."
repository = "https://github.com/repairman29/chump"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.118", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
chump-ship = { path = "../chump-ship", version = "0.2.0" } # INFRA-8221: arm policy

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
