[package]
name = "chumpd"
version = "0.1.0"
edition = "2021"
description = "MISSION-051 supervisor daemon v0: owns the worker pool as supervised child processes — no tmux, no launchd zoo. Ground-up step 2."
repository = "https://github.com/repairman29/chump"
license = "AGPL-3.0-only"
keywords = ["agent", "supervisor", "fleet", "daemon"]
categories = ["development-tools"]

[[bin]]
name = "chumpd"
path = "src/main.rs"

[dependencies]
# INFRA-8190: the ONE gap-store path resolver.
chump-store-path = { path = "../chump-store-path", version = "0.1.0" }
serde_json = "1.0"
libc = "0.2"
tokio = { version = "1", features = ["full", "net"] }
serde = { version = "1.0", features = ["derive"] }
chump-disk-inventory = { path = "../chump-disk-inventory" }
