[package]
name = "chump-eval-harness"
version = "0.1.0"
edition = "2021"
description = "ChumpOS single-turn eval harness: seed cases, property/rubric scoring engine, LLM-judge adapter, DB persistence of eval cases/runs, and regression detection. Extracted from the bin crate (EFFECTIVE-406 build-speed) so it compiles + caches independently of the 190k-line binary."
repository = "https://github.com/repairman29/chump"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0.118", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
axonerai = "0.1"
chump-db-pool = { path = "../chump-db-pool", version = "0.1.0" }
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
async-trait = "0.1"

[lints]
workspace = true
