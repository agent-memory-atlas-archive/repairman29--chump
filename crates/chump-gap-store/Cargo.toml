[package]
name = "chump-gap-store"
version = "0.2.0"
edition = "2021"
description = "SQLite-backed gap registry: status tracking, dependency graph, blame lineage, per-file YAML mirrors. Canonical store for the Chump fleet's coordination state. Zero internal deps on the chump binary."
repository = "https://github.com/repairman29/chump"
homepage = "https://github.com/repairman29/chump/tree/main/crates/chump-gap-store"
license = "Apache-2.0"
keywords = ["gap", "registry", "sqlite", "agent", "coordination"]
categories = ["development-tools", "database"]
readme = "README.md"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# EFFECTIVE-834 (EFFECTIVE-364 slice): resolve_publication() looks up
# registered publish targets for a shipped gap's artifact_type.
chump-bench = { path = "../chump-bench", version = "0.1.0" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.118", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# EFFECTIVE-1298: maintenance::enricher's OpenRouter model-metadata fetch
# (GET https://openrouter.ai/api/v1/models). json + rustls-tls only, no
# blocking client — the fetch runs on the crate's existing tokio runtime.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# INFRA-2092: optional Postgres backend slice — only compiled under the
# `postgres-backend` feature. SQLite (rusqlite, above) stays the default.
postgres = { version = "0.19", optional = true }
# INFRA-2000: needed by the maintenance::architect module's LlmClient trait
# (async fn complete) plus the chump-gap-architect bin's tokio runtime.
tokio = { version = "1", features = ["rt", "macros", "process"] }
thiserror = "2"

[features]
# Opt-in test helpers (`conn_for_test`) for downstream crates that want to
# seed the store directly from their own integration tests. Never enabled
# in production builds.
test-helpers = []
# INFRA-2092: opt-in Postgres storage backend (crate::backend::postgres).
# SQLite (crate::backend::sqlite) remains the default; this feature only
# compiles the Postgres implementation of the GapBackend trait.
postgres-backend = ["dep:postgres"]

[dev-dependencies]
serial_test = "4"
tempfile = "3"

# INFRA-2000: Phase 1 of META-107 — maintenance-module CLI binaries
# (chump-gap-doctor / chump-gap-gardener / chump-gap-architect /
# chump-check-gaps-integrity). Selected via the CHUMP_GAP_MAINTENANCE_RUST=1
# feature flag in the four sibling scripts/coord/gap-*.py shims; Python
# bodies stay inline for 1-week parallel-run discipline.
[[bin]]
name = "chump-gap-doctor"
path = "src/bin/chump-gap-doctor.rs"

[[bin]]
name = "chump-gap-gardener"
path = "src/bin/chump-gap-gardener.rs"

[[bin]]
name = "chump-gap-architect"
path = "src/bin/chump-gap-architect.rs"

[[bin]]
name = "chump-gap-enricher"
path = "src/bin/chump-gap-enricher.rs"

[[bin]]
name = "chump-check-gaps-integrity"
path = "src/bin/chump-check-gaps-integrity.rs"

# INFRA-3631 / INFRA-5402: applies the shared_gaps/shared_claims/
# worker_capabilities schema to a Postgres substrate via Rust init_schema
# instead of piping supabase/migrations/*.sql through psql. Only buildable
# with the postgres-backend feature (pulls in the optional `postgres` dep).
[[bin]]
name = "chump-gap-substrate-init"
path = "src/bin/chump-gap-substrate-init.rs"
required-features = ["postgres-backend"]

[lints]
workspace = true
