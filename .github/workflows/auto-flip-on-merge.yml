# .github/workflows/auto-flip-on-merge.yml
# CREDIBLE-1553 (Phase R R2): converted from title-regex extraction to the
# typed gap_prs FK (`chump gap gaps-for-pr <PR-NUMBER>`). Never parses a gap ID
# from a PR title, commit subject, or body.

name: auto-flip-on-merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-flip-on-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  flip-on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build chump
        run: cargo build --bin chump --release

      - name: Flip FK-linked gap(s) to done
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          chump_bin="$PWD/target/release/chump"
          if [[ ! -x "$chump_bin" ]]; then
            echo "[flip] ERROR: chump binary not found at $chump_bin"
            exit 1
          fi
          gap_ids="$("$chump_bin" gap gaps-for-pr "$PR_NUMBER" 2>/dev/null | sort -u || true)"
          if [[ -z "$gap_ids" ]]; then
            echo "[flip] no gap_prs row for PR #$PR_NUMBER — skipping flip"
            exit 0
          fi
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for GAP_ID in $gap_ids; do
            if CHUMP_GAP_SHIP_SKIP_STALE_CHECK=1 \
               "$chump_bin" gap ship "$GAP_ID" \
                  --closed-pr "$PR_NUMBER" \
                  --update-yaml; then
              echo "[flip] ✓ flipped $GAP_ID → done (closed_pr=$PR_NUMBER)"
              printf '{"ts":"%s","kind":"gap_auto_flipped","gap":"%s","pr":%s,"outcome":"shipped"}\n' \
                  "$ts" "$GAP_ID" "$PR_NUMBER"
            else
              echo "[flip] ⚠ chump gap ship failed for $GAP_ID"
              printf '{"ts":"%s","kind":"gap_auto_flip_failed","gap":"%s","pr":%s,"reason":"chump-gap-ship-nonzero"}\n' \
                  "$ts" "$GAP_ID" "$PR_NUMBER"
            fi
          done
