# RESILIENT-006: PR-stale auto-rebase.
#
# Scans auto-merge-armed PRs every 2 hours for CI failures that have since
# passed on main, then rebases + re-arms auto-merge automatically.
#
# Triggered: schedule (every 2h) + workflow_dispatch for manual runs.
# Safe to run concurrently — each PR branch gets an independent temp clone.

name: pr-rescue (RESILIENT-006)

on:
  # RESILIENT-1644 (PHASE-R R3 slice c): cron schedule disabled now that the
  # native GitHub merge queue is active; workflow_dispatch retained for manual
  # rescue or one-line revert.
  # schedule:
  #   - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional: single PR number to rescue (leave blank to scan all)"
        required: false
        default: ""
      stale_hours:
        description: "Age threshold in hours for the red-CI rebase path (default: 4)"
        required: false
        default: "4"
      noci_minutes:
        description: "RESILIENT-248: minutes with ZERO CI runs before re-firing (default: 25)"
        required: false
        default: "25"
      dry_run:
        description: "Log what would be re-fired without touching any PR"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# INFRA-1378: workflow-level group, do NOT cancel — rescue scans take a while
# and must finish (cancelling mid-rebase could leave a PR in a half-state).
concurrency:
  group: pr-rescue
  cancel-in-progress: false

jobs:
  rescue:
    name: scan and rebase stale PRs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_RESCUE_STALE_HOURS: ${{ inputs.stale_hours || '4' }}
      PR_RESCUE_NOCI_MINUTES: ${{ inputs.noci_minutes || '25' }}
      PR_RESCUE_DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
    steps:
      # RESILIENT-248: an App token, NOT secrets.GITHUB_TOKEN.
      #
      # This is load-bearing, not hygiene. GitHub does not create workflow runs
      # from events triggered by GITHUB_TOKEN. The zero-CI-runs rescue works by
      # closing and reopening a PR to re-fire its `pull_request` event — done
      # with GITHUB_TOKEN that reopen would produce EXACTLY the zero-run state
      # it is trying to cure, while logging success. The instrument would report
      # healthy while curing nothing, which is worse than not having it.
      #
      # Same App the queue driver uses (.github/workflows/queue-driver.yml:48).
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.QUEUE_DRIVER_APP_ID }}
          private-key: ${{ secrets.QUEUE_DRIVER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Run pr-rescue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [[ -n "${{ inputs.pr_number }}" ]]; then
            bash scripts/coord/pr-rescue.sh --pr "${{ inputs.pr_number }}"
          else
            bash scripts/coord/pr-rescue.sh
          fi

      - name: Upload ambient log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-rescue-ambient-log
          path: .chump-locks/ambient.jsonl
          if-no-files-found: ignore
