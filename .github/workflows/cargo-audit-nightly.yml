name: cargo audit (nightly)
# INFRA-503 (2026-05-06): split out from ci.yml's per-PR audit job.
# Reasoning: cargo audit's RustSec database updates daily, not per-commit.
# Running it on every PR cost ~12min × every PR — the dominant cycle-time tax.
# Nightly + on-push-to-main covers the same surface with negligible per-PR cost.
#
# When this workflow detects an advisory:
#   1. Job fails (exit 1).
#   2. The job's failure is visible in the Actions tab + dispatched to Slack/etc
#      via existing on-failure hooks (none currently — TODO if alert volume warrants).
#   3. Operator files an INFRA gap (priority depends on advisory severity).
#
# Manual trigger: gh workflow run cargo-audit-nightly.yml

on:
  schedule:
    # 03:00 UTC daily (~22:00 PT, 23:00 MT) — quiet hours, after most activity
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
      - '.github/workflows/cargo-audit-nightly.yml'
  workflow_dispatch:

# Least-privilege token scope. Every job here only reads the repository;
# nothing in this workflow writes through GITHUB_TOKEN.
permissions:
  contents: read

# INFRA-1378: workflow-level group, do NOT cancel in progress —
# nightly cron should finish even if a manual dispatch fires.
concurrency:
  group: cargo-audit-nightly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (advisory list — non-blocking)
        continue-on-error: true
        run: cargo audit

      # SECURITY-004: blocking pass that fails on any new vulnerability.
      # Existing-but-unfixable advisories are explicitly ignored with --ignore
      # + a pointer to the upstream block. To add a new ignore: confirm the
      # upstream chain is the blocker (cargo audit tree shows the path), then
      # add the RUSTSEC ID + a one-line comment. Do NOT add ignores for
      # advisories that have a fix available — bump the dep instead.
      - name: Run cargo audit (blocking on new vulns)
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2024-0429 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0449 \
            --ignore RUSTSEC-2025-0057 \
            --ignore RUSTSEC-2025-0119 \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0097 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0221 \
            --ignore RUSTSEC-2026-0258 \
            --ignore RUSTSEC-2026-0316 \
            --ignore RUSTSEC-2026-0321 \
            --ignore RUSTSEC-2026-0322 \
            --ignore RUSTSEC-2026-0323 \
            --ignore RUSTSEC-2026-0324 \
            --ignore RUSTSEC-2026-0325 \
            --ignore RUSTSEC-2026-0326 \
            --ignore RUSTSEC-2026-0327 \
            --ignore RUSTSEC-2026-0338 \
            --ignore RUSTSEC-2026-0339 \
            --ignore RUSTSEC-2026-0340 \
            --ignore RUSTSEC-2026-0341 \
            --ignore RUSTSEC-2026-0342 \
            --ignore RUSTSEC-2026-0346 \
            --ignore RUSTSEC-2026-0349 \
            --ignore RUSTSEC-2026-0352 \
            --ignore RUSTSEC-2026-0353 \
            --ignore RUSTSEC-2026-0354 \
            --ignore RUSTSEC-2026-0355 \
            --ignore RUSTSEC-2026-0356 \
            --ignore RUSTSEC-2026-0357 \
            --ignore RUSTSEC-2026-0358 \
            --ignore RUSTSEC-2026-0359 \
            --ignore RUSTSEC-2026-0360 \
            --ignore RUSTSEC-2026-0361 \
            --ignore RUSTSEC-2026-0362 \
            --ignore RUSTSEC-2026-0363 \
            --ignore RUSTSEC-2026-0364 \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369 \
            --ignore RUSTSEC-2026-0370 \
            --ignore RUSTSEC-2026-0371 \
            --ignore RUSTSEC-2026-0372 \
            --ignore RUSTSEC-2026-0378 \
            --ignore RUSTSEC-2026-0379 \
            --ignore RUSTSEC-2026-0381 \
            --ignore RUSTSEC-2026-0382 \
            --ignore RUSTSEC-2026-0383 \
            --ignore RUSTSEC-2026-0385 \
            --ignore RUSTSEC-2026-0387
          # Ignored RUSTSEC IDs (each blocked on upstream — re-audit when
          # the ecosystem moves). Full reachability analysis: docs/security/RUSTSEC-AUDIT.md
          #   2023-0071  rsa Marvin attack          — no fixed version published; NOT REACHABLE
          #                                           (chump uses VAPID/EC, never RSA decrypt)
          #   2026-0049  rustls-webpki CRL DP       — blocked on serenity 0.12 → newer rustls
          #   2026-0098  rustls-webpki URI names    — blocked on serenity 0.12 → newer rustls
          #   2026-0099  rustls-webpki wildcard     — blocked on serenity 0.12 → newer rustls
          #   2026-0104  rustls-webpki HIGH panic   — blocked on serenity 0.12 → newer rustls
          #                                           NOT REACHABLE via Discord WS (no CRLs)
          #                                           discord feature is off by default
          #   2024-0436  paste unmaintained          — transitive (tauri/wasmtime), benign
          #   2026-0097  rand 0.7 unsound logger     — transitive (tauri/phf), no fix path
