name: verified-recompute

# RESILIENT-1562: `verified` (ci.yml) aggregates audit.yml + ACP smoke, which live in
# other workflows. Rather than depend on a fixed wall-clock poll window opening
# early enough, ci.yml's `verified` polls only a short grace period (lanes still
# running stay PENDING) and THIS workflow re-runs `verified` on the terminal
# workflow_run event of Audit / integrations. The verdict is therefore a function
# of the audit/ACP terminal state, not of timing.

on:
  workflow_run:
    workflows: [Audit, integrations]
    types: [completed]

permissions:
  actions: write
  contents: read

# ZERO-WASTE-135: stable key per upstream event type + branch, NOT per upstream
# head_sha. A per-sha key never dedupes: every Audit/integrations completion on a
# fresh sha opened its own group, so a hosted-runner stall queued 14 of these on
# main (2026-10-17 14:25Z). Keying on event+branch lets a newer completion
# supersede an older queued/running one for the same branch. Event type is in
# the key so a `push` completion (the job below skips it) can never cancel a
# real pull_request/merge_group recompute on the same branch. Safe to cancel:
# the job only polls and POSTs one idempotent job-rerun; a cancelled half-run
# leaves no state and the superseding run re-derives the verdict.
concurrency:
  group: verified-recompute-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  rerun-verified:
    if: github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-run verified for this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ci_run="$(gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" -q '.workflow_runs[0].id // empty')"
          if [ -z "$ci_run" ]; then echo "no ci.yml run for ${SHA}; nothing to recompute"; exit 0; fi
          # verified may still be running (it will then see the terminal state itself);
          # wait for it to finish, then re-run so the verdict reflects audit/ACP terminal state.
          for _ in $(seq 1 40); do
            row="$(gh api "repos/${GH_REPO}/actions/runs/${ci_run}/jobs" --paginate -q '.jobs[] | select(.name=="verified") | "\(.id) \(.status) \(.conclusion)"' | tail -1)"
            [ -z "$row" ] && { echo "no verified job yet"; exit 0; }
            read -r job_id job_status job_conclusion <<<"$row"
            if [ "$job_status" = "completed" ]; then
              if [ "$job_conclusion" = "success" ]; then echo "verified already green"; exit 0; fi
              gh api -X POST "repos/${GH_REPO}/actions/jobs/${job_id}/rerun" && echo "re-ran verified job ${job_id} (run ${ci_run})"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::verified still running after 10m; leaving to its own poll"
