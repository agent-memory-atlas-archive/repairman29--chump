name: verified-recompute

# RESILIENT-1562 / CREDIBLE-1534 / CREDIBLE-1521: `verified` (ci.yml) aggregates
# audit.yml + ACP smoke, which live in other workflows. Rather than depend on a
# fixed wall-clock poll window opening early enough, THIS workflow re-runs
# `verified` on the terminal workflow_run event of Audit / integrations (for
# pull_request, merge_group, and push to main) with transient GitHub API 5xx
# retry + idempotent rerun-race handling so transient HTTP 502s never leave
# verified-recompute red on main.

on:
  workflow_run:
    workflows: [Audit, integrations]
    types: [completed]

permissions:
  actions: write
  contents: read

# ZERO-WASTE-135: stable key per upstream event type + branch, NOT per upstream
# head_sha. Keying on event+branch lets a newer completion supersede an older
# queued/running one for the same branch.
concurrency:
  group: verified-recompute-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  rerun-verified:
    if: >-
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'merge_group' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-run verified for this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          POLL_MAX="${POLL_MAX:-40}"
          POLL_SLEEP_S="${POLL_SLEEP_S:-15}"
          RETRY_MAX="${RETRY_MAX:-4}"
          RETRY_SLEEP_S="${RETRY_SLEEP_S:-2}"

          # CREDIBLE-1534: retry transient GitHub API 5xx / network errors so a
          # single HTTP 502 on runs/jobs or POST /rerun does not fail the job.
          gh_api_retry() {
            local attempt=1 out="" rc=0
            while [ "$attempt" -le "$RETRY_MAX" ]; do
              if out="$(gh api "$@" 2>&1)"; then
                printf '%s\n' "$out"
                return 0
              else
                rc=$?
              fi
              echo "::warning::gh api attempt ${attempt}/${RETRY_MAX} failed (rc=${rc}): ${out}" >&2
              if [ "$attempt" -lt "$RETRY_MAX" ]; then
                sleep "$RETRY_SLEEP_S"
              fi
              attempt=$((attempt + 1))
            done
            return "$rc"
          }

          if ! ci_run="$(gh_api_retry "repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" -q '.workflow_runs[0].id // empty')"; then
            echo "::warning::transient error querying ci.yml run for ${SHA} after ${RETRY_MAX} attempts; skipping recompute"
            exit 0
          fi
          if [ -z "$ci_run" ]; then echo "no ci.yml run for ${SHA}; nothing to recompute"; exit 0; fi

          # verified may still be running (it will then see the terminal state itself);
          # wait for it to finish, then re-run so the verdict reflects audit/ACP terminal state.
          for _ in $(seq 1 "$POLL_MAX"); do
            if ! row="$(gh_api_retry "repos/${GH_REPO}/actions/runs/${ci_run}/jobs" --paginate -q '.jobs[] | select(.name=="verified") | "\(.id) \(.status) \(.conclusion)"' | tail -1)"; then
              echo "::warning::transient error querying jobs for run ${ci_run}; will retry next poll"
              sleep "$POLL_SLEEP_S"
              continue
            fi
            [ -z "$row" ] && { echo "no verified job yet"; exit 0; }
            read -r job_id job_status job_conclusion <<<"$row"
            if [ "$job_status" = "completed" ]; then
              if [ "$job_conclusion" = "success" ]; then echo "verified already green"; exit 0; fi
              attempt=1
              while [ "$attempt" -le "$RETRY_MAX" ]; do
                if rerun_err="$(gh api -X POST "repos/${GH_REPO}/actions/jobs/${job_id}/rerun" 2>&1)"; then
                  echo "re-ran verified job ${job_id} (run ${ci_run})"
                  exit 0
                fi
                if printf '%s' "$rerun_err" | grep -qiE '403|already running|cannot be re-run'; then
                  echo "verified job ${job_id} already queued/running; nothing to do"
                  exit 0
                fi
                echo "::warning::POST jobs/${job_id}/rerun attempt ${attempt}/${RETRY_MAX} failed: ${rerun_err}" >&2
                if [ "$attempt" -lt "$RETRY_MAX" ]; then
                  sleep "$RETRY_SLEEP_S"
                fi
                attempt=$((attempt + 1))
              done
              echo "::error::failed to re-run verified job ${job_id} after ${RETRY_MAX} attempts" >&2
              exit 1
            fi
            sleep "$POLL_SLEEP_S"
          done
          echo "::warning::verified still running after 10m; leaving to its own poll"
