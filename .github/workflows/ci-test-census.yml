# .github/workflows/ci-test-census.yml — CREDIBLE-1514
#
# Nightly scripts/ci census: run every scripts/ci/test-*.sh (wired or not) in
# a sandbox, regenerate docs/observability/CI_TEST_CENSUS.md +
# ci-test-census.json, and open or update ONE bot PR titled "census: <date>"
# from the census/nightly branch, labelled `census`.
#
# Why: ~1,611 test scripts, ~390 referenced by any workflow or preflight
# (ci.yml ~190). On 2026-10-17 four agents found 40+ red on untouched main that
# nothing ran. This publishes the red and unwired lists; the shrink-only gate
# in ci.yml fast-checks (scripts/ci/test-census-shrink-only.sh) keeps them
# from growing.
#
# Binary: many tests SKIP without a built chump. Nothing is built here; the
# latest successful build-fleet-binaries.yml artifact on main
# (chump-x86_64-unknown-linux-gnu-<sha>) is downloaded into target/release and
# target/debug, the two paths the tests probe. If none is found the census
# still runs and those tests report skip.
#
# Arming: the PR is armed for auto-merge only when the RESILIENT-1613 arm
# policy allows it (scripts/coord/lib/arm-policy.sh). A `no-auto-merge` label
# or an `Auto-merge: hold` line on the census PR keeps it held across nights.
#
# The PR uses the queue-driver GitHub App token when available so CI runs on
# it (GITHUB_TOKEN-created PRs do not trigger workflows); it falls back to
# GITHUB_TOKEN.

name: ci-test-census

on:
  schedule:
    - cron: "30 4 * * *"   # 04:30 UTC nightly
  workflow_dispatch:
    inputs:
      sample:
        description: "Run only N tests (blank = all). A sampled run does not open a PR."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: read   # download the build-fleet-binaries artifact

concurrency:
  group: ci-test-census
  cancel-in-progress: false

jobs:
  census:
    # Match the glibc the fleet binary is built against (build-fleet-binaries.yml).
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CHUMP_CENSUS_TIMEOUT_S: "120"
      CHUMP_CENSUS_JOBS: "6"
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.QUEUE_DRIVER_APP_ID }}
          private-key: ${{ secrets.QUEUE_DRIVER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Install test dependencies [census-nightly]
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q sqlite3 jq

      - name: Fetch the latest fleet chump binary (no build) [census-nightly]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          target=x86_64-unknown-linux-gnu
          read -r run_id sha < <(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow build-fleet-binaries.yml --branch main --status success --limit 1 \
            --json databaseId,headSha -q '.[0] | "\(.databaseId) \(.headSha)"' 2>/dev/null) || true
          if [[ -z "${run_id:-}" ]]; then
            echo "::warning::no successful build-fleet-binaries run; binary-dependent tests will skip"
            exit 0
          fi
          if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "chump-${target}-${sha}" -D "$RUNNER_TEMP/chump-bin"; then
            for p in target/release target/debug; do
              mkdir -p "$p"
              install -m 0755 "$RUNNER_TEMP/chump-bin/chump" "$p/chump"
            done
            echo "binary from build-fleet-binaries run $run_id (sha $sha)"
            ./target/release/chump --version || true
          else
            echo "::warning::artifact chump-${target}-${sha} not downloadable; binary-dependent tests will skip"
          fi

      - name: Fleet GO for claim-exercising tests (same as ci.yml CREDIBLE-166) [census-nightly]
        # census.sh writes AUTONOMY_LEVEL=5 into each test's sandbox HOME too;
        # this covers anything that reads the runner HOME before the sandbox.
        run: mkdir -p "$HOME/.chump" && echo 5 > "$HOME/.chump/AUTONOMY_LEVEL"

      - name: Run the census [census-nightly]
        id: census
        env:
          SAMPLE: ${{ github.event.inputs.sample }}
        run: |
          set -euo pipefail
          if [[ -n "${SAMPLE:-}" ]]; then
            bash scripts/ci/census.sh --sample "$SAMPLE" --write
            echo "sampled=1" >> "$GITHUB_OUTPUT"
          else
            bash scripts/ci/census.sh
            echo "sampled=0" >> "$GITHUB_OUTPUT"
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("docs/observability/ci-test-census.json"))
          c = d["counts"]
          print(f"## census {d['run_date']}")
          print(f"total {c['total']} | wired {c['wired']} | unwired {c['unwired']} | "
                f"red {c['red']} (fail {c['fail']}, timeout {c['timeout']}) | "
                f"pass {c['pass']} | skip {c['skip']} | not run {c['not_run']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-test-census-${{ github.run_id }}
          path: |
            docs/observability/CI_TEST_CENSUS.md
            docs/observability/ci-test-census.json
          if-no-files-found: warn

      - name: Open or update the census PR [census-nightly]
        if: steps.census.outputs.sampled == '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="census/nightly"
          REPO="$GITHUB_REPOSITORY"
          git config user.name "chump-census-bot"
          git config user.email "census-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/observability/CI_TEST_CENSUS.md docs/observability/ci-test-census.json
          if git diff --staged --quiet; then
            echo "[census] no change against main; nothing to publish"
            exit 0
          fi
          read -r unwired red <<<"$(python3 -c 'import json;c=json.load(open("docs/observability/ci-test-census.json"))["counts"];print(c["unwired"],c["red"])')"
          git commit -q -m "census: ${DATE} (unwired ${unwired}, red ${red})" \
            -m "Generated by .github/workflows/ci-test-census.yml (CREDIBLE-1514), run ${GITHUB_RUN_ID}."
          # The bot owns census/nightly: each night replaces the previous
          # night's commit with a fresh one on top of main.
          git push --force origin "$BRANCH"
          {
            echo "Nightly scripts/ci census (CREDIBLE-1514), run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "Counts: unwired ${unwired}, red ${red}. Lists in docs/observability/CI_TEST_CENSUS.md."
            echo "Rule: a new scripts/ci test is wired or it is deleted; red and unwired only shrink."
            echo
            echo "Count growth on this PR is reported, not failed (census/* branch)."
            echo "Add the no-auto-merge label to hold it."
            echo
            echo "🤖 Auto-generated by .github/workflows/ci-test-census.yml"
          } > "$RUNNER_TEMP/census-body.md"
          gh label create census --repo "$REPO" --color 5319e7 \
            --description "nightly scripts/ci census (CREDIBLE-1514)" 2>/dev/null || true
          PR="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number // empty')"
          if [[ -n "$PR" ]]; then
            gh pr edit "$PR" --repo "$REPO" --title "census: ${DATE}" \
              --body-file "$RUNNER_TEMP/census-body.md" --add-label census
          else
            url="$(gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "census: ${DATE}" --body-file "$RUNNER_TEMP/census-body.md" --label census)"
            PR="${url##*/}"
          fi
          echo "[census] PR #${PR}"
          # RESILIENT-1613: one arm policy. A hold label/marker wins.
          # shellcheck source=/dev/null
          source scripts/coord/lib/arm-policy.sh
          if arm_policy_allows "$PR" ci-test-census "$REPO"; then
            gh pr merge "$PR" --repo "$REPO" --auto --squash || echo "[census] arm failed (non-fatal)"
          else
            echo "[census] PR #${PR} is held by the arm policy; not arming"
          fi
