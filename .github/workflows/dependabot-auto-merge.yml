# Auto-arm `gh pr merge --auto --squash` on allowlisted PRs opened by dependabot[bot].
#
# CREDIBLE-1564: enforces arm_policy_allows AND arm_scope_allows_dependabot before
# enabling auto-merge — only semver-patch bumps (and semver-minor for dev-dependencies)
# outside `.github/` may be auto-armed; major bumps and `.github/` paths require
# review-path landing.

name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

# INFRA-1378: per-PR group, cancel-in-progress so redundant pushes deduplicate.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  arm:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout arm-policy guard (base branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: |
            scripts/coord/lib

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash) if allowlisted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          DEPENDABOT_UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDABOT_DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}
        run: |
          set -euo pipefail
          # RESILIENT-1613 + CREDIBLE-1564: enforce hold policy and dependabot scope guard.
          # shellcheck source=/dev/null
          source scripts/coord/lib/arm-policy.sh
          if ! arm_policy_allows "$PR" dependabot-auto-merge "${{ github.repository }}"; then
            echo "PR #$PR is held by arm-policy — not arming."
            exit 0
          fi
          if ! arm_scope_allows_dependabot "$PR" "${{ github.repository }}"; then
            echo "PR #$PR refused by arm_scope_allows_dependabot (major bump or .github/ path) — not arming."
            exit 0
          fi
          gh pr merge "$PR" --auto --squash \
            --repo "${{ github.repository }}" \
            || echo "auto-merge arm failed (likely already armed or no required checks); continuing"
