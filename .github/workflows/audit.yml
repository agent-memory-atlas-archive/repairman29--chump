name: Audit

# INFRA-2452: the `audit` job was previously in ci.yml, which has a workflow-level
# concurrency block with cancel-in-progress: true. When a new event hit a PR while
# audit was in-flight, the entire ci.yml run was cancelled — including the required
# `audit` job. Result: audit → CANCELLED, branch protection → FAILURE, every PR
# blocked (the gate blocks its own fix). This caused a 3h fleet-wide deadlock on
# 2026-06-02.
#
# Fix: move `audit` and `audit-required` into this dedicated workflow with their own
# concurrency (cancel-in-progress: false, per-SHA group). ci.yml's workflow-level
# cancel-in-progress: true now only applies to the cost-sensitive jobs that remain
# there (fast-checks, clippy, cargo-test, e2e, etc.).
#
# CRITICAL: job names `audit` and `audit-required` are UNCHANGED from their ci.yml
# form. Branch protection requires `audit` by name (docs/baselines/branch-protection-main.json,
# ruleset 15133729). Renaming would silently block every PR with an unsatisfied check.
#
# INFRA-2565: converted from a single 123-step serial job into 4 parallel shards
# (audit-shard matrix) + the required `audit` aggregate that needs: [audit-shard].
# Motivation: 13+ PRs blocked behind a 14-min serial audit queue on 2026-06-03;
# INFRA-2534 (cross-PR contract scan collapsed from 3× to 1×) established the scan
# is worth keeping but the serial scheduling was the bottleneck. Expected wall-clock:
# 14 min → ~4-6 min (max-of-shards, 4 parallel runners).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:

# INFRA-2516: the per-SHA group above (INFRA-2452 fix) never collided — every push
# gets a new SHA, so cancel-in-progress:false or :true made no difference; stale
# audit runs for commits a PR had already moved past just kept running to
# completion. Under multi-PR load that piled up 13 in-flight audit runs against 4
# runners and wedged the merge queue for ~30min (2026-06-03, #2981 + 3 PRs).
#
# Fix: group per PR (or per ref for push/merge_group) instead of per SHA, and flip
# cancel-in-progress back to true. A newer push to the SAME PR now cancels the
# superseded audit run for that PR instead of letting it occupy a runner slot to
# completion; the latest commit's own audit run is never the one cancelled, so
# branch protection always gets a result for HEAD. This does NOT reintroduce
# INFRA-2452: that incident was ci.yml's *workflow-wide* cancel-in-progress killing
# the required `audit` job as collateral damage from an unrelated job's fixup push.
# Here the concurrency group is scoped to audit.yml alone and keyed per-PR, so only
# a newer audit run for the SAME PR cancels an older one — never cross-PR, never
# collateral from another workflow.
#
# INFRA-1852-parity (2026-09-07): the INFRA-2516 form keyed PUSH events on
# `github.ref` (= refs/heads/main for every main push), so all main pushes shared
# ONE group under cancel-in-progress: true — each coherence-sync auto-commit
# cancelled the prior main commit's still-running audit. That was invisible to
# PR branch protection (it only cares about HEAD), but ci.yml's `verified`
# aggregate runs PER main commit and polls for THAT commit's audit lane; a
# cancelled audit never reports success, so `verified` timed out at 600s and
# fail-closed → deterministic trunk-red under rapid main pushes (~7.5h freeze
# 2026-09-07). Fix mirrors ci.yml's own INFRA-1852 concurrency split: PUSH
# events key on github.run_id (unique per run → never collides → a main push
# is never the one cancelled, every commit's audit completes and reports),
# while PR / merge_group keep per-PR/ref keying so PR fixups still cancel their
# own superseded runs (preserves the INFRA-2516 runner-pool pileup protection).
concurrency:
  group: audit-${{ github.event_name == 'push' && github.run_id || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # INFRA-2118: per-run CARGO_TARGET_DIR — prevents cross-run build artifact collisions.
  # EFFECTIVE-420: that collision hazard is real ONLY on self-hosted runners, where
  # concurrent runs share a filesystem. audit defaults to ubuntu-latest (see runs-on
  # below), an ephemeral VM where nothing can collide — and the per-run path made the
  # target dir unreachable to Swatinem/rust-cache, so only ~/.cargo was ever cached
  # (measured 2026-08-08: audit cache 207 MB vs ci-fast-checks 1159 MB). Every audit
  # run therefore recompiled all deps cold: `cargo build --bin chump` took 295s in
  # shard 1 and 300s in shard 4, against the <60s this file has promised since
  # INFRA-582. Same conditional ci.yml:652 already uses for the same reason —
  # ephemeral path when self-hosted, stable workspace path otherwise.
  CARGO_TARGET_DIR: ${{ vars.RUNNER_AUDIT != '' && format('/tmp/cargo-target-{0}-{1}', github.run_id, github.run_attempt) || format('{0}/target', github.workspace) }}
  # INFRA-2452-fix: sccache R2 env vars (mirrors ci.yml workflow-level block).
  # RUSTC_WRAPPER is NOT set here — set per-job after sccache install to avoid
  # the binary-not-on-PATH failure class documented in ci.yml lines 68-71.
  SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET || 'chump-sccache' }}
  SCCACHE_REGION: auto
  SCCACHE_ENDPOINT: ${{ secrets.R2_ACCOUNT_ID && format('https://{0}.r2.cloudflarestorage.com', secrets.R2_ACCOUNT_ID) || '' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  SCCACHE_ERROR_LOG: /tmp/sccache.log
  SCCACHE_LOG: info

jobs:
  # ── changes: docs-only lane detector (EFFECTIVE-415) ────────────────────────
  # AC #2: the 4-shard audit matrix was an unconditional 11-12 min floor on
  # every PR, including ones that touch only .md files (PR #3489, DOC-085).
  # ci.yml already has this exact docs_only signal (INFRA-1379) for clippy/
  # cargo-test/e2e — this mirrors it locally rather than cross-workflow
  # `needs:` (GitHub Actions jobs can only depend on jobs in the SAME
  # workflow file). push/merge_group always run the full matrix — the
  # dorny/paths-filter base-ref diff is only meaningful for pull_request.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true  # INFRA-1348: a filter failure must not block audit
    outputs:
      docs_only: ${{ steps.lanes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'chump-tool-macro/**'
              - 'build.rs'
              - 'tests/**'
              - 'wasm/**'
              - '.github/workflows/**'
              - 'rust-toolchain.toml'
            web:
              - 'web/**'
              - 'ChumpMenu/**'
            scripts:
              - 'scripts/**'
              - 'tools/**'
              - '.github/workflows/**'
              - 'bin/**'
              - 'launchd/**'
              - 'config/**'
              - '.release-plz.toml'
            docs:
              - 'docs/**'
              - 'book/**'
              - '*.md'
              - 'CONTRIBUTING.md'
              - 'CODE_OF_CONDUCT.md'
              - 'CHANGELOG.md'
              - 'SECURITY.md'
      - name: Compute docs_only (mirrors ci.yml INFRA-1379)
        id: lanes
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            # push-to-main / merge_group: always run the full matrix.
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rust="${{ steps.filter.outputs.rust }}"
          web="${{ steps.filter.outputs.web }}"
          scripts="${{ steps.filter.outputs.scripts }}"
          docs="${{ steps.filter.outputs.docs }}"
          if [[ "$docs" == "true" && "$rust" != "true" && "$web" != "true" && "$scripts" != "true" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # ── audit-shard ──────────────────────────────────────────────────────────────
  # INFRA-2565: 4-way parallel shard matrix replacing the single serial `audit` job.
  # Each shard runs the 8 setup steps then its share of audit gates.
  # Shard groupings:
  #   shard-1: cargo gates — steps requiring `cargo build` / CHUMP_BIN
  #   shard-2: event-registry + observability + webhook/cache telemetry
  #   shard-3: bash/script gates — coordinator, worker, bot-merge, PWA, precommit
  #   shard-4: cross-PR contract gate + security + remaining guards
  #
  # EFFECTIVE-415: skipped entirely when `changes` says docs_only=true — a
  # change that touches only .md files cannot regress a cargo build,
  # event-registry contract, or bash gate. The `audit` aggregate below
  # treats "skipped" as passing (same aggregator pattern as ci.yml's
  # clippy-required / cargo-test-required), so branch protection still
  # gets a green required check.
  audit-shard:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: audit-shard (${{ matrix.shard }})
    # INFRA-2117 (CI-REVIEW Lever 1A, 2026-05-29): audit defaults to GH-hosted ubuntu
    # to eliminate the self-hosted-Mac CI-rot tax (DOC-063 post-mortem).
    # Override: set RUNNER_AUDIT repo var to a JSON labels array if needed for diagnosis.
    runs-on: ${{ vars.RUNNER_AUDIT != '' && fromJSON(vars.RUNNER_AUDIT) || 'ubuntu-latest' }}  # INFRA-1542: lane override via repo var (unset → ubuntu-latest)
    timeout-minutes: 25  # INFRA-2452-fix: bumped 15→25 as cold-cache safety margin while sccache R2 warms
    # INFRA-1959: per-checkout state.db (CHUMP_REPO / CHUMP_LOCK_DIR for test scripts).
    env:
      CHUMP_REPO: ${{ github.workspace }}
      CHUMP_LOCK_DIR: ${{ github.workspace }}/.chump-locks
    steps:
      # ── 8 shared setup steps (replicated in every shard) ────────────────────
      - uses: actions/checkout@v7

      # INFRA-3594: cached primary path — on a warm cache, restore_pkgs.sh in
      # this action untars the previously-installed .deb contents straight
      # onto the filesystem with ZERO network calls (no apt-get update, no
      # mirror dependency at all). Only a cache miss (first run after the
      # package list or weekly version stamp changes) touches the network,
      # via apt-fast's own parallel downloader. This is what actually kills
      # the "live apt-get every PR run" flake AC1 calls out — RESILIENT-330's
      # bounded retry below only fires as a fallback on that rare miss path.
      - name: Install Linux packages for chump-desktop (cached, INFRA-3594)
        if: runner.os == 'Linux'  # INFRA-1534: macOS self-hosted skips apt
        id: apt-cached
        continue-on-error: true
        timeout-minutes: 15
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: webkit2gtk-4.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev build-essential pkg-config libssl-dev libgtk-3-dev librsvg2-dev util-linux
          version: audit-shard-v1

      - name: Install Linux packages for chump-desktop (fallback, RESILIENT-330)
        if: runner.os == 'Linux' && steps.apt-cached.outcome == 'failure'
        # RESILIENT-330: bound apt so a hung Ubuntu mirror can't consume the whole
        # 25-min job budget. Root cause (run 31863996317, audit-shard 2): apt-get
        # stalled ~24 min with no output (last line 04:16:54, then dead until
        # "The operation was canceled" at 04:41:24), hitting timeout-minutes:25 →
        # shard CANCELLED → `audit` (branch-protection required) FAIL → every PR
        # blocked → back-pressure breaker jammed → fleet halted. There was NO
        # per-step timeout or retry, so one transient mirror stall took the shard
        # down. Fix: a step-level cap well under the job budget + a per-attempt
        # `timeout` (kills a stuck connection) + retry against a fresh connection,
        # plus apt's own Acquire retries/timeouts. Common transient stall now
        # recovers in ~1 attempt instead of hanging to the wall.
        # INFRA-3594: demoted to a fallback behind the cached path above — this
        # only runs when the cache action itself failed or timed out.
        timeout-minutes: 18
        run: |
          set -uo pipefail
          pkgs="webkit2gtk-4.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev build-essential pkg-config libssl-dev libgtk-3-dev librsvg2-dev util-linux"
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          rc=1
          for attempt in 1 2 3; do
            echo "apt attempt $attempt of 3"
            # shellcheck disable=SC2086  # $apt_opts and $pkgs are space-separated arg lists — word-splitting is intended
            if timeout -k 15 90 sudo apt-get $apt_opts update \
               && timeout -k 15 180 sudo apt-get $apt_opts install -y $pkgs; then
              rc=0
              echo "apt install OK (attempt $attempt)"
              break
            fi
            echo "::warning::apt attempt $attempt failed or timed out (exit 124 = a hung mirror was killed by timeout); cleaning locks and retrying"
            sudo pkill -9 -f 'apt-get|dpkg' 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
            sudo dpkg --configure -a 2>/dev/null || true
            sleep $((attempt * 15))
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::apt-get failed after 3 bounded attempts (RESILIENT-330) — transient mirror/infra failure, not a code failure; re-run the job"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # EFFECTIVE-420. CORRECTED 2026-08-09 — the comment that shipped here
          # in #3532 asserted three things that are all false, and said
          # "verified" while doing it. On the record, because a wrong receipt in
          # the tree is worse than none: it claimed `shared-key: ci-audit` was
          # written by NOTHING, that audit triggers on pull_request only, and
          # that no `v1-trunk-ci-audit-*` entry had ever existed. In fact audit
          # triggers on push to main too (see `on:` above), five such caches
          # existed at 207 MB each, and they were restoring in 11-13s. The claim
          # came from reading 8 of the 16 entries in the cache list.
          #
          # What was actually wrong lived elsewhere and is fixed in #3534:
          # CARGO_TARGET_DIR was a per-run /tmp path, so rust-cache could only
          # ever hold ~/.cargo (207 MB) and never the compiled artifacts. The
          # cache hit on every run and had nothing useful in it.
          #
          # Why this key is still the right one: ci-fast-checks is ~1159 MB on
          # the same Linux-x64 runner over a dependency graph that overlaps
          # `cargo build --bin chump`, so it restores artifacts audit would
          # otherwise rebuild. Measured on main — audit's floor went 476s (before
          # either change) -> 318s (#3534 alone) -> 284s (both). save-if stays
          # false so INFRA-3420 holds: audit reads this cache and never writes
          # it, which also keeps it from contending with ci.yml's writer.
          shared-key: ci-fast-checks
          save-if: false
          prefix-key: "v1-trunk"

      # INFRA-2452-fix: restore sccache R2 compile cache dropped during audit extraction.
      # Mirrors the ci.yml cargo-test job pattern (lines 1245-1303).
      # RUSTC_WRAPPER is set via GITHUB_ENV after the health probe (not at workflow level)
      # to avoid binary-not-on-PATH failure on steps before sccache is installed.
      - name: Detect R2 secret presence
        id: r2detect
        env:
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          # RESILIENT-041: length floor >= 16 routes garbage creds through graceful
          # no-cache fallback instead of crashing the toolchain (mirrors ci.yml).
          if [ "${#R2_KEY}" -ge 16 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false (R2_KEY length=${#R2_KEY}, expected >= 16)" >&2
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install sccache
        if: steps.r2detect.outputs.configured == 'true'
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: sccache health probe
        # INFRA-2288: degrade to no-cache if R2 unreachable; do NOT fail the job.
        if: steps.r2detect.outputs.configured == 'true'
        run: |
          if ! sccache --start-server 2>/dev/null; then
            echo "::warning::sccache --start-server failed; falling back to no-cache (INFRA-2288)"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          else
            {
              echo "RUSTC_WRAPPER=sccache"
              echo "CARGO_INCREMENTAL=0"
              echo "SCCACHE_GHA_ENABLED=true"
            } >> "$GITHUB_ENV"
          fi

      - name: INFRA-503 — cargo audit moved to nightly cron
        run: |
          echo "::notice::cargo audit runs nightly via cargo-audit-nightly.yml (INFRA-503)"
          echo "      Per-PR audit was 12min × every PR; advisory DB updates daily."

      # ── shard-1: cargo gates ─────────────────────────────────────────────────
      # Steps requiring `cargo build` / CHUMP_BIN binary, plus cargo-structural tests.
      - name: chump gap list domain summary + test-filter (INFRA-431)
        if: matrix.shard == 1
        # INFRA-582: switched from --release to debug build; release compile was
        # 9+ min cold. Debug with shared cache completes in <60s.
        # INFRA-1600 follow-up: honor $CARGO_TARGET_DIR (shared cache on self-hosted
        # runners redirects build output away from $(pwd)/target).
        run: |
          cargo build --bin chump 2>&1 | tail -3
          REPO_ROOT="$(pwd)"
          export REPO_ROOT
          source scripts/ci/lib/discover-chump-bin.sh
          bash scripts/ci/test-gap-list-domain-summary.sh

      - name: chump gap list done-format — closed-pr + closed-date (EFFECTIVE-024)
        if: matrix.shard == 1
        run: |
          cargo build --bin chump 2>&1 | tail -3
          REPO_ROOT="$(pwd)"
          export REPO_ROOT
          source scripts/ci/lib/discover-chump-bin.sh
          bash scripts/ci/test-gap-list-done-format.sh

      - name: outcome gate — P0/P1 blocked w/o outcome, empty-DB skip, audited flag (MISSION-045)
        if: matrix.shard == 1
        # Single-line run so the preflight-CI-parity parser (INFRA-1867, reads
        # only the first run line) sees the mirrored script; the test self-builds
        # the chump binary when it is missing.
        run: bash scripts/ci/test-outcome-gate.sh

      - name: gap-store single source of truth — sqlite canonical, postgrest dormant, no silent 2nd store (RESILIENT-1057)
        if: matrix.shard == 1
        # Pure shell source-inspection; guards against reintroducing the gap-store
        # split-brain ([[gap-store-split-brain-swamp]]). Runtime parity is checked
        # on-node by scripts/coord/gap-store-single-source-check.sh.
        run: bash scripts/ci/test-gap-store-single-source.sh

      - name: farmer stale-lease heartbeat — a present lease must never crash the tick (RESILIENT-313)
        if: matrix.shard == 1
        # Runs ON LINUX by design (test-farmer.sh SKIPs non-Darwin and never
        # caught the `stat -f %m` crash). Pure shell, no chump binary needed.
        run: bash scripts/ci/test-farmer-stale-lease-heartbeat.sh

      - name: opencode harness smoke — build_harness_cmd argv + live spawn (EFFECTIVE-323)
        if: matrix.shard == 1
        # Single-line run (INFRA-1867 parity parser reads only the first line).
        # LIVE=0: Tier-1 wiring is the gate; Tier-2 live spawn is a local-dev aid.
        run: CHUMP_HARNESS_SMOKE_LIVE=0 bash scripts/ci/test-opencode-harness-smoke.sh

      - name: opencode-harness install smoke — born-wired opencode+Almanac (EFFECTIVE-320)
        if: matrix.shard == 1
        # Single-line run (INFRA-1867 parity parser reads only the first line).
        run: bash scripts/ci/test-opencode-harness-install.sh

      - name: state.db corruption recovery — restore from state.sql (INFRA-538)
        if: matrix.shard == 1
        run: |
          CHUMP_BIN="${CARGO_TARGET_DIR:-$(pwd)/target}/debug/chump" \
            bash scripts/ci/test-state-db-restore.sh

      - name: PWA gap workflow e2e — 4-phase stub + status transition (CREDIBLE-020)
        if: matrix.shard == 1
        run: |
          CHUMP_BIN="${CARGO_TARGET_DIR:-$(pwd)/target}/debug/chump" \
            bash scripts/ci/test-pwa-e2e-gap-workflow.sh

      - name: waste-tally --domain — token budget by domain, breach exit code (INFRA-934)
        if: matrix.shard == 1
        run: |
          cargo build --bin chump 2>&1 | tail -3
          bash scripts/ci/test-waste-tally-domain.sh

      - name: gap audit-ac --open — warn on vague open gaps before claim (INFRA-936)
        if: matrix.shard == 1
        run: |
          cargo build --bin chump 2>&1 | tail -2
          CHUMP_BIN="${CARGO_TARGET_DIR:-$(pwd)/target}/debug/chump" bash scripts/ci/test-gap-audit-ac-open.sh

      - name: UUID gap-ID compatibility audit — preflight+show+auto-derive (INFRA-630)
        if: matrix.shard == 1
        run: |
          CHUMP_BIN="${CARGO_TARGET_DIR:-$(pwd)/target}/debug/chump" bash scripts/ci/test-uuid-gap-id-compat.sh

      - name: gap show AC rendering — numbered list + json ac_count/ac_has_todos (CREDIBLE-033)
        if: matrix.shard == 1
        run: |
          cargo build --bin chump 2>&1 | tail -2
          CHUMP_BIN="${CARGO_TARGET_DIR:-$(pwd)/target}/debug/chump" bash scripts/ci/test-gap-show-ac-render.sh

      - name: chump gap set --add-note timestamped append (EFFECTIVE-020)
        if: matrix.shard == 1
        run: |
          cargo build --bin chump 2>&1 | tail -2
          CHUMP_BIN="${CARGO_TARGET_DIR:-$(pwd)/target}/debug/chump" bash scripts/ci/test-gap-add-note.sh

      - name: CLI output format consistency — --quiet/--format/--json (EFFECTIVE-008)
        if: matrix.shard == 1
        run: |
          CHUMP_BIN="${CARGO_TARGET_DIR:-$(pwd)/target}/debug/chump" bash scripts/ci/test-cli-output-format.sh

      - name: gap consolidate — near-duplicate title detection (INFRA-935)
        if: matrix.shard == 1
        run: |
          cargo build --bin chump 2>&1 | tail -2
          CHUMP_BIN="${CARGO_TARGET_DIR:-$(pwd)/target}/debug/chump" bash scripts/ci/test-gap-consolidate.sh

      - name: audit log query/retention smoke test — CP-010 vendored AuditLogger (INFRA-1842)
        if: matrix.shard == 1
        run: |
          cargo build --bin chump 2>&1 | tail -2
          CHUMP_BIN="${CARGO_TARGET_DIR:-$(pwd)/target}/debug/chump" bash scripts/ci/test-audit-log.sh

      - name: PWA gap endpoint security — rate limit, CSRF, headers, timeout (CREDIBLE-023)
        if: matrix.shard == 1
        run: |
          CHUMP_BIN="${CARGO_TARGET_DIR:-$(pwd)/target}/debug/chump" \
            bash scripts/ci/test-pwa-security.sh

      - name: release --lease <ID> flag — named session release (INFRA-1026)
        if: matrix.shard == 1
        run: |
          CHUMP_BIN="${CARGO_TARGET_DIR:-$(pwd)/target}/debug/chump" \
            bash scripts/ci/test-release-lease-flag.sh

      - name: chump gap list --since filter (EFFECTIVE-018)
        if: matrix.shard == 1
        run: |
          cargo build --bin chump 2>&1 | tail -3
          CHUMP_BIN="${CARGO_TARGET_DIR:-$(pwd)/target}/debug/chump" \
            bash scripts/ci/test-gap-list-since.sh

      - name: /api/gap-queue fat shape — 15 fields, filters, sort, pillar derivation, ambient signal (INFRA-1197)
        if: matrix.shard == 1
        run: |
          cargo build --bin chump 2>&1 | tail -3
          CHUMP_BIN="${CARGO_TARGET_DIR:-$(pwd)/target}/debug/chump" \
            bash scripts/ci/test-api-gap-queue-shape.sh

      - name: cross-PR contract gate — refuse merge on cross-PR IPC schema mismatch (INFRA-2406)
        if: matrix.shard == 1
        # Requires GH_TOKEN for gh pr list (Tier-D — cannot mirror in local preflight).
        # Calls chump contract-scan --in-flight against all open PRs.
        # On mismatch: emits kind=cross_pr_contract_mismatch to ambient.jsonl, exits 1.
        # Operator zero-bypass: NO env-var bypass. Exceptions go in cross-pr-allowlist.txt.
        # See INFRA-2404 (root cause), INFRA-2405 (contract-scan subcommand).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --bin chump 2>&1 | tail -3
          REPO_ROOT="$(pwd)"
          export REPO_ROOT
          source scripts/ci/lib/discover-chump-bin.sh
